<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#a3325c">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Rosy Retail</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&family=Playfair+Display:wght@600&family=Mulish:wght@400;600;700&display=swap">
<style>
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.45}
[hidden]{display:none!important}
#app{position:relative;max-width:520px;margin:0 auto;height:100%;background:var(--surface-2);display:flex;flex-direction:column;box-shadow:0 0 0 1px var(--line)}
@media print{body *{visibility:hidden!important}#printArea,#printArea *{visibility:visible!important}#printArea{position:absolute;left:0;top:0}}
#printArea{display:none}
@media print{#printArea{display:block}#printArea .receipt{box-shadow:none;border-radius:0;padding:0 2mm}}

:root{
  --bg:#f3eced; --panel:#faf6f7; --surface:#ffffff; --surface-2:#fbf6f8; --ink:#27181f; --muted:#7b6870; --line:#ecdfe4;
  --accent:#a3325c; --accent-ink:#ffffff; --accent-soft:#f8e4ec; --bar:#e8c3d1;
  --priv:#5d4a93; --priv-soft:#ece7f7;
  --good:#2e7b55; --good-soft:#e1f1e8; --warn:#a86a12; --warn-soft:#fbefd9; --bad:#b8323a; --bad-soft:#fbe3e4;
  --frame:#1d1418; --shadow:0 30px 60px -30px rgba(80,20,45,.35);
  --display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body:"Manrope", "Segoe UI", system-ui, sans-serif;
  --mono:"JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#140e11; --panel:#1b1317; --surface:#21181c; --surface-2:#291e23; --ink:#f4e9ee; --muted:#b39fa8; --line:#3a2c33;
    --accent:#e27aa0; --accent-ink:#2a0f1a; --accent-soft:#3e2130; --bar:#5a3244;
    --priv:#bcaaf2; --priv-soft:#2d2640;
    --good:#6cc596; --good-soft:#1c3328; --warn:#e7b25a; --warn-soft:#3a2c14; --bad:#f07a80; --bad-soft:#3d1c20;
    --frame:#000; --shadow:0 30px 60px -30px rgba(0,0,0,.8);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#140e11; --panel:#1b1317; --surface:#21181c; --surface-2:#291e23; --ink:#f4e9ee; --muted:#b39fa8; --line:#3a2c33;
  --accent:#e27aa0; --accent-ink:#2a0f1a; --accent-soft:#3e2130; --bar:#5a3244;
  --priv:#bcaaf2; --priv-soft:#2d2640;
  --good:#6cc596; --good-soft:#1c3328; --warn:#e7b25a; --warn-soft:#3a2c14; --bad:#f07a80; --bad-soft:#3d1c20;
  --frame:#000; --shadow:0 30px 60px -30px rgba(0,0,0,.8);
}
*{box-sizing:border-box}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ---------- phone ---------- */
.status{display:flex;justify-content:space-between;align-items:center;padding:8px 16px 4px;font-size:12px;font-weight:700;background:var(--surface-2);flex:none}
.sync{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--good-soft);color:var(--good)}
.sync i{width:6px;height:6px;border-radius:50%;background:currentColor}
.sync.off{background:var(--warn-soft);color:var(--warn)}
.scr{flex:1;overflow-y:auto;overflow-x:hidden;scrollbar-width:none}
.scr::-webkit-scrollbar{display:none}
.nav{flex:none;display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--surface);border-top:1px solid var(--line);padding:6px 6px calc(8px + env(safe-area-inset-bottom,0px))}
.nav button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:700;color:var(--muted);padding:6px 2px;border-radius:12px}
.nav button.on{color:var(--accent)}
.nav button.on svg{background:var(--accent-soft);border-radius:999px;padding:3px 12px;width:46px;height:28px;box-sizing:border-box}
.nav svg{width:22px;height:22px;padding:3px 0;height:28px}
.toast{position:fixed;left:50%;transform:translateX(-50%);width:min(488px,calc(100% - 32px));bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:50;background:var(--ink);color:var(--surface);padding:12px 14px;border-radius:12px;font-weight:600;font-size:13px;box-shadow:0 10px 30px rgba(0,0,0,.25);transition:opacity .25s, transform .25s}
.toast[hidden]{display:block!important;opacity:0;transform:translate(-50%,8px);pointer-events:none}

/* ---------- app ui ---------- */
.pad{padding:8px 16px 24px;display:flex;flex-direction:column;gap:16px}
.greet{display:flex;justify-content:space-between;align-items:center;gap:12px}
.greet h2{font-family:var(--display);font-size:24px;font-weight:700;margin:2px 0 0;letter-spacing:-.01em}
.avatar{width:40px;height:40px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:800;border:0;flex:none}
.hero{background:var(--accent);color:var(--accent-ink);border-radius:20px;padding:18px}
.hero .k-label{margin:0;font-size:12px;font-weight:700;opacity:.85;text-transform:uppercase;letter-spacing:.08em}
.hero .k-big{font-family:var(--display);font-size:38px;font-weight:800;margin:2px 0 12px;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.hero .k-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;border-top:1px solid color-mix(in srgb,var(--accent-ink) 25%,transparent);padding-top:12px}
.hero .k-row span{display:block;font-size:11px;opacity:.8;font-weight:600}
.hero .k-row b{font-size:16px;font-variant-numeric:tabular-nums}
.progress{height:10px;border-radius:999px;background:color-mix(in srgb,var(--accent-ink) 25%,transparent);overflow:hidden;margin:6px 0 8px}
.progress i{display:block;height:100%;background:var(--accent-ink);border-radius:999px}
.kgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px}
.kpi span{display:flex;align-items:center;gap:5px;font-size:11.5px;color:var(--muted);font-weight:600}
.kpi b{display:block;font-size:18px;font-variant-numeric:tabular-nums;margin-top:2px}
.kpi.p{background:var(--priv-soft);border-color:transparent}
.kpi.p span,.kpi.p b{color:var(--priv)}
.sec{font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:4px 0 -6px;font-weight:800}
.qa{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.qa button{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 6px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;font-weight:700}
.qa svg{width:22px;height:22px;color:var(--accent)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px}
.card-h{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.card-h h3{margin:0;font-size:15px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin-inline:-16px;padding-inline:16px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 11px;font-size:12px;font-weight:700;color:var(--muted);white-space:nowrap}
.chip.on{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.chart-total{font-size:13px;color:var(--muted);margin:0 0 4px}
.chart-total b{color:var(--ink);font-variant-numeric:tabular-nums}
svg.chart{width:100%;height:auto;display:block}
svg.chart .grid{stroke:var(--line);stroke-width:1}
svg.chart text{fill:var(--muted);font-size:9.5px;font-family:var(--body);font-weight:600}
svg.chart .b{fill:var(--bar)}
svg.chart .b.last{fill:var(--accent)}
svg.chart text.val{fill:var(--accent);font-weight:800;font-size:10px}
.rows{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.row:first-child{border-top:0;padding-top:2px}
.row .grow{flex:1;min-width:0}
.row .grow b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .grow span{display:block;font-size:12px;color:var(--muted)}
.row .end{text-align:right;font-variant-numeric:tabular-nums}
.row .end b{display:block}
.row .end span{font-size:12px;color:var(--muted)}
.mono{font-family:var(--mono);font-size:11.5px!important;letter-spacing:-.01em}
.thumb{flex:none;border-radius:12px;display:grid;place-items:center;background:linear-gradient(150deg,color-mix(in srgb,var(--c) 70%,#fff) 0%,var(--c) 100%);overflow:hidden}
.thumb svg{width:55%;height:55%;color:rgba(255,255,255,.9)}
.thumb img{width:100%;height:100%;object-fit:cover}
.bar{height:6px;border-radius:999px;background:var(--line);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:999px}
.bar.good i{background:var(--good)}
.priv{display:inline-flex;align-items:center;gap:4px;background:var(--priv-soft);color:var(--priv);font-weight:700;font-size:11.5px;padding:2px 7px;border-radius:6px;white-space:nowrap;font-variant-numeric:tabular-nums}
.spec span svg{width:11px;height:11px;vertical-align:-1px}
.priv svg,.kpi span svg{width:11px;height:11px}
.note{display:flex;gap:8px;align-items:flex-start;background:var(--surface);border:1px dashed var(--line);border-radius:12px;padding:10px 12px;font-size:12.5px;color:var(--muted)}
.note svg{width:16px;height:16px;flex:none;margin-top:1px}

.topbar{display:flex;align-items:center;gap:8px;padding:6px 12px 4px;position:sticky;top:0;background:var(--surface-2);z-index:2}
.topbar h2{font-family:var(--display);font-size:20px;margin:0;flex:1;font-weight:700}
.icon-btn{width:38px;height:38px;border-radius:12px;border:0;background:transparent;display:grid;place-items:center;flex:none}
.icon-btn svg{width:22px;height:22px}
.ghost-btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:7px 11px;font-weight:700;font-size:12.5px;display:inline-flex;gap:6px;align-items:center}
.ghost-btn svg{width:16px;height:16px}

.bill-head{display:grid;grid-template-columns:1.1fr 1.3fr .9fr;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.bill-head span{display:block;font-size:10.5px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.bill-head b{font-size:12.5px;font-variant-numeric:tabular-nums}
.search{display:flex;gap:8px}
.search .inp{flex:1;display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:0 12px;min-width:0}
.search .inp svg{width:18px;height:18px;color:var(--muted);flex:none}
.search input{border:0;background:transparent;padding:11px 0;width:100%;min-width:0;outline:none}
.scan-btn{border:0;background:var(--ink);color:var(--surface);border-radius:12px;padding:0 14px;display:flex;align-items:center;gap:6px;font-weight:700}
.scan-btn svg{width:18px;height:18px}
.results{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:4px 12px;margin-top:-8px}
.results .row{cursor:pointer}
.line{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:10px}
.line-top{display:flex;gap:12px;align-items:flex-start}
.line-top .grow{flex:1;min-width:0}
.line-top b{display:block}
.line-top span{display:block;font-size:12px;color:var(--muted)}
.x{border:0;background:var(--surface-2);width:28px;height:28px;border-radius:8px;font-size:18px;line-height:1;color:var(--muted);flex:none}
.line-ctl{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:end}
.fl{display:flex;flex-direction:column;gap:4px}
.fl label,.fl .lab{font-size:11px;font-weight:700;color:var(--muted)}
.fl.r{text-align:right}
.fl.r b{font-size:17px;font-variant-numeric:tabular-nums}
.stepper{display:flex;align-items:center;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.stepper button{border:0;background:var(--surface-2);width:34px;height:36px;font-size:18px;font-weight:700}
.stepper span{min-width:34px;text-align:center;font-weight:800;font-variant-numeric:tabular-nums}
.money{border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:8px 10px;width:100%;font-variant-numeric:tabular-nums;font-weight:700;min-width:0}
.line-err{margin:0;font-size:12px;font-weight:700;color:var(--bad);background:var(--bad-soft);padding:6px 9px;border-radius:8px}
.line-priv{display:flex;gap:6px;flex-wrap:wrap}
.totals{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.tl{display:flex;justify-content:space-between;font-variant-numeric:tabular-nums}
.tl span{color:var(--muted);font-weight:600}
.tl.big{border-top:1px solid var(--line);padding-top:8px;margin-top:2px;font-size:18px}
.tl.big span{color:var(--ink);font-weight:800}
.tl.big b{font-family:var(--display);font-size:22px}
.privbox{background:var(--priv-soft);border-radius:10px;padding:8px 10px;display:flex;flex-direction:column;gap:4px;margin-top:4px}
.privbox .tl span,.privbox .tl b{color:var(--priv)}
.privbox .cap{font-size:10.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--priv);display:flex;gap:5px;align-items:center}
.privbox .cap svg{width:11px;height:11px}
.primary{border:0;background:var(--accent);color:var(--accent-ink);border-radius:14px;padding:15px;font-weight:800;font-size:15px;width:100%;letter-spacing:.02em}
.primary:disabled{opacity:.4;cursor:not-allowed}
.secondary{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:13px;font-weight:700;width:100%}
.empty{text-align:center;color:var(--muted);padding:26px 10px;border:1px dashed var(--line);border-radius:16px;font-size:13px}

.pcard{display:flex;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:10px;cursor:pointer;text-align:left;width:100%}
.pcard .grow{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.pcard .grow b{font-size:14px}
.pcard .grow span{font-size:12px;color:var(--muted)}
.pcard .meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:4px}
.price{font-weight:800;font-variant-numeric:tabular-nums;font-size:15px}
.stock{font-size:11px;font-weight:800;padding:2px 7px;border-radius:6px;background:var(--good-soft);color:var(--good)}
.stock.low{background:var(--warn-soft);color:var(--warn)}
.stock.out{background:var(--bad-soft);color:var(--bad)}
.fab{position:sticky;bottom:12px;margin-left:auto;display:flex;align-items:center;gap:6px;border:0;background:var(--accent);color:var(--accent-ink);font-weight:800;padding:13px 18px;border-radius:16px;box-shadow:0 10px 24px -8px rgba(120,20,60,.5)}
.fab svg{width:18px;height:18px}

.photo-big{border-radius:18px;aspect-ratio:1/1;width:100%;max-width:100%}
.photo-big svg{width:40%;height:40%}
.gallery{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.gallery div{aspect-ratio:1;border-radius:10px}
.slot{border:1.5px dashed var(--line);display:grid;place-items:center;color:var(--muted);font-size:20px}
.spec{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.spec div{background:var(--surface);padding:9px 11px}
.spec span{display:block;font-size:11px;color:var(--muted);font-weight:700}
.spec b{font-variant-numeric:tabular-nums}
.spec div.p{background:var(--priv-soft)}
.spec div.p span,.spec div.p b{color:var(--priv)}
.btn-row{display:grid;grid-template-columns:1fr 1fr;gap:8px}

.form{display:flex;flex-direction:column;gap:12px}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.f{display:flex;flex-direction:column;gap:4px;min-width:0}
.f.full{grid-column:1/-1}
.f label{font-size:11.5px;font-weight:700;color:var(--muted);display:flex;gap:6px;align-items:center}
.f input,.f select{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 11px;width:100%;min-width:0}
.f.p input{background:var(--priv-soft);border-color:transparent;color:var(--priv);font-weight:700}
.f small{color:var(--muted);font-size:11px}
.photo-box{border:1.5px dashed var(--accent);border-radius:18px;padding:14px;display:flex;flex-direction:column;align-items:center;gap:12px;background:var(--accent-soft)}
.photo-prev{width:132px;height:132px;border-radius:16px}
.photo-btns{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:100%}
.photo-btns label,.photo-btns button{display:flex;flex-direction:column;align-items:center;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 4px;font-size:11.5px;font-weight:800;cursor:pointer;text-transform:uppercase;letter-spacing:.04em}
.photo-btns svg{width:20px;height:20px;color:var(--accent)}
.visually-hidden{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

.viewfinder{margin:0 16px;height:300px;border-radius:22px;background:#0f0b0d;position:relative;overflow:hidden;display:grid;place-items:center}
.viewfinder::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 45%,#3a2a31 0%,#0f0b0d 70%)}
.vf-frame{position:relative;width:230px;height:130px;border-radius:14px;box-shadow:0 0 0 999px rgba(0,0,0,.35)}
.vf-frame i{position:absolute;width:26px;height:26px;border-color:#fff;border-style:solid;border-width:0}
.vf-frame i:nth-child(1){top:0;left:0;border-top-width:3px;border-left-width:3px;border-top-left-radius:12px}
.vf-frame i:nth-child(2){top:0;right:0;border-top-width:3px;border-right-width:3px;border-top-right-radius:12px}
.vf-frame i:nth-child(3){bottom:0;left:0;border-bottom-width:3px;border-left-width:3px;border-bottom-left-radius:12px}
.vf-frame i:nth-child(4){bottom:0;right:0;border-bottom-width:3px;border-right-width:3px;border-bottom-right-radius:12px}
.laser{position:absolute;left:12px;right:12px;height:2px;background:#ff5d8f;box-shadow:0 0 12px #ff5d8f;top:50%;animation:sweep 1.8s ease-in-out infinite alternate}
@keyframes sweep{from{top:14%}to{top:86%}}
@media (prefers-reduced-motion:reduce){.laser{animation:none}}
.vf-hint{position:absolute;bottom:16px;left:0;right:0;text-align:center;color:#fff;font-weight:700;font-size:13px}
.result-card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:12px}
.nf{text-align:center;display:flex;flex-direction:column;gap:6px;align-items:center}
.nf .ic{width:52px;height:52px;border-radius:50%;background:var(--bad-soft);color:var(--bad);display:grid;place-items:center}
.nf .ic svg{width:26px;height:26px}
.nf h3{margin:4px 0 0;font-size:18px}

.tabs{display:grid;grid-template-columns:repeat(3,1fr);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:3px}
.tabs button{border:0;background:transparent;padding:8px;border-radius:9px;font-weight:700;color:var(--muted)}
.tabs button.on{background:var(--accent-soft);color:var(--accent)}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums;font-size:12.5px}
th,td{padding:9px 9px;text-align:right;white-space:nowrap;border-top:1px solid var(--line)}
th{border-top:0;font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:800;background:var(--surface-2)}
th button{border:0;background:none;font:inherit;color:inherit;letter-spacing:inherit;text-transform:inherit;padding:0;cursor:pointer}
th.on,th.on button{color:var(--accent)}
th:first-child,td:first-child{text-align:left;position:sticky;left:0;background:inherit}
td:first-child{background:var(--surface);font-weight:700}
td.pv{color:var(--priv);font-weight:700}
tr.tot td{font-weight:800;background:var(--surface-2)}
.cat-row{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:9px 0;border-top:1px solid var(--line)}
.cat-row:first-child{border-top:0}
.cat-row b{font-size:13.5px}
.cat-row .v{text-align:right;font-weight:800;font-variant-numeric:tabular-nums}
.cat-row .bar{grid-column:1/-1;margin-top:2px}
.cat-row small{color:var(--muted);font-size:11.5px}
.month-row{display:grid;grid-template-columns:110px 1fr 54px;gap:10px;align-items:center;padding:6px 0;font-variant-numeric:tabular-nums}
.month-row .bar{margin:0;height:8px}
.month-row b{text-align:right}
select.sel{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 12px;width:100%;font-weight:700}

.list-btn{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:13px 14px;font-weight:700}
.list-btn svg{width:20px;height:20px;color:var(--accent);flex:none}
.list-btn span{flex:1}
.list-btn small{display:block;color:var(--muted);font-weight:500;font-size:12px}
.list-btn .chev{color:var(--muted);width:16px;height:16px}
.staff-card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:8px}
.staff-card .top{display:flex;align-items:center;gap:12px}
.staff-card .top .grow{flex:1}
.staff-card .top b{display:block;font-size:15px}
.staff-card .top span{font-size:12px;color:var(--muted)}
.sm-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;font-variant-numeric:tabular-nums}
.sm-grid span{display:block;font-size:11px;color:var(--muted);font-weight:700}
.sm-grid b{font-size:13.5px}
.edit{background:var(--surface-2);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px}
.cat-chips{display:flex;flex-wrap:wrap;gap:6px}
.cat-chips span{display:inline-flex;align-items:center;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:5px 6px 5px 11px;font-size:12.5px;font-weight:700}
.cat-chips button{border:0;background:var(--surface-2);width:20px;height:20px;border-radius:50%;line-height:1;color:var(--muted)}
.inline-add{display:flex;gap:8px}
.inline-add input{flex:1;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 11px;min-width:0}
.inline-add button{border:0;background:var(--ink);color:var(--surface);border-radius:10px;padding:0 14px;font-weight:700}
.setting{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.setting:first-of-type{border-top:0}
.setting b{display:block;font-size:13.5px}
.setting small{color:var(--muted);font-size:12px}
.setting input[type=number]{width:70px;border:1px solid var(--line);border-radius:10px;padding:8px;background:var(--surface-2);text-align:right;font-weight:700}

.login{min-height:100%;display:flex;flex-direction:column;justify-content:center;padding:24px 24px 40px;gap:26px}
.brand{font-family:var(--display);font-weight:800;font-size:56px;letter-spacing:.06em;line-height:1;color:var(--accent)}
.brand-sub{font-weight:700;color:var(--muted);margin-top:6px}
.login .f input{padding:13px 12px;font-size:15px}
.remember{display:flex;gap:8px;align-items:center;font-weight:600;font-size:13px}
.remember input{accent-color:var(--accent);width:16px;height:16px}
.demo-as{font-size:12px;color:var(--muted);text-align:center}
.ok-mark{width:64px;height:64px;border-radius:50%;background:var(--good-soft);color:var(--good);display:grid;place-items:center;margin:12px auto 0}
.ok-mark svg{width:32px;height:32px}
.center{text-align:center}
.center h2{font-family:var(--display);margin:8px 0 2px;font-size:22px}
.center p{margin:0;color:var(--muted)}
.bill-line{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-variant-numeric:tabular-nums}
.bill-line:first-child{border-top:0}
.bill-line span{color:var(--muted);font-size:12px;display:block}
.pill-state{font-size:11px;font-weight:800;padding:2px 8px;border-radius:999px;background:var(--good-soft);color:var(--good)}
.pill-state.wait{background:var(--warn-soft);color:var(--warn)}

/* ---------- multi-business additions ---------- */
.biz-pill{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 10px 5px 6px;font-weight:800;font-size:12.5px;max-width:100%}
.biz-pill .dot{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:10px;font-weight:800;flex:none}
.biz-pill svg{width:14px;height:14px;color:var(--muted)}
.biz-seg{display:flex;flex-wrap:wrap;gap:8px}
.biz-seg button{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 12px;font-weight:700;text-align:left}
.biz-seg button small{display:block;font-weight:500;color:var(--muted);font-size:11.5px}
.biz-seg button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.biz-seg button:disabled{opacity:.45;cursor:not-allowed}
.biz-seg .dot{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;color:#fff;font-weight:800;font-size:12px;flex:none}
.cat-tiles{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin-inline:-16px;padding-inline:16px;padding-bottom:2px}
.cat-tiles::-webkit-scrollbar{display:none}
.cat-tile{flex:none;width:86px;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:10px 6px 8px;display:flex;flex-direction:column;align-items:center;gap:5px;font-size:11.5px;font-weight:700;line-height:1.2;text-align:center}
.cat-tile .ci{width:36px;height:36px;border-radius:11px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center}
.cat-tile .ci svg{width:20px;height:20px}
.cat-tile small{color:var(--muted);font-weight:600;font-size:10.5px}
.cat-tile.on{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.cat-tile.on .ci{background:color-mix(in srgb,var(--surface) 18%,transparent);color:var(--surface)}
.cat-tile.on small{color:color-mix(in srgb,var(--surface) 70%,transparent)}
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.gcard{position:relative;border:1px solid var(--line);background:var(--surface);border-radius:16px;padding:0;overflow:hidden;text-align:left;display:flex;flex-direction:column}
.gcard .thumb{border-radius:0;width:100%!important;height:auto!important;aspect-ratio:1/1}
.gcard .thumb svg{width:42%;height:42%}
.gcard .gb{padding:8px 10px 10px;display:flex;flex-direction:column;gap:2px;min-width:0}
.gcard .gb b{font-size:13px;line-height:1.25}
.gcard .gb .mono{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gcard .gb .gp{display:flex;justify-content:space-between;align-items:center;gap:4px;margin-top:3px}
.gcard .inbill{position:absolute;top:8px;right:8px;background:var(--accent);color:var(--accent-ink);font-size:11px;font-weight:800;padding:2px 8px;border-radius:999px}
.gcard.out{opacity:.55}
.billbar{position:sticky;bottom:10px;display:flex;align-items:center;gap:10px;background:var(--ink);color:var(--surface);border-radius:16px;padding:10px 10px 10px 14px;box-shadow:0 12px 26px -10px rgba(0,0,0,.45)}
.billbar .grow{flex:1;min-width:0}
.billbar small{display:block;opacity:.7;font-size:11.5px;font-weight:600}
.billbar b{font-size:17px;font-variant-numeric:tabular-nums}
.billbar button{border:0;background:var(--accent);color:var(--accent-ink);border-radius:12px;padding:11px 14px;font-weight:800}
.billbar.empty{background:var(--surface);color:var(--muted);border:1px dashed var(--line);box-shadow:none;justify-content:center;font-weight:600;padding:14px}
.overlay{position:absolute;inset:0;z-index:20;display:flex;flex-direction:column;justify-content:flex-end}
.overlay-bg{position:absolute;inset:0;background:rgba(20,8,14,.5);border:0;padding:0;cursor:default}
.sheet{position:relative;background:var(--surface);border-radius:24px 24px 0 0;max-height:88%;overflow-y:auto;animation:up .22s ease-out;scrollbar-width:none}
@keyframes up{from{transform:translateY(30px);opacity:.4}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
.grab{width:40px;height:4px;border-radius:4px;background:var(--line);margin:8px auto 0}
.sh-photo{padding:10px 16px 0}
.sh-photo .thumb{border-radius:18px}
.sh-body{padding:12px 16px 18px;display:flex;flex-direction:column;gap:12px}
.sh-body h3{margin:0;font-family:var(--display);font-size:20px}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tag{font-size:11.5px;font-weight:700;padding:3px 8px;border-radius:7px;background:var(--surface-2);border:1px solid var(--line)}
.sh-grid{display:grid;grid-template-columns:auto 1fr 1fr;gap:10px;align-items:end}
.code{text-transform:uppercase;font-family:var(--mono);letter-spacing:.14em}
.decode{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;background:var(--surface-2);border-radius:12px;padding:10px 12px}
.decode .amt{font-size:13px;color:var(--muted);font-weight:600}
.decode .amt b{display:block;color:var(--ink);font-size:20px;font-family:var(--display);font-variant-numeric:tabular-nums}
.hint{font-size:11.5px;color:var(--muted);margin:0}
.warnline{margin:0;font-size:12px;font-weight:700;color:var(--warn);background:var(--warn-soft);padding:6px 9px;border-radius:8px}
.key{display:grid;grid-template-columns:repeat(10,1fr);border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface);max-width:420px}
.key div{text-align:center;padding:6px 0;border-left:1px solid var(--line)}
.key div:first-child{border-left:0}
.key b{display:block;font-family:var(--mono);font-size:15px;color:var(--accent)}
.key span{display:block;font-size:12px;color:var(--muted);font-weight:700;font-variant-numeric:tabular-nums;border-top:1px solid var(--line);padding-top:4px;margin-top:4px}
.tester{display:flex;gap:10px;align-items:center;margin-top:10px;flex-wrap:wrap}
.tester input{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 11px;width:170px;max-width:100%}
.tester output{font-weight:800;font-variant-numeric:tabular-nums}
.tester output.bad{color:var(--bad)}
.all-biz .row{cursor:pointer}
.bdot{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;color:#fff;font-weight:800;flex:none}

/* ---------- simple item selection ---------- */
.cgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ctile{border:1px solid var(--line);background:var(--surface);border-radius:16px;padding:14px 12px;display:flex;align-items:center;gap:10px;text-align:left;min-width:0}
.ctile .ci{width:40px;height:40px;border-radius:12px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;flex:none}
.ctile .ci svg{width:22px;height:22px}
.ctile b{display:block;font-size:13.5px;line-height:1.2}
.ctile small{color:var(--muted);font-size:11.5px;font-weight:600}
.ctile.add{border-style:dashed;color:var(--muted);justify-content:center;font-weight:700}
.crumb{display:flex;align-items:center;gap:10px}
.crumb .ci{width:38px;height:38px;border-radius:12px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;flex:none}
.crumb .ci svg{width:21px;height:21px}
.crumb .grow{flex:1;min-width:0}
.crumb b{display:block;font-size:17px;font-family:var(--display)}
.crumb small{color:var(--muted);font-size:12px}
.igrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.itile{position:relative;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:12px 6px 10px;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;min-height:92px;justify-content:center}
.itile .ii{width:30px;height:30px;border-radius:9px;background:var(--surface-2);color:var(--accent);display:grid;place-items:center}
.itile .ii svg{width:18px;height:18px}
.itile b{font-size:12.5px;line-height:1.2}
.itile small{font-size:11px;color:var(--muted);font-weight:700;font-variant-numeric:tabular-nums}
.itile .inbill{position:absolute;top:-6px;right:-4px;background:var(--accent);color:var(--accent-ink);font-size:10.5px;font-weight:800;padding:1px 7px;border-radius:999px}
.itile.add{border-style:dashed;color:var(--muted);font-weight:700;font-size:12px}
.itile.add svg{width:20px;height:20px}
.entry-h{display:flex;gap:12px;align-items:center}
.entry-h .ci{width:52px;height:52px;border-radius:16px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;flex:none}
.entry-h .ci svg{width:28px;height:28px}
.entry-h h3{margin:0}
.entry-h span{font-size:12.5px;color:var(--muted);font-weight:600}
.line .line-top .li{width:44px;height:44px;border-radius:12px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;flex:none}
.line .line-top .li svg{width:22px;height:22px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mcat{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.mcat-h{display:flex;align-items:center;gap:10px;padding:12px}
.mcat-h .ci{width:36px;height:36px;border-radius:11px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;flex:none}
.mcat-h .ci svg{width:20px;height:20px}
.mcat-h .grow{flex:1;min-width:0}
.mcat-h b{display:block}
.mcat-h small{color:var(--muted);font-size:12px}
.mitem{display:flex;align-items:center;gap:8px;padding:9px 12px;border-top:1px solid var(--line)}
.mitem span{flex:1;font-weight:600}
.mitem em{font-style:normal;color:var(--muted);font-size:12.5px;font-variant-numeric:tabular-nums}
.pen{border:1px solid var(--line);background:var(--surface-2);border-radius:9px;width:32px;height:32px;display:grid;place-items:center;flex:none}
.pen svg{width:15px;height:15px}
.mcat .add-row{display:flex;gap:6px;align-items:center;justify-content:center;width:100%;border:0;border-top:1px dashed var(--line);background:transparent;padding:11px;font-weight:700;color:var(--accent)}
.mcat .add-row svg{width:16px;height:16px}
.icon-pick{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.icon-pick label{border:1px solid var(--line);border-radius:10px;aspect-ratio:1;display:grid;place-items:center;cursor:pointer;color:var(--muted)}
.icon-pick input{position:absolute;opacity:0;pointer-events:none}
.icon-pick input:checked+svg{color:var(--accent)}
.icon-pick label:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.icon-pick svg{width:20px;height:20px}
.danger{border:1px solid var(--bad);color:var(--bad);background:transparent;border-radius:14px;padding:12px;font-weight:700;width:100%}
.confirm-del{background:var(--bad-soft);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px;color:var(--bad);font-weight:600;font-size:13px}
.confirm-del .btn-row button:first-child{background:var(--bad);color:#fff;border:0;border-radius:12px;padding:11px;font-weight:800}
.bill-card{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.bill-card>button{display:flex;width:100%;gap:10px;align-items:center;border:0;background:transparent;padding:12px;text-align:left}
.bill-card>button .grow{flex:1;min-width:0}
.bill-card>button b{display:block}
.bill-card>button span{font-size:12px;color:var(--muted)}
.bill-card .end{text-align:right;font-variant-numeric:tabular-nums}
.bill-card .detail{border-top:1px solid var(--line);padding:4px 12px 10px}
.new-pill{display:inline!important;color:var(--accent)!important;font-size:10.5px;font-weight:800;padding:1px 7px;border-radius:999px;background:var(--accent-soft);color:var(--accent);margin-left:6px}
.pay-methods{display:flex;gap:6px;flex-wrap:wrap}
.pay-row{display:grid;grid-template-columns:70px 1fr;gap:10px;align-items:center;margin-top:6px}
.pay-row b{font-size:13px}
.pay-status{margin-top:10px;padding:10px 12px;border-radius:12px;background:var(--surface-2);font-weight:700;font-size:13px;font-variant-numeric:tabular-nums}
.pay-status.bad{background:var(--bad-soft);color:var(--bad)}
.pay-status.ok{background:var(--good-soft);color:var(--good)}
.pay-status.due{background:var(--warn-soft);color:var(--warn)}
.known{display:flex;gap:10px;align-items:center;background:var(--good-soft);color:var(--good);border-radius:12px;padding:9px 11px;font-size:12.5px;font-weight:700;margin-top:8px}
.known svg{width:16px;height:16px;flex:none}
.known.due{background:var(--warn-soft);color:var(--warn)}
.credit{display:flex;justify-content:space-between;align-items:center;gap:8px;background:var(--priv-soft);color:var(--priv);border-radius:12px;padding:10px 12px;font-weight:700;font-size:13px}
.credit button{border:0;background:transparent;color:inherit;font-weight:800;text-decoration:underline}
.exline{display:flex;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.exline:first-child{border-top:0}
.exline input{width:20px;height:20px;accent-color:var(--accent);flex:none}
.exline .grow{flex:1}
.exline .grow span{display:block;font-size:12px;color:var(--muted)}
.sync-steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px;border:1px solid var(--line);border-radius:14px;background:var(--surface);padding:14px}
.sync-steps li{display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:start;font-size:13.5px}
.sync-steps li i{width:28px;height:28px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-style:normal;font-weight:800;font-size:12px}
.sync-steps li span{color:var(--muted)}
.sync-steps li b{display:block;color:var(--ink)}
.dev{display:flex;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.dev:first-of-type{border-top:0}
.dev .grow{flex:1;min-width:0}
.dev .grow b{display:block;font-size:13.5px}
.dev .grow small{color:var(--muted);font-size:12px}
.dev .d{width:9px;height:9px;border-radius:50%;background:var(--good);flex:none}
.dev .d.off{background:var(--warn)}
.cmode{display:flex;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:3px;gap:3px}
.cmode button{flex:1;border:0;background:transparent;border-radius:8px;padding:6px 4px;font-size:11.5px;font-weight:800;color:var(--muted);white-space:nowrap}
.cmode button.on{background:var(--surface);color:var(--accent);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.costrow{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:end}
.quick-head{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--muted);font-weight:600}
.quick-head b{color:var(--ink);font-size:12.5px!important}
.igrid .itile{min-height:64px;padding:9px 6px 8px}
.igrid .itile .ii{width:26px;height:26px}
.itile.sel{border-color:var(--accent);background:var(--accent-soft);box-shadow:0 0 0 1px var(--accent)}
.card.entry{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent);display:flex;flex-direction:column;gap:10px;scroll-margin:12px}
.entry-top{display:flex;align-items:center;gap:10px}
.entry-top .ci{width:36px;height:36px;border-radius:11px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;flex:none}
.entry-top .ci svg{width:20px;height:20px}
.entry-top .grow{flex:1}.entry-top b{display:block;font-size:16px}.entry-top small{color:var(--muted);font-size:12px}
.qrow{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;align-items:end}
.qrow .money{font-size:16px;padding:10px}
.stepper.sm button{width:28px;height:34px;font-size:16px}.stepper.sm span{min-width:24px}
.entry-foot{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;min-height:24px}
.linkbtn{border:0;background:none;color:var(--accent);font-weight:700;font-size:12.5px;padding:0;text-decoration:underline}

/* ============================================================
   Storage adapters — same interface for Firebase and local mode
   set(col,id,data,merge) · get(col,id) · query(col,conds,opts)
   listen(col,conds,cb) · listenDoc(col,id,cb) · inc(n) · del(col,id)
   ============================================================ */
const INC='__inc__';
function LocalAdapter(){
  const KEY='rr.local.db';
  let db=LS.get(KEY,{});
  const subs=new Set();
  const save=()=>{if(!LS.set(KEY,db))toastSoon('Phone storage is full. Delete old photos or use cloud sync.')};
  const coll=c=>db[c]||(db[c]={});
  function mergeInto(t,src){for(const k in src){const v=src[k];if(v&&typeof v==='object'&&v[INC]!==undefined){t[k]=(Number(t[k])||0)+v[INC]}else if(v&&typeof v==='object'&&!Array.isArray(v)){if(!t[k]||typeof t[k]!=='object'||Array.isArray(t[k]))t[k]={};mergeInto(t[k],v)}else t[k]=v}return t}
  function strip(src){const o=Array.isArray(src)?[]:{};for(const k in src){const v=src[k];if(v&&typeof v==='object'&&v[INC]!==undefined)o[k]=v[INC];else if(v&&typeof v==='object')o[k]=strip(v);else o[k]=v}return o}
  const val=(o,f)=>f.split('.').reduce((a,k)=>a==null?a:a[k],o);
  const match=(d,conds)=>conds.every(([f,op,v])=>{const x=val(d,f);return op==='=='?x===v:op==='>='?x>=v:op==='<='?x<=v:true});
  function run(c,conds,opts={}){let r=Object.entries(coll(c)).map(([id,d])=>({id,...clone(d)})).filter(d=>match(d,conds||[]));if(opts.orderBy){const f=opts.orderBy;r.sort((a,b)=>(a[f]>b[f]?1:-1)*(opts.desc?-1:1))}if(opts.limit)r=r.slice(0,opts.limit);return r}
  function notify(){subs.forEach(s=>s())}
  window.addEventListener('storage',e=>{if(e.key===KEY){db=LS.get(KEY,{});notify()}});
  return {
    mode:'local',
    set(c,id,data,merge){const cl=coll(c);cl[id]=merge&&cl[id]?mergeInto(cl[id],data):strip(data);save();setTimeout(notify,0);return Promise.resolve()},
    del(c,id){delete coll(c)[id];save();setTimeout(notify,0);return Promise.resolve()},
    get(c,id){const d=coll(c)[id];return Promise.resolve(d?{id,...clone(d)}:null)},
    query(c,conds,opts){return Promise.resolve(run(c,conds,opts))},
    listen(c,conds,cb,opts){const s=()=>cb(run(c,conds,opts),{pending:false,fromCache:false});subs.add(s);s();return()=>subs.delete(s)},
    listenDoc(c,id,cb){const s=()=>{const d=coll(c)[id];cb(d?{id,...clone(d)}:null,{fromCache:false})};subs.add(s);s();return()=>subs.delete(s)},
    inc(n){return {[INC]:n}},
    online(){return true}
  };
}
function FireAdapter(cfg){
  firebase.initializeApp(cfg);
  const fs=firebase.firestore();
  try{fs.enablePersistence({synchronizeTabs:true}).catch(()=>{})}catch(e){}
  const ref=(c,conds,opts={})=>{let r=fs.collection(c);(conds||[]).forEach(([f,op,v])=>r=r.where(f,op,v));if(opts.orderBy)r=r.orderBy(opts.orderBy,opts.desc?'desc':'asc');if(opts.limit)r=r.limit(opts.limit);return r};
  const docs=snap=>snap.docs.map(d=>({id:d.id,...d.data()}));
  // Firestore refuses undefined values; drop them but keep increment markers
  const clean=o=>{if(Array.isArray(o))return o.map(clean);if(o&&typeof o==='object'&&Object.getPrototypeOf(o)===Object.prototype){const r={};for(const k in o)if(o[k]!==undefined)r[k]=clean(o[k]);return r}return o};
  return {
    mode:'cloud',
    auth(){return firebase.auth().signInAnonymously()},
    set(c,id,data,merge){return fs.collection(c).doc(id).set(clean(data),{merge:!!merge}).catch(e=>console.warn('write failed',c,id,e))},
    del(c,id){return fs.collection(c).doc(id).delete().catch(e=>console.warn('delete failed',c,id,e))},
    async get(c,id){try{const d=await fs.collection(c).doc(id).get();return d.exists?{id:d.id,...d.data()}:null}catch(e){const d=await fs.collection(c).doc(id).get({source:'cache'}).catch(()=>null);return d&&d.exists?{id:d.id,...d.data()}:null}},
    async query(c,conds,opts){try{return docs(await ref(c,conds,opts).get())}catch(e){try{return docs(await ref(c,conds,opts).get({source:'cache'}))}catch(e2){return []}}},
    listen(c,conds,cb,opts){return ref(c,conds,opts).onSnapshot({includeMetadataChanges:true},s=>cb(docs(s),{pending:s.metadata.hasPendingWrites,fromCache:s.metadata.fromCache}),e=>console.warn('listen',c,e))},
    listenDoc(c,id,cb){return fs.collection(c).doc(id).onSnapshot({includeMetadataChanges:true},d=>cb(d.exists?{id:d.id,...d.data()}:null,{fromCache:d.metadata.fromCache}),e=>console.warn('listenDoc',c,e))},
    inc(n){return firebase.firestore.FieldValue.increment(n)},
    online(){return navigator.onLine}
  };
}

function decodeWith(key,s){s=String(s||'').toUpperCase().replace(/\s/g,'');if(!s)return {ok:false,empty:true};let n='';for(const ch of s){const i=key.indexOf(ch);if(i<0)return {ok:false,bad:ch};n+=String((i+1)%10)}return {ok:true,val:+n}}
const encodeWith=(key,n)=>String(Math.round(n)).split('').map(d=>key[(+d+9)%10]).join('');

/* ============================================================
   Bill maths — one place, used everywhere
   ============================================================ */
function lineAmt(l){return l.qty*l.price}
// Totals of a saved bill, excluding returned lines. Bill discount is shared across lines by amount.
function billTot(b){
  const act=(b.lines||[]).filter(l=>!l.returned);const sub=act.reduce((a,l)=>a+lineAmt(l),0);const all=(b.lines||[]).reduce((a,l)=>a+lineAmt(l),0)||1;
  const disc=Math.round((b.disc||0)*sub/all);const cost=act.reduce((a,l)=>a+(l.cost||0)*l.qty,0);const items=act.reduce((a,l)=>a+l.qty,0);
  const final=sub-disc;return {sub,disc,final,cost,profit:final-cost,items,margin:final?((final-cost)/final*100):0}
}
// Flatten bills into line records for reports
function billRecs(b){const act=(b.lines||[]).filter(l=>!l.returned);const all=(b.lines||[]).reduce((a,l)=>a+lineAmt(l),0)||1;
  return act.map(l=>{const g=lineAmt(l);const d=Math.round((b.disc||0)*g/all);return {bill:b.id,no:b.no,day:b.date,staff:b.staff,staffId:b.staffId,cat:l.cat,item:l.name,price:l.price,qty:l.qty,disc:d,cost:(l.cost||0)*l.qty,live:b}})}
function agg(rs){const o={bills:new Set(rs.map(r=>r.bill)).size,items:0,sales:0,disc:0,profit:0,cost:0};rs.forEach(r=>{const v=r.price*r.qty-r.disc;o.items+=r.qty;o.sales+=v;o.disc+=r.disc;o.cost+=r.cost;o.profit+=v-r.cost});return o}
function groupBy(rs,key){const m={};rs.forEach(r=>{const k=typeof key==='function'?key(r):r[key];(m[k]=m[k]||[]).push(r)});return m}
// Aggregate contribution of a bill (for daily / monthly books)
function aggOf(b){if(!b||b.deleted)return null;const t=billTot(b);return {biz:b.biz,date:b.date,month:b.month,fy:b.fy,sid:b.staffId||'owner',sales:t.final,disc:t.disc,items:t.items,cost:t.cost,profit:t.profit,bills:t.items>0?1:0}}

const DB={
  A:null,

  // write a bill and keep daily + monthly books in step (handles edits and returns by applying the difference)
  saveBill(b,prev){
    const A=this.A;A.set('bills',b.id,b,false);
    // an edit or return subtracts the old bill and adds the new one, so the books always match the bills
    const plus=aggOf(b),minus=aggOf(prev);const parts=[];
    if(minus)parts.push({...minus,k:-1,sbills:minus.bills});
    if(plus)parts.push({...plus,k:1,sbills:plus.bills});
    parts.forEach(p=>{const s=p.k;const inc=v=>A.inc(s*v);
      const body={biz:p.biz,fy:p.fy,sales:inc(p.sales),disc:inc(p.disc),items:inc(p.items),cost:inc(p.cost),profit:inc(p.profit),bills:inc(p.bills),staff:{[p.sid]:{sales:inc(p.sales),bills:inc(p.sbills)}}};
      A.set('daily',`${p.biz}_${p.date}`,{...body,date:p.date,month:p.month},true);
      A.set('monthly',`${p.biz}_${p.month}`,{...body,month:p.month},true);

const SESSION_KEY='rr.session';

/* ---------- cached loads (range queries, fetched once per session) ---------- */
const CACHE={};
function need(key,fn){const c=CACHE[key];if(c&&c.data)return c.data;if(!c){CACHE[key]={};fn().then(d=>{CACHE[key]={data:d};render()}).catch(e=>{console.warn(e);delete CACHE[key];toast('Could not load. Check the internet and try again.')})}return null}
function patchCache(bill){for(const k in CACHE){const c=CACHE[k];if(k.startsWith('b|')&&c.data){const i=c.data.findIndex(x=>x.id===bill.id);if(i>=0)c.data[i]=bill}}}
function dropCache(prefix){for(const k in CACHE)if(k.startsWith(prefix))delete CACHE[k]}
// All bills (all shops for owner) between two dates; today comes from the live listener
function billsBetween(from,to){
  const t=todayStr();let past=[];
  if(from<t){const end=to<t?to:addDays(t,-1);past=need(`b|${from}|${end}`,()=>DB.billsRange(from,end));if(past===null)return null}
  const live=(to>=t&&from<=t)?ST.today:[];
  return past.concat(live).filter(b=>!b.deleted);
}
const bizBills=(list,bizId)=>list?list.filter(b=>b.biz===bizId):null;

/* ---------- live listeners ---------- */
let unsubs=[];let todayUnsub=null;let listenDay=null;
function startListeners(){
  const A=DB.A;
  unsubs.push(A.listenDoc('config','main',(d,m)=>{
    if(d){ST.cfg={...DEFAULT_CONFIG,...d,pins:{...DEFAULT_CONFIG.pins,...(d.pins||{})}}}
    else if(!m.fromCache){DB.saveConfig(clone(DEFAULT_CONFIG))}
    if(!m.fromCache)ST.cfgFromServer=true;
    checkSession();ready();render();
  }));
  unsubs.push(A.listen('businesses',[],(docs,m)=>{
    ST.biz=docs.sort((a,b)=>(a.order||99)-(b.order||99));
    if(!docs.length&&!m.fromCache){defaultBusinesses().forEach(b=>DB.saveBiz(b))}
    if(!m.fromCache)ST.bizFromServer=true;
    if(S.biz&&!ST.biz.find(b=>b.id===S.biz))S.biz=null;
    ready();render();
  }));
  subscribeDay();
  setInterval(()=>{if(todayStr()!==listenDay){subscribeDay();dropCache('');render()}},60000);
}
function subscribeDay(){
  const A=DB.A;if(!A)return;listenDay=todayStr();
  if(todayUnsub)todayUnsub.forEach(u=>u());todayUnsub=[];
  const scope=S.login&&S.login!=='owner'?S.login:null;
  const conds=scope?[['bd','==',`${scope}|${listenDay}`]]:[['date','==',listenDay]];
  let first=true;
  todayUnsub.push(A.listen('bills',conds,(docs,m)=>{
    const before=new Set(ST.today.map(b=>b.id));
    ST.today=docs;ST.todayMeta=m;
    if(!first&&isAdmin()&&S.screen!=='login'){const fresh=docs.filter(b=>!before.has(b.id)&&b.device!==DEVICE.id&&!b.deleted);fresh.slice(0,2).forEach(b=>{const bz=ST.biz.find(x=>x.id===b.biz);toast(`● New sale · ${bz?bz.name:''} · ${b.staff} · ${inr(billTot(b).final)}`)})}
    first=false;syncBadge();renderSoft();
  }));
  const mNow=ym(new Date());
  todayUnsub.push(A.listen('monthly',[['month','==',mNow]],(docs)=>{ST.month={};docs.forEach(d=>ST.month[d.biz]=d);renderSoft()}));
  todayUnsub.push(A.listen('counters',[],(docs)=>{ST.counters={};docs.forEach(d=>ST.counters[d.id]=d.last||0)}));
}
function ready(){if(!ST.ready&&ST.cfg&&ST.biz.length){ST.ready=true;const s=LS.get(SESSION_KEY,null);if(s&&s.login&&(s.login==='owner'||ST.biz.find(b=>b.id===s.login))){applyLogin(s.login,true)}else S.screen='login';heartbeat()}}
function checkSession(){const s=LS.get(SESSION_KEY,null);if(!s||!ST.cfg||!S.login)return;const want=ST.cfg.pins[s.login];if(want&&s.pin!==want){logout();toast('The PIN for this login was changed. Please log in again.')}}
function applyLogin(k,quiet){S.login=k;if(k!=='owner')S.biz=k;else if(!S.biz||!ST.biz.find(b=>b.id===S.biz))S.biz=(activeBiz()[0]||{}).id;S.screen='home';subscribeDay();heartbeat();if(!quiet)toast(k==='owner'?'Logged in as owner':`This phone is now the ${B().name} counter`)}
function logout(){LS.del(SESSION_KEY);S.login=null;S.loginSel=null;S.screen='login';resetSale();S.overlay=null;subscribeDay();render()}
function heartbeat(){if(!DB.A)return;const lg=S.login;DB.heartbeat({id:DEVICE.id,name:DEVICE.name||(lg==='owner'?'Owner phone':lg?((ST.biz.find(b=>b.id===lg)||{}).name||'')+' counter':'Not logged in'),login:lg||'',seen:Date.now(),ver:APP_VERSION,ua:navigator.userAgent.slice(0,80)})}
setInterval(()=>{if(!document.hidden)heartbeat()},5*60*1000);

/* ---------- sync badge ---------- */
function syncBadge(){const el=document.getElementById('sync');if(!el)return;const txt=document.getElementById('syncText');if(!DB.A){el.className='sync off';txt.textContent='Not connected';return}
  if(DB.A&&DB.A.mode==='local'){el.className='sync off';txt.textContent='This phone only';return}
  const off=!navigator.onLine;const pend=ST.todayMeta.pending;
  el.className='sync'+(off||pend?' off':'');txt.textContent=off?(pend?'Offline · bills saved on phone':'Offline'):pend?'Syncing…':'Synced'}
window.addEventListener('online',()=>{syncBadge();toast('Back online. Syncing…')});
window.addEventListener('offline',()=>{syncBadge();toast('No internet. Bills are saved on this phone and will sync later.')});

const priv=t=>`<span class="priv">${ic('lock')}${t}</span>`;
function topbar(title,back='home',right=''){return `<div class="topbar"><button class="icon-btn" data-go="${back}" aria-label="Back">${ic('back')}</button><h2>${title}</h2>${right}</div>`}
function bizPill(){const b=B();if(!b)return '';return isAdmin()?`<button class="biz-pill" data-act="bizSheet"><span class="dot" style="background:${b.color}">${esc(b.short)}</span>${esc(b.name)}${ic('down')}</button>`:`<span class="biz-pill"><span class="dot" style="background:${b.color}">${esc(b.short)}</span>${esc(b.name)}</span>`}

function nextSeq(b,fy){const key=cfg().fyReset?`${b.id}_${fy.k}`:`${b.id}_all`;const known=ST.today.filter(x=>x.biz===b.id&&(cfg().fyReset?x.fy===fy.k:true)).reduce((m,x)=>Math.max(m,x.seq||0),0);return {key,seq:Math.max(ST.counters[key]||0,known)+1}}
const billNoFor=(b,fy,seq)=>cfg().fyReset?`${b.prefix}/${fy.s}/${String(seq).padStart(6,'0')}`:`${b.prefix}/${String(seq).padStart(6,'0')}`;
const nextBillNo=()=>{const b=B();const fy=fyNow();return billNoFor(b,fy,nextSeq(b,fy).seq)};

/* ---------- sale maths ---------- */
function unitCost(it){if(it.mode==='mrp'){const m=+it.mrp||0;return m?{ok:true,val:Math.round(m*(100-cfg().mrpOff)/100)}:{ok:false,empty:true,mrp:true}}return decode(it.code)}
function calc(it){const price=Number(it.price)||0;const gross=it.qty*price;const d=unitCost(it);const unit=d.ok?d.val:null;const cost=d.ok?unit*it.qty:null;
  let err='';if(!price)err='Enter the selling price.';else if(d.empty)err=d.mrp?'Type the MRP.':'Type the purchase code.';else if(!d.ok)err=`"${esc(d.bad)}" is not in the code word.`;
  return {gross,final:gross,unit,cost,profit:d.ok?gross-cost:null,err}}
function cartTotals(){const t={sub:0,items:0,cost:0,err:false,lineErr:false};
  S.cart.forEach(it=>{const c=calc(it);t.sub+=c.gross;t.items+=it.qty;if(c.cost!=null)t.cost+=c.cost;if(c.err){t.err=true;t.lineErr=true}});
  const dv=+S.bd.val||0;t.disc=S.bd.type==='pct'?Math.round(t.sub*dv/100):Math.round(dv);t.discErr='';const C=cfg();
  if(t.disc>t.sub)t.discErr='Discount is more than the bill.';
  else if(!isAdmin()&&!C.staffDisc&&t.disc>0)t.discErr='Staff discounts are switched off. Ask the owner.';
  else if(!isAdmin()&&t.disc>t.sub*C.maxDisc/100)t.discErr=`Staff can give up to ${C.maxDisc}% (${inr(Math.floor(t.sub*C.maxDisc/100))}) on this bill. Ask the owner for more.`;
  if(t.discErr)t.err=true;t.final=t.sub-t.disc;t.profit=t.final-t.cost;t.margin=t.final>0?t.profit/t.final*100:0;
  const cr=S.credit?S.credit.amount:0;t.credit=cr;t.pay=Math.max(0,t.final-cr);t.refund=Math.max(0,cr-t.final);return t}
function payInfo(t){const p=S.pay;if(t.refund)return {text:'Refund '+inr(t.refund),due:0};if(!t.pay)return {text:'Exchange credit',due:0};
  if(p.mode==='single')return {text:`${inr(t.pay)} ${p.method}`,due:0};
  if(p.mode==='split')return {text:Object.entries(p.split).filter(([k,v])=>+v).map(([k,v])=>`${inr(+v)} ${k}`).join(' + '),due:0};
  const r=+p.recv||0;return {text:`${inr(r)} ${p.method} received`,due:Math.max(0,t.pay-r)}}
function payErr(t){const p=S.pay;if(t.refund||!t.pay)return '';
  if(p.mode==='split'){const sum=Object.values(p.split).reduce((s,v)=>s+(+v||0),0);if(sum!==t.pay)return sum<t.pay?`${inr(t.pay-sum)} still to enter`:`${inr(sum-t.pay)} more than the bill`}
  if(p.mode==='partial'){const r=+p.recv||0;if(!r)return 'Enter the amount received';if(r>=t.pay)return 'That is the full amount. Choose Cash, UPI or Card.';if(digits(S.customer.mobile).length<10)return 'Enter the customer mobile to keep a balance due'}
  return ''}
function canSave(){const t=cartTotals();return !!(S.cart.length&&S.sp&&!t.err&&!payErr(t)&&!(cfg().photoReq&&!S.photos.length)&&!(S.editing&&!S.editReason.trim()))}
function resetSale(){S.sp=null;S.cart=[];S.photos=[];S.entry=null;S.bd={val:'',type:'rs'};S.customer={name:'',mobile:''};S.cust=null;S.credit=null;S.pay={mode:'single',method:'Cash',split:{Cash:'',UPI:'',Card:''},recv:''};S.remark='';S.remarkPrint=false;S.editing=null;S.editReason=''}

/* ---------- report helpers ---------- */
function periodRange(k){const t=todayStr();const d=new Date();
  if(k==='today')return [t,t];if(k==='yesterday'){const y=addDays(t,-1);return [y,y]}
  if(k==='week'){const dow=(d.getDay()+6)%7;return [addDays(t,-dow),t]}
  if(k==='month')return [ym(d)+'-01',t];
  if(k==='lastmonth'){const p=new Date(d.getFullYear(),d.getMonth()-1,1);return monthRange(ym(p))}
  if(k==='fy')return [fyNow().start,t];
  return [S.cFrom||ym(d)+'-01',S.cTo||t]}
function periodRecs(){const [a,z]=periodRange(S.rPeriod);const bl=bizBills(billsBetween(a,z),B().id);return bl?bl.flatMap(billRecs):null}
const PERIODS=[['today','Today'],['yesterday','Yesterday'],['week','This week'],['month','This month'],['lastmonth','Last month'],['fy','This FY'],['custom','Custom']];
function periodChips(){return `<div class="chips scroll">${PERIODS.map(([k,l])=>`<button class="chip ${S.rPeriod===k?'on':''}" data-act="rPeriod" data-v="${k}">${l}</button>`).join('')}</div>${S.rPeriod==='custom'?`<form class="two" id="customForm"><div class="f"><label for="cFrom">From</label><input id="cFrom" type="date" value="${periodRange('custom')[0]}"></div><div class="f"><label for="cTo">To</label><input id="cTo" type="date" value="${periodRange('custom')[1]}"></div><button class="secondary" type="submit" style="grid-column:1/-1">Show</button></form>`:''}`}
const BANDS=[0,300,500,800,1000,1500,2000,3000,5000,10000,Infinity];
function bandOf(p){for(let i=0;i<BANDS.length-1;i++)if(p<BANDS[i+1])return i;return BANDS.length-2}
const bandLbl=i=>BANDS[i+1]===Infinity?`${inr(BANDS[i])}+`:`${inr(BANDS[i])} – ${inr(BANDS[i+1]-1)}`;
function barRows(rows,max,fmt){return rows.map(r=>`<div class="month-row"><span>${r.l}</span><div class="bar ${r.hl?'good':''}"><i style="width:${r.v/max*100}%"></i></div><b>${fmt(r)}</b></div>`).join('')}
function staffReport(rs){const b=B();const keyIdx={bills:0,items:1,sales:2,disc:3,profit:4};
  const ids=[...new Set([...(b.staff||[]).filter(x=>x.active!==false).map(x=>x.id),...rs.map(r=>r.staffId)])];
  const rows=ids.map(id=>{const o=agg(rs.filter(r=>r.staffId===id));return {id,name:id==='owner'?'Owner':staffName(b,id)||(rs.find(r=>r.staffId===id)||{}).staff||'—',r:[o.bills,o.items,o.sales,o.disc,o.profit]}}).sort((x,y)=>y.r[keyIdx[S.sortKey]]-x.r[keyIdx[S.sortKey]]);
  const tot=[0,0,0,0,0];rows.forEach(x=>x.r.forEach((v,i)=>tot[i]+=v));
  const th=(k,l)=>`<th class="${S.sortKey===k?'on':''}"><button data-act="sort" data-v="${k}">${l}${S.sortKey===k?' ↓':''}</button></th>`;
  return `<div class="tbl-wrap"><table><thead><tr><th>Staff</th>${th('bills','Bills')}${th('items','Items')}${th('sales','Sales')}${th('disc','Discount')}${th('profit','Profit')}</tr></thead>
    <tbody>${rows.map(({id,name,r})=>`<tr class="click" data-act="openStaff" data-v="${id}"><td><span class="lnk">${esc(name)} ›</span></td><td>${r[0]}</td><td>${r[1]}</td><td>${inr(r[2])}</td><td>${inr(r[3])}</td><td class="pv">${inr(r[4])}</td></tr>`).join('')}
    <tr class="tot"><td>Total</td><td>${tot[0]}</td><td>${tot[1]}</td><td>${inr(tot[2])}</td><td>${inr(tot[3])}</td><td class="pv">${inr(tot[4])}</td></tr></tbody></table></div>
  <p class="hint" style="margin-top:-4px">Tap a name to see all of that person's sales. Tap a heading to sort.</p>`}
function categoryReport(rs){const g=groupBy(rs,'cat');const rows=Object.entries(g).map(([c,x])=>({c,o:agg(x)})).sort((x,y)=>y.o.sales-x.o.sales);const tot=rows.reduce((s,r)=>s+r.o.sales,0);const max=Math.max(1,...rows.map(r=>r.o.sales));
  return `<div class="card"><div class="card-h"><h3>Sales by category</h3><b class="tnum">${inr(tot)}</b></div>
    ${rows.map(r=>`<button class="cat-row click" data-act="openCat" data-v="${esc(r.c)}"><b>${esc(r.c)} <span class="lnk">›</span></b><span class="v">${inr(r.o.sales)}</span><div class="bar"><i style="width:${r.o.sales/max*100}%"></i></div><small>${r.o.items} pcs · ${pct(r.o.sales,tot)}% of sales</small><span style="text-align:right">${priv('Profit '+inr(r.o.profit))}</span></button>`).join('')||'<p class="hint">No sales in this period.</p>'}</div>
  <p class="hint" style="margin-top:-4px">Tap a category to see which prices sell most, and who sells it.</p>`}
function itemReport(rs){const b=B();if(S.rCat!=='All'){const c=b.cats.find(x=>x.id===S.rCat);rs=rs.filter(r=>c&&r.cat===c.name)}
  const rows=Object.values(groupBy(rs,r=>r.cat+'|'+r.item)).map(x=>{const o=agg(x);return {cat:x[0].cat,item:x[0].item,o,avg:Math.round(o.sales/Math.max(1,o.items))}}).sort((x,y)=>y.o.items-x.o.items);
  return `<select class="sel" id="rCatSel" aria-label="Category"><option value="All">All categories</option>${b.cats.map(c=>`<option value="${c.id}" ${S.rCat===c.id?'selected':''}>${esc(c.name)}</option>`).join('')}</select>
  <div class="tbl-wrap"><table><thead><tr><th>Item</th><th>Pcs</th><th>Avg price</th><th>Sales</th><th>Profit</th></tr></thead>
  <tbody>${rows.map(r=>`<tr class="click" data-act="openCat" data-v="${esc(r.cat)}"><td>${esc(r.item)}<br><span style="font-weight:500;color:var(--muted);font-size:11px">${esc(r.cat)} ›</span></td><td>${r.o.items}</td><td>${inr(r.avg)}</td><td>${inr(r.o.sales)}</td><td class="pv">${inr(r.o.profit)}</td></tr>`).join('')||'<tr><td colspan="5">No sales in this period.</td></tr>'}</tbody></table></div>`}
function niceStep(x){if(x<=0)return 250;const p=Math.pow(10,Math.floor(Math.log10(x)));const m=x/p;return (m<=1?1:m<=2?2:m<=5?5:10)*p}
function chart(key){const b=B();let d;
  if(key==='today'){const hrs=[];for(let h=9;h<=21;h++)hrs.push(h);const td=todayOf(b.id);d={labels:hrs.map(h=>h<12?h+'a':h===12?'12p':(h-12)+'p'),vals:hrs.map(h=>td.filter(x=>new Date(x.at).getHours()===h||(h===9&&new Date(x.at).getHours()<9)||(h===21&&new Date(x.at).getHours()>21)).reduce((a,x)=>a+billTot(x).final,0)),cap:'today by hour'}}
  else{const n=key==='7d'?7:30;const t=todayStr();const from=addDays(t,-(n-1));const docs=need(`d|${from}|${addDays(t,-1)}`,()=>DB.daily(from,addDays(t,-1)));if(!docs)return '<p class="hint">Loading…</p>';
    const days=[];for(let i=n-1;i>=0;i--)days.push(addDays(t,-i));const todayS=agg(todayOf(b.id).flatMap(billRecs)).sales;
    d={labels:days.map(s=>n===7?parseYmd(s).toLocaleDateString('en-IN',{weekday:'short'}):String(parseYmd(s).getDate())),vals:days.map(s=>s===t?todaySales(b.id):((docs.find(x=>x.biz===b.id&&x.date===s)||{}).sales||0)),cap:n===7?'in the last 7 days':'in the last 30 days'}}
  const W=320,H=168,L=40,R=8,T=16,Bm=22;const iw=W-L-R,ih=H-T-Bm;const max=Math.max(1000,...d.vals);const step=niceStep(max/4);const top=step*4;const n=d.vals.length;const slot=iw/n;const bw=Math.max(3,slot*.62);let g='';
  for(let i=0;i<=4;i++){const y=T+ih-ih*i/4;g+=`<line class="grid" x1="${L}" x2="${W-R}" y1="${y}" y2="${y}"/><text x="${L-6}" y="${y+3}" text-anchor="end">${kfmt(step*i)}</text>`}
  d.vals.forEach((v,i)=>{const h=ih*v/top;const x=L+slot*i+(slot-bw)/2;const y=T+ih-h;const last=i===n-1;g+=`<rect class="b${last?' last':''}" x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${bw.toFixed(1)}" height="${Math.max(h,0).toFixed(1)}" rx="${Math.min(4,bw/2)}"><title>${d.labels[i]}: ${inr(v)}</title></rect>`;
    if(n<=13||i%5===0||last)g+=`<text x="${(x+bw/2).toFixed(1)}" y="${H-6}" text-anchor="middle">${d.labels[i]}</text>`;if(last&&v)g+=`<text class="val" x="${Math.min(x+bw/2,W-R-18).toFixed(1)}" y="${(y-5).toFixed(1)}" text-anchor="middle">${kfmt(v)}</text>`});
  return `<p class="chart-total"><b>${inr(d.vals.reduce((a,v)=>a+v,0))}</b> ${d.cap}</p><svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Sales ${d.cap}">${g}</svg>`}
const todaySales=bizId=>agg(todayOf(bizId).flatMap(billRecs)).sales;

const NAV={owner:[['home','Home','home'],['sale','New sale','bill'],['sales','Sales','list'],['reports','Reports','chart'],['more','More','more']],
  counter:[['home','Home','home'],['sale','New sale','bill'],['exchange','Exchange','swap'],['sales','Bills','list'],['mytarget','My target','target']]};
const NAV_OF={deleted:'more',sale:'sale',saved:'sale',sales:'sales',reports:'reports',staffDetail:'reports',catDetail:'reports',more:'more',books:'more',photos:'more',catalog:'more',businesses:'more',staff:'more',settings:'more',home:'home',exchange:'exchange',mytarget:'mytarget'};
const $=id=>document.getElementById(id);
let toastTimer;
function toast(msg){const t=$('toast');if(!t)return;t.textContent=msg;t.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.hidden=true,3200)}
toastSoon=m=>setTimeout(()=>toast(m),50);
function go(s){if(s==='sale'&&!S.editing&&S.screen!=='sale'&&S.lastBill&&S.screen==='saved')resetSale();S.screen=s;S.overlay=null;render()}

let softPending=false;
function isTyping(){const a=document.activeElement;return a&&(a.tagName==='INPUT'||a.tagName==='TEXTAREA'||a.tagName==='SELECT')&&a.type!=='checkbox'}
function renderSoft(){if(isTyping()||S.overlay){softPending=true;syncBadge();return}render()}
document.addEventListener('focusout',()=>setTimeout(()=>{if(softPending&&!isTyping()&&!S.overlay){softPending=false;render()}},250));

function render(){
  const scr=$('scr'),nav=$('nav'),ov=$('overlay');if(!scr)return;
  if(S.screen!=='boot'&&S.screen!=='setup'){
    if(!ST.ready){S.screen='boot'}
    else if(!S.login&&S.screen!=='login')S.screen='login';
    else if(S.login&&!isAdmin()&&ADMIN_ONLY.includes(S.screen))S.screen='home';
    if(S.login&&!B()){S.screen='login'}
  }
  if(S.screen==='saved'&&!S.lastBill)S.screen='sale';
  const prev=scr.dataset.s,top=scr.scrollTop;
  try{scr.innerHTML=(screens[S.screen]||screens.home)()}catch(e){console.error(e);scr.innerHTML=`<div class="pad"><div class="empty">Something went wrong on this screen.<br><small>${esc(e.message)}</small></div><button class="secondary" data-go="home">Go home</button></div>`}
  scr.dataset.s=S.screen;scr.scrollTop=prev===S.screen?top:0;
  const sameOv=ov.dataset.o===(S.overlay||'');ov.dataset.o=S.overlay||'';ov.className=S.overlay?'overlay':'';
  ov.innerHTML=(Object.assign({print:printSheet,biz:bizSheet,catForm:catFormSheet,itemForm:itemFormSheet,bill:billSheet},window.EXTRA_OV||{})[S.overlay]||(()=>''))();
  if(sameOv){const sh=ov.querySelector('.sheet');if(sh)sh.style.animation='none'}
  const tab=NAV_OF[S.screen];const set=isAdmin()?NAV.owner:NAV.counter;
  nav.hidden=!S.login||['boot','setup','login'].includes(S.screen);
  nav.innerHTML=set.map(([k,l,i])=>`<button class="${tab===k?'on':''}" ${k==='sale'?'data-act="newSale"':`data-go="${k}"`}>${ic(i)}${l}</button>`).join('');
  syncBadge();
}
function updateBill(){const st=$('saleTotals');if(st)st.innerHTML=totalsHTML();const ps=$('payStatus');if(ps)ps.outerHTML=payStatus();const sb=$('saveBtn');if(sb)sb.disabled=!canSave();const sh=$('saveHint');if(sh)sh.textContent=saveHint()}
function openEntry(catId,itemId){const c=findCat(catId);const it=c.items.find(x=>x.id===itemId);
  S.entry={catId,itemId,cat:c.name,icon:c.icon,name:it.name,qty:1,price:'',mode:'code',code:'',mrp:'',note:''};render();
  setTimeout(()=>{const p=$('entryPanel');if(p)p.scrollIntoView({block:'nearest',behavior:'smooth'});const ae=document.activeElement;if(ae&&/^en/.test(ae.id))return;const el=$('enPrice');if(el)el.focus({preventScroll:true})},40)}
function findBill(id){return ST.today.find(b=>b.id===id)||(S.lastBill&&S.lastBill.id===id?S.lastBill:null)||(S.viewBill&&S.viewBill.id===id?S.viewBill:null)||Object.values(CACHE).map(c=>c.data).filter(Array.isArray).flat().find(b=>b&&b.id===id&&b.lines)||null}
async function getBill(id){return findBill(id)||await DB.bill(id)}

/* ---------- saving a bill ---------- */
function saveSale(){
  const t=cartTotals();if(!canSave())return;const b=B();const pe=payInfo(t);const now=Date.now();const prev=S.editing;
  const date=prev?prev.date:todayStr();const fy=fyOf(date);
  const mob=digits(S.customer.mobile);const cust={name:S.customer.name.trim(),mobile:mob.length===10?mob:''};
  const lines=S.cart.map(l=>{const u=unitCost(l);return {itemId:l.itemId||null,cat:l.cat,icon:l.icon,name:l.name,qty:l.qty,price:+l.price,mode:l.mode,code:l.mode==='mrp'?'':String(l.code).toUpperCase(),mrp:l.mode==='mrp'?+l.mrp:0,cost:u.ok?u.val:0,note:l.note||'',returned:!!l.returned}});
  if(prev)lines.push(...prev.lines.filter(l=>l.returned));
  const newPhotos=S.photos.filter(p=>!p.id);const keptIds=S.photos.filter(p=>p.id).map(p=>p.id);
  const photoIds=keptIds.concat(newPhotos.map(()=>'ph_'+uid()));
  const staffId=S.sp;const staff=staffId==='owner'?'Owner':staffName(b,staffId);
  let bill;
  if(prev){
    bill={...clone(prev),lines,disc:t.disc,discType:S.bd.type,discVal:S.bd.val,customer:cust,pay:clone(S.pay),paid:paidOf(t),payText:pe.text,due:pe.due,remark:S.remark.trim(),remarkPrint:S.remarkPrint,photoIds,staffId,staff,edited:true,editedAt:now,
      history:(prev.history||[]).concat([{at:now,by:isAdmin()?'Owner':(DEVICE.name||b.name+' counter'),reason:S.editReason.trim(),from:billTot(prev).final,to:0}])};
    bill.history[bill.history.length-1].to=billTot(bill).final;
  }else{
    const {key,seq}=nextSeq(b,fy);
    bill={id:'b_'+uid(),biz:b.id,fy:fy.k,seq,no:billNoFor(b,fy,seq),at:now,date,month:date.slice(0,7),bd:`${b.id}|${date}`,device:DEVICE.id,staffId,staff,customer:cust,lines,disc:t.disc,discType:S.bd.type,discVal:S.bd.val,
      pay:clone(S.pay),paid:paidOf(t),payText:pe.text,due:pe.due,credit:S.credit?{no:S.credit.no,billId:S.credit.billId,amount:S.credit.amount}:null,remark:S.remark.trim(),remarkPrint:S.remarkPrint,photoIds,edited:false,history:[]};
    ST.counters[key]=seq;DB.A.set('counters',key,{biz:b.id,fy:fy.k,last:seq},true);
  }
  // photos go in their own records (so bills stay small)
  const items=lines.map(l=>l.qty+' '+l.name).join(', ');
  newPhotos.forEach((p,i)=>DB.savePhoto({id:photoIds[keptIds.length+i],bill:bill.id,biz:b.id,at:now,date:bill.date,data:p.data,items,total:billTot(bill).final,staff,cats:[...new Set(lines.map(l=>l.cat))]}));
  if(newPhotos.length)delete CACHE.photos;
  // customer record (visits + balance due)
  const oldM=prev&&prev.customer&&prev.customer.mobile;const oldDue=prev?prev.due||0:0;
  if(oldM&&oldM!==cust.mobile)DB.incCustomer(oldM,null,-1,-oldDue);
  if(cust.mobile){if(oldM===cust.mobile)DB.incCustomer(cust.mobile,cust.name||null,0,pe.due-oldDue);else DB.incCustomer(cust.mobile,cust.name||null,1,pe.due)}
  DB.saveBill(bill,prev);
  // show it straight away, even before the listener fires
  const i=ST.today.findIndex(x=>x.id===bill.id);if(bill.date===todayStr()){if(i>=0)ST.today[i]=bill;else ST.today.push(bill)}
  patchCache(bill);
  S.lastBill={...bill,editedNow:!!prev};resetSale();S.screen='saved';render();
}
function startEdit(bill){resetSale();
  S.cart=bill.lines.map(l=>({itemId:l.itemId,cat:l.cat,icon:l.icon,name:l.name,qty:l.qty,price:l.price,mode:l.mode||'code',code:l.code||'',mrp:l.mrp||'',note:l.note||'',returned:!!l.returned})).filter(l=>!l.returned);
  S.bd={val:bill.discVal!=null&&bill.discVal!==''?String(bill.discVal):(bill.disc?String(bill.disc):''),type:bill.discType||'rs'};
  S.customer={name:(bill.customer&&bill.customer.name)||'',mobile:(bill.customer&&bill.customer.mobile)||''};S.cust=null;
  S.pay=bill.pay?clone(bill.pay):{mode:'single',method:'Cash',split:{Cash:'',UPI:'',Card:''},recv:''};
  S.photos=(bill.photoIds||[]).map(id=>({id,data:''}));S.remark=bill.remark||'';S.remarkPrint=!!bill.remarkPrint;S.sp=bill.staffId||null;S.credit=bill.credit||null;
  S.editing=bill;S.biz=bill.biz;S.screen='sale';S.overlay=null;S.entry=null;
  if(S.photos.length)Promise.all(S.photos.map(p=>DB.A.get('photos',p.id))).then(r=>{r.forEach((d,i)=>{if(d&&S.photos[i])S.photos[i].data=d.data});render()});
  render()}

/* ---------- returns / exchange ---------- */
function applyReturn(kind){const x=S.ex.bill;const prev=clone(x);const nb=clone(x);let val=0;const all=x.lines.reduce((a,l)=>a+lineAmt(l),0)||1;
  nb.lines.forEach((l,i)=>{if(S.ex.sel[i]&&!l.returned){val+=lineAmt(l)-Math.round((x.disc||0)*lineAmt(l)/all);l.returned=true;l.retAt=Date.now()}});
  nb.returns=(x.returns||[]).concat([{at:Date.now(),amount:val,kind,by:isAdmin()?'Owner':(DEVICE.name||'counter')}]);
  // the bill keeps its original discount; billTot shares it across the lines that were kept
  DB.saveBill(nb,prev);patchCache(nb);const i=ST.today.findIndex(y=>y.id===nb.id);if(i>=0)ST.today[i]=nb;
  DB.A.set('returns','r_'+uid(),{biz:x.biz,bill:x.id,no:x.no,amount:val,kind,at:Date.now(),date:todayStr()},false);
  S.ex=null;S.exResults=null;
  if(kind==='refund'){toast(`Return saved · give back ${inr(val)}`);render();return}
  resetSale();S.credit={no:x.no,billId:x.id,amount:val};if(x.customer)S.customer={name:x.customer.name||'',mobile:x.customer.mobile||''};S.screen='sale';render();toast(`${inr(val)} credit added. Pick the new items.`)}

/* ---------- deleting (owner only) ---------- */
function afterBillChange(bill){const i=ST.today.findIndex(x=>x.id===bill.id);if(i>=0)ST.today[i]=bill;patchCache(bill);dropCache('m|');dropCache('d|');delete CACHE.deleted;if(S.viewBill&&S.viewBill.id===bill.id)S.viewBill=bill;if(S.lastBill&&S.lastBill.id===bill.id)S.lastBill=bill}
function custReverse(bill,sign){const m=bill.customer&&bill.customer.mobile;if(m)DB.incCustomer(m,null,sign,sign*(bill.due||0))}
// soft delete: the bill leaves every total but can be restored
function deleteBill(bill,reason){if(!isAdmin()||bill.deleted)return;const nb={...clone(bill),deleted:true,deletedAt:Date.now(),deletedBy:'Owner',deleteReason:reason||''};
  DB.saveBill(nb,bill);custReverse(bill,-1);afterBillChange(nb);toast(`${bill.no} deleted. Restore it from Settings → Deleted bills.`)}
function restoreBill(bill){if(!isAdmin()||!bill.deleted)return;const nb=clone(bill);nb.deleted=false;nb.restoredAt=Date.now();delete nb.deletedAt;delete nb.deleteReason;delete nb.deletedBy;
  DB.saveBill(nb,{...bill,deleted:true});custReverse(nb,1);afterBillChange(nb);toast(`${bill.no} restored`)}
// hard delete: remove the record and its photos for good (books corrected first if it still counted)
function removeForever(bill){if(!bill.deleted){DB.saveBill({...clone(bill),deleted:true},bill);custReverse(bill,-1)}
  (bill.photoIds||[]).forEach(id=>DB.A.del('photos',id));DB.A.del('bills',bill.id);
  ST.today=ST.today.filter(x=>x.id!==bill.id);for(const k in CACHE){const c=CACHE[k];if(c.data&&Array.isArray(c.data))c.data=c.data.filter(x=>x.id!==bill.id)}}
async function startFresh(){const cols=['bills','photos','daily','monthly','counters','customers','returns','cash','dayclose','attendance'];let n=0,tot=0;
  const lists=await Promise.all(cols.map(c=>DB.all(c)));lists.forEach(l=>tot+=l.length);toast(`Deleting ${tot} records…`);
  for(let i=0;i<cols.length;i++){for(const d of lists[i]){DB.A.del(cols[i],d.id);n++;if(n%100===0){toast(`Deleted ${n} of ${tot}…`);await new Promise(r=>setTimeout(r,30))}}}
  ST.today=[];ST.month={};ST.counters={};for(const k in CACHE)delete CACHE[k];S.freshAsk=false;S.openBill=null;S.lastBill=null;render();toast(`Done. ${tot} records deleted. Every shop starts fresh.`)}

/* ---------- print, WhatsApp, export ---------- */
function doPrint(bill,paper){const bz=ST.biz.find(y=>y.id===bill.biz)||B();const pa=$('printArea');pa.innerHTML=receiptHTML(bill,bz,paper);
  let st=$('pageSize');if(!st){st=document.createElement('style');st.id='pageSize';document.head.appendChild(st)}st.textContent=`@page{size:${paper==='58'?'58mm':'80mm'} auto;margin:2mm}`;

function billText(x){const bz=ST.biz.find(y=>y.id===x.biz)||{};const t=billTot(x);
  return [`*${bz.name||''}*`,bz.addr||'',bz.phone?`Ph: ${bz.phone}`:'',`Bill: ${x.no}`,dateTimeLabel(x.at),'',...x.lines.filter(l=>!l.returned).map(l=>`${l.name}  ${l.qty} × ${inr(l.price)} = ${inr(lineAmt(l))}`),'',
    t.disc?`Discount: -${inr(t.disc)}`:'',`*Total: ${inr(t.final)}*`,x.payText?`Paid: ${x.payText}`:'',x.due?`Balance due: ${inr(x.due)}`:'',x.remark&&x.remarkPrint?`Note: ${x.remark}`:'',bz.footer||'','Thank you! Visit again'].filter(v=>v!=='').join('\n')}
function openWA(mobile,text){const m=digits(mobile);const url=`https://wa.me/${m.length===10?'91'+m:''}?text=${encodeURIComponent(text)}`;window.open(url,'_blank')}
function csvDownload(name,rows){const esc2=v=>{v=String(v??'');return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};const blob=new Blob(['\ufeff'+rows.map(r=>r.map(esc2).join(',')).join('\n')],{type:'text/csv'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)}
function billRows(list){const rows=[['Bill no','Date','Time','Shop','Sold by','Customer','Mobile','Item','Category','Qty','Price','Line amount','Bill discount share','Cost','Profit','Payment','Returned','Edited','Remark']];
  list.forEach(b=>{const bz=ST.biz.find(y=>y.id===b.biz)||{};const all=b.lines.reduce((a,l)=>a+lineAmt(l),0)||1;b.lines.forEach(l=>{const d=Math.round((b.disc||0)*lineAmt(l)/all);rows.push([b.no,b.date,timeLabel(b.at),bz.name,b.staff,b.customer&&b.customer.name,b.customer&&b.customer.mobile,l.name,l.cat,l.qty,l.price,lineAmt(l),d,(l.cost||0)*l.qty,lineAmt(l)-d-(l.cost||0)*l.qty,b.payText,l.returned?'yes':'',b.edited?'yes':'',b.remark])})});return rows}

/* ---------- clicks ---------- */
document.addEventListener('click',async e=>{
  const g=e.target.closest('[data-go]');if(g){e.preventDefault();go(g.dataset.go);return}
  const a=e.target.closest('[data-act]');if(!a)return;
  const v=a.dataset.v,i=+a.dataset.i,id=a.dataset.id,catId=a.dataset.cat;const b=B();
  switch(a.dataset.act){
    case 'saveFb':{const raw=$('fbIn').value;const cfgO={};['apiKey','authDomain','projectId','storageBucket','messagingSenderId','appId'].forEach(k=>{const m=raw.match(new RegExp(k+'\\s*["\']?\\s*:\\s*["\']([^"\']+)["\']'));if(m)cfgO[k]=m[1]});
      if(!cfgO.apiKey||!cfgO.projectId){toast('That does not look like a Firebase config. Copy the whole block from the guide.');return}LS.set('rr.fb',cfgO);LS.del('rr.localMode');location.reload();return}
    case 'localMode':LS.set('rr.localMode',true);location.reload();return;

    case 'loginAs':S.loginSel=v;render();setTimeout(()=>{const x=$('lp');if(x)x.focus()},40);return;
    case 'counterLogout':{const p=prompt(`Type the ${b.name} shop PIN or the owner PIN to log out this phone`);if(p==null)return;if(p===cfg().pins[b.id]||p===cfg().pins.owner)logout();else toast('Wrong PIN');return}

    case 'setBiz':if(isAdmin()){if(S.biz!==v){S.biz=v;resetSale();S.saleCat=null;S.ex=null;S.exResults=null;S.rCat='All';S.bookBiz=null}}S.overlay=null;break;
    case 'bizSheet':S.overlay='biz';break;
    case 'goBiz':S.overlay=null;S.screen='businesses';break;
    case 'closeSheet':S.overlay=null;break;
    case 'period':S.period=v;break;
