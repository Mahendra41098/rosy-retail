    case 'openEntry':openEntry(catId,id);return;
    case 'enQty':S.entry.qty=Math.max(1,S.entry.qty+ +a.dataset.d);break;
    case 'enMode':S.entry.mode=v;render();setTimeout(()=>{const el=$(v==='mrp'?'enMrp':'enCode');if(el)el.focus({preventScroll:true})},30);return;
    case 'enCancel':S.entry=null;break;
    case 'enAdd':{const c=calc(S.entry);if(c.err)return;const en={...S.entry,code:String(S.entry.code).toUpperCase(),price:+S.entry.price};delete en.catId;if(en.itemId)bumpUse(B().id,en.itemId);
      const same=S.cart.find(x=>x.itemId===en.itemId&&x.mode===en.mode&&x.code===en.code&&+x.mrp===+en.mrp&&x.price===en.price&&x.note===en.note);if(same)same.qty+=en.qty;else S.cart.push(en);
      S.entry=null;render();toast(`Added ${en.qty} ${en.name} · total ${inr(cartTotals().final)}`);return}
    case 'qty':S.cart[i].qty=Math.max(1,S.cart[i].qty+ +a.dataset.d);break;
    case 'rm':S.cart.splice(i,1);break;
    case 'pickSp':S.sp=v;break;
    case 'askDelBill':S.delBill=v;render();setTimeout(()=>{const r=$('delReason');if(r)r.focus()},40);return;
    case 'keepBill':S.delBill=null;break;
    case 'doDelBill':{const x=await getBill(v);if(!x)return;deleteBill(x,$('delReason')?$('delReason').value.trim():'');S.delBill=null;S.openBill=null;if(S.overlay==='bill')S.overlay=null;break}
    case 'restoreBill':{const l=CACHE.deleted&&CACHE.deleted.data;const x=l&&l.find(y=>y.id===v);if(!x)return;restoreBill(x);if(CACHE.deleted)delete CACHE.deleted;break}
    case 'askDelForever':S.delForever=v;break;
    case 'keepForever':S.delForever=null;break;
    case 'doDelForever':{const l=CACHE.deleted&&CACHE.deleted.data;const x=l&&l.find(y=>y.id===v);if(!x)return;removeForever(x);CACHE.deleted.data=l.filter(y=>y.id!==v);S.delForever=null;toast(`${x.no} deleted for good`);break}
    case 'reloadDeleted':delete CACHE.deleted;break;
    case 'askDelPhoto':S.delPhoto=v;break;
    case 'keepPhoto':S.delPhoto=null;break;
    case 'doDelPhoto':{const all=CACHE.photos&&CACHE.photos.data;const p=all&&all.find(y=>y.id===v);if(!p)return;DB.A.del('photos',v);CACHE.photos.data=all.filter(y=>y.id!==v);
      const bl=await getBill(p.bill);if(bl&&bl.photoIds){const nb={...clone(bl),photoIds:bl.photoIds.filter(i=>i!==v)};DB.A.set('bills',nb.id,{photoIds:nb.photoIds},true);afterBillChange(nb)}S.delPhoto=null;toast('Photo deleted');break}
    case 'cancelPurge':S.purge=null;break;
    case 'doPurge':{if(!S.purge)return;if(($('purgePin')||{}).value!==cfg().pins.owner){toast('Wrong owner PIN');return}const l=S.purge.list;l.forEach(removeForever);dropCache('');S.purge=null;toast(`${l.length} bills deleted for good. Books corrected.`);break}
    case 'askFresh':S.freshAsk=true;break;
    case 'cancelFresh':S.freshAsk=false;break;
    case 'doFresh':{if(($('freshPin')||{}).value!==cfg().pins.owner){toast('Wrong owner PIN');return}if((($('freshWord')||{}).value||'').trim().toUpperCase()!=='DELETE'){toast('Type the word DELETE to confirm');return}startFresh();return}

    case 'saveSale':saveSale();return;
    case 'cancelEdit':resetSale();S.screen='sales';toast('Edit cancelled. Bill not changed.');break;
    case 'editBill':{const x=await getBill(v);if(!x){toast('Bill not found');return}if(!canEdit(x)){toast('Only the owner can edit this bill');return}startEdit(x);return}
    case 'printBill':{const x=await getBill(v);if(!x)return;S.printBill=x;S.printPaper=null;S.overlay='print';break}

// what the customer paid on a bill, by method (snapshot saved with the bill; older bills are worked out)
function paidOf(t){const p=S.pay;const o={Cash:0,UPI:0,Card:0,refund:t.refund||0};if(!t.pay)return o;
  if(p.mode==='split'){['Cash','UPI','Card'].forEach(k=>o[k]=+p.split[k]||0)}else if(p.mode==='partial'){o[p.method]=+p.recv||0}else o[p.method]=t.pay;return o}
function billMoney(b){if(b.paid)return b.paid;const t=billTot(b);const cr=b.credit?b.credit.amount:0;const pay=Math.max(0,t.final-cr);const p=b.pay||{mode:'single',method:'Cash'};const o={Cash:0,UPI:0,Card:0,refund:Math.max(0,cr-t.final)};
  if(p.mode==='split')['Cash','UPI','Card'].forEach(k=>o[k]=+(p.split&&p.split[k])||0);else if(p.mode==='partial')o[p.method||'Cash']=+p.recv||0;else o[p.method||'Cash']=pay;return o}
const entries=(list,bizId)=>list.filter(e=>e.biz===bizId&&!e.deleted);
function cashFor(date){return date===todayStr()?ST.cash:need(`c|${date}`,()=>DB.A.query('cash',[['date','==',date]]))}
function returnsFor(date){return date===todayStr()?ST.retToday:need(`r|${date}`,()=>DB.A.query('returns',[['date','==',date]]))}
function closesFor(bizId){return need(`dc|${bizId}`,()=>DB.A.query('dayclose',[['biz','==',bizId]]))}
function moneyDay(bizId,date){
  const bills=date===todayStr()?todayOf(bizId):bizBills(billsBetween(date,date),bizId);const cash=cashFor(date);const rets=returnsFor(date);const closes=closesFor(bizId);
  if(!bills||!cash||!rets||!closes)return null;
  const o={sales:0,Cash:0,UPI:0,Card:0,refunds:0,dueGiven:0,bills:bills.length};
  bills.forEach(b=>{const m=billMoney(b);o.sales+=billTot(b).final;o.Cash+=m.Cash;o.UPI+=m.UPI;o.Card+=m.Card;o.refunds+=m.refund||0;o.dueGiven+=b.due||0});
  entries(rets,bizId).filter(r=>r.kind==='refund').forEach(r=>o.refunds+=r.amount||0);
  const es=entries(cash,bizId).sort((a,c)=>a.at-c.at);const sum=(k,mode)=>es.filter(e=>e.kind===k&&(!mode||e.mode===mode)).reduce((a,e)=>a+(+e.amount||0),0);
  o.list=es;o.dueIn=sum('due_in','Cash');o.cashIn=sum('cash_in','Cash');o.exp=sum('expense','Cash');o.sal=sum('salary','Cash');o.pur=sum('purchase','Cash');o.cashOut=sum('cash_out','Cash');
  o.expAll=sum('expense');o.salAll=sum('salary');o.purAll=sum('purchase');o.dueInAll=sum('due_in');
  const prev=closes.filter(c=>c.date<date).sort((a,c)=>c.date>a.date?1:-1)[0];o.opening=prev?+prev.counted||0:0;o.openFrom=prev?prev.date:null;
  o.expected=o.opening+o.Cash+o.dueIn+o.cashIn-o.exp-o.sal-o.pur-o.cashOut-o.refunds;
  o.close=closes.find(c=>c.date===date)||null;return o}
function newEntry(kind,extra){const b=B();const date=extra.date||todayStr();return {id:'e_'+uid(),biz:b.id,kind,date,month:date.slice(0,7),fy:fyOf(date).k,bd:`${b.id}|${date}`,at:date===todayStr()?Date.now():parseYmd(date).getTime()+12*3600e3,by:isAdmin()?'Owner':(DEVICE.name||b.name+' counter'),device:DEVICE.id,...extra}}
function saveEntry(e){DB.A.set('cash',e.id,e,false);if(e.date===todayStr()){const i=ST.cash.findIndex(x=>x.id===e.id);if(i>=0)ST.cash[i]=e;else ST.cash.push(e)}dropCache('c|');dropCache('cm|')}

function bumpUse(bizId,itemId){const u=usage();u[bizId]=u[bizId]||{};u[bizId][itemId]=(u[bizId][itemId]||0)+1;LS.set('rr.use',u)}
function quickPicks(b){const u=(usage()[b.id])||{};const today={};todayOf(b.id).forEach(x=>x.lines.forEach(l=>{if(l.itemId)today[l.itemId]=(today[l.itemId]||0)+l.qty}));
  const all=b.cats.flatMap(c=>c.items.map(it=>({c,it,n:(u[it.id]||0)+(today[it.id]||0)*2})));return all.filter(x=>x.n>0).sort((a,c)=>c.n-a.n).slice(0,8)}

function payFor(b,s,m,mo,cash,att){const [y,mm]=m.split('-').map(Number);const days=new Date(y,mm,0).getDate();let absent=0,half=0;Object.values((att&&att.d)||{}).forEach(x=>{if(x[s.id]==='A')absent++;if(x[s.id]==='H')half++});
  const paidDays=days-absent-half*0.5;const base=Math.round((s.salary||0)*paidDays/days);const sales=((mo.staff||{})[s.id]||{}).sales||0;const incentive=Math.round(sales*(s.inc||0)/100);
  const es=cash.filter(e=>e.kind==='salary'&&e.staffId===s.id&&e.biz===b.id&&!e.deleted&&(e.forMonth||e.month)===m);const adv=es.filter(e=>e.sub==='advance').reduce((a,e)=>a+(+e.amount||0),0);const paid=es.filter(e=>e.sub!=='advance').reduce((a,e)=>a+(+e.amount||0),0);
  const earned=base+incentive;return {days,absent,half,paidDays,base,sales,incentive,adv,paid,earned,bal:Math.max(0,earned-adv-paid)}}

/* ---------- entry form sheet ---------- */

  const title=k==='salary'?(f.sub==='advance'?'Give advance':'Pay salary')+' · '+esc(f.staffName):KINDS[k].l;
  return `<button class="overlay-bg" data-act="closeSheet" aria-label="Close"></button>
  <div class="sheet" role="dialog" aria-label="${title}"><div class="grab"></div>
  <form class="sh-body" id="mEntryForm"><h3>${title} · ${esc(b.name)}</h3>
    ${k==='expense'?`<div class="f"><span class="lab">What for</span><div class="chips">${C.expCats.map(c=>`<button type="button" class="chip ${f.cat===c?'on':''}" data-act="m_cat" data-v="${esc(c)}">${esc(c)}</button>`).join('')}</div></div>`:''}
    ${k==='purchase'?`<div class="f"><label for="meCat">Supplier / what was bought</label><input id="meCat" value="${esc(f.cat||'')}" placeholder="e.g. Surat wholesale, 20 bras"></div>`:''}
    ${k==='due_in'?`<div class="f"><label for="meMob">Customer mobile</label><input id="meMob" inputmode="tel" value="${esc(f.mobile||'')}" placeholder="10 digits"></div>${f.custDue!=null?`<p class="hint" style="margin:-4px 0 0">${esc(f.custName||'Customer')} owes ${inr(f.custDue)}</p>`:''}`:''}
    <div class="f"><label for="meAmt">Amount ₹</label><input id="meAmt" inputmode="numeric" class="money" style="font-size:22px" value="${f.amount||''}" placeholder="0"></div>
    <div class="f"><span class="lab">Paid by</span><div class="chips">${['Cash','UPI','Bank'].map(x=>`<button type="button" class="chip ${f.mode===x?'on':''}" data-act="m_mode" data-v="${x}">${x}</button>`).join('')}</div></div>
    <div class="f"><label for="meNote">Note (optional)</label><input id="meNote" value="${esc(f.note||'')}" placeholder="${k==='cash_out'?'e.g. Deposited in bank':'Details'}"></div>
    ${isAdmin()?`<div class="f"><label for="meDate">Date</label><input id="meDate" type="date" max="${todayStr()}" value="${f.date||todayStr()}"></div>`:''}
    <button class="primary" type="submit">SAVE</button>
  </form></div>`}
function closeSheet(){const b=B();const d=S.mDate||todayStr();const m=moneyDay(b.id,d);
  return `<button class="overlay-bg" data-act="closeSheet" aria-label="Close"></button>
  <div class="sheet" role="dialog" aria-label="Close day"><div class="grab"></div>
  <form class="sh-body" id="mCloseForm"><h3>Close day · ${dayLabel(d)} · ${esc(b.name)}</h3>
    <div class="cb-row total"><span>Expected cash in drawer</span><b>${inr(m?m.expected:0)}</b></div>
    <div class="f"><label for="mcCount">Cash counted in drawer ₹</label><input id="mcCount" inputmode="numeric" class="money" style="font-size:22px" value="${m&&m.close?m.close.counted:''}" placeholder="Count the notes and coins"></div>
    <div id="mcDiff" class="pay-status"></div>
    <div class="f"><label for="mcNote">Note (optional)</label><input id="mcNote" value="${esc(m&&m.close&&m.close.note||'')}" placeholder="e.g. ₹50 given for change"></div>
    <p class="hint" style="margin:0">Tomorrow's opening cash will be this counted amount.</p>
    <button class="primary" type="submit">CLOSE DAY</button>
  </form></div>`}
window.EXTRA_OV={mEntry:entrySheet,mClose:closeSheet};

/* ---------- actions ---------- */
function openEntry2(kind,extra){S.mForm={kind,mode:'Cash',amount:'',note:'',cat:kind==='expense'?cfg().expCats[0]:'',date:(S.screen==='money'&&S.mDate)||todayStr(),...(extra||{})};S.overlay='mEntry';render();setTimeout(()=>{const a=$('meAmt');if(a&&kind!=='due_in')a.focus()},60)}
document.addEventListener('click',async e=>{const a=e.target.closest('[data-act]');if(!a||!a.dataset.act.startsWith('m_'))return;const v=a.dataset.v;const b=B();
  switch(a.dataset.act){
    case 'm_day':{const d=addDays(S.mDate||todayStr(),+v);if(d>todayStr())return;S.mDate=d;break}
    case 'm_new':openEntry2(v);return;
    case 'm_cat':S.mForm.cat=v;document.querySelectorAll('[data-act=m_cat]').forEach(x=>x.classList.toggle('on',x.dataset.v===v));return;
    case 'm_mode':S.mForm.mode=v;document.querySelectorAll('[data-act=m_mode]').forEach(x=>x.classList.toggle('on',x.dataset.v===v));return;
    case 'm_close':S.overlay='mClose';render();setTimeout(()=>{const c=$('mcCount');if(c)c.focus()},60);return;
    case 'm_askDel':S.mDel=v;break;
    case 'm_keep':S.mDel=null;break;
    case 'm_del':{const list=(S.mDate||todayStr())===todayStr()?ST.cash:(CACHE[`c|${S.mDate}`]||{}).data||[];const en=list.find(x=>x.id===v);if(en){const ne={...en,deleted:true,deletedAt:Date.now()};saveEntry(ne);if(en.kind==='due_in'&&en.mobile)DB.incCustomer(en.mobile,null,0,+en.amount);delete CACHE.dues}S.mDel=null;toast('Entry deleted');break}
    case 'm_plMonth':S.plMonth=v;break;
    case 'm_plBiz':S.plBiz=v;break;
    case 'm_salMonth':S.salMonth=v;break;
    case 'm_adv':case 'm_pay':{const s=b.staff.find(x=>x.id===v);const m=S.salMonth||ym(new Date());let amt='';if(a.dataset.act==='m_pay'){const fy=fyNow();const aggs=(CACHE[`m|${fy.k}`]||{}).data||[];const mo=(m===ym(new Date())?ST.month[b.id]:null)||aggs.find(x=>x.biz===b.id&&x.month===m)||{};amt=payFor(b,s,m,mo,(CACHE[`cm|${m}`]||{}).data||[],(CACHE[`at|${b.id}_${m}`]||{}).data||{d:{}}).bal}
      openEntry2('salary',{sub:a.dataset.act==='m_adv'?'advance':'salary',staffId:s.id,staffName:s.name,forMonth:m,amount:amt||'',date:todayStr()});return}
    case 'm_slip':{const s=b.staff.find(x=>x.id===v);const m=S.salMonth||ym(new Date());const fy=fyNow();const aggs=(CACHE[`m|${fy.k}`]||{}).data||[];const mo=(m===ym(new Date())?ST.month[b.id]:null)||aggs.find(x=>x.biz===b.id&&x.month===m)||{};const p=payFor(b,s,m,mo,(CACHE[`cm|${m}`]||{}).data||[],(CACHE[`at|${b.id}_${m}`]||{}).data||{d:{}});
      openWA(s.phone||'',[`*Salary slip · ${monthLabel(m)}*`,`${b.name}`,`Name: ${s.name}`,`Monthly salary: ${inr(s.salary||0)}`,`Paid days: ${p.paidDays} of ${p.days}`,`Salary earned: ${inr(p.base)}`,p.incentive?`Incentive: ${inr(p.incentive)} (${s.inc}% of ${inr(p.sales)})`:'',p.adv?`Advances: -${inr(p.adv)}`:'',p.paid?`Paid: -${inr(p.paid)}`:'',`*Balance: ${inr(p.bal)}*`].filter(Boolean).join('\n'));return}
    case 'm_att':{const [sid,k]=v.split('|');const d=S.mDate||todayStr();const m=d.slice(0,7);const id=`${b.id}_${m}`;const c=CACHE[`at|${id}`];if(c&&c.data){c.data.d=c.data.d||{};c.data.d[d]=c.data.d[d]||{};c.data.d[d][sid]=k}
      DB.A.set('attendance',id,{biz:b.id,month:m,d:{[d]:{[sid]:k}}},true);break}
    case 'm_reloadDues':delete CACHE.dues;break;
    case 'm_remind':{const c=((CACHE.dues||{}).data||[]).find(x=>x.mobile===v);if(!c)return;openWA(v,`Namaste ${c.name||''}, a gentle reminder from ${b.name}: ${inr(c.due)} is pending on your account. Thank you!`);return}
    case 'm_recvDue':{const c=((CACHE.dues||{}).data||[]).find(x=>x.mobile===v);if(!c)return;openEntry2('due_in',{mobile:v,custName:c.name,custDue:c.due,amount:c.due});return}
    case 'm_exportPL':{const m=S.plMonth;const cash=(CACHE[`cm|${m}`]||{}).data;if(!cash)return;const rows=[['Date','Shop','Type','For','Staff','Amount','Paid by','Note','By']];cash.filter(e=>!e.deleted).sort((x,y)=>x.at-y.at).forEach(e=>rows.push([e.date,(ST.biz.find(x=>x.id===e.biz)||{}).name,KINDS[e.kind].l+(e.sub==='advance'?' (advance)':''),e.cat||'',e.staffName||'',e.amount,e.mode,e.note||'',e.by||'']));csvDownload(`Expenses and cash ${monthLabel(m)}.csv`,rows);return}
    default:return;
  }
  render();
});
document.addEventListener('input',e=>{const t=e.target;
  if(t.id==='mcCount'){const b=B();const m=moneyDay(b.id,S.mDate||todayStr());const el=$('mcDiff');if(!m||!el)return;const c=+t.value.replace(/[^0-9]/g,'')||0;const d=c-m.expected;el.className='pay-status '+(t.value===''?'':d===0?'ok':'bad');el.textContent=t.value===''?'':d===0?'Matches the expected cash':`${d>0?'Extra':'Short'} ${inr(Math.abs(d))}`}
  if(t.id==='meMob'){const m=digits(t.value);if(m.length===10){DB.customer(m).then(c=>{if(!S.mForm)return;S.mForm.mobile=m;S.mForm.custName=c&&c.name;S.mForm.custDue=c?c.due||0:0;S.mForm.amount=$('meAmt').value||(c&&c.due)||'';S.mForm.note=$('meNote').value;render()})}}
});
document.addEventListener('submit',e=>{const f=e.target;if(!['mEntryForm','mCloseForm','expCatForm'].includes(f.id))return;e.preventDefault();e.stopImmediatePropagation();const val=id=>($(id)?$(id).value:'').trim();const b=B();
  if(f.id==='mEntryForm'){const F=S.mForm;const amt=+val('meAmt').replace(/[^0-9.]/g,'');if(!amt){toast('Enter the amount');return}
    const extra={cat:F.kind==='purchase'?val('meCat'):F.cat||'',amount:amt,mode:F.mode,note:val('meNote'),date:isAdmin()&&val('meDate')?val('meDate'):todayStr()};
    if(F.kind==='salary')Object.assign(extra,{sub:F.sub,staffId:F.staffId,staffName:F.staffName,forMonth:F.forMonth});
    if(F.kind==='due_in'){const m=digits(val('meMob'));if(m.length!==10){toast('Enter the customer mobile');return}extra.mobile=m;extra.cat=F.custName||m;DB.incCustomer(m,null,0,-amt);delete CACHE.dues}
    const en=newEntry(F.kind,extra);saveEntry(en);S.overlay=null;S.mForm=null;render();toast(`${KINDS[en.kind].l} of ${inr(amt)} saved${en.mode==='Cash'?' · cash book updated':''}`);return}
  if(f.id==='mCloseForm'){const c=val('mcCount');if(c===''){toast('Type the cash you counted');return}const d=S.mDate||todayStr();const m=moneyDay(b.id,d);
    const doc={id:`${b.id}_${d}`,biz:b.id,date:d,counted:+c.replace(/[^0-9]/g,'')||0,expected:m?m.expected:0,note:val('mcNote'),by:isAdmin()?'Owner':(DEVICE.name||b.name+' counter'),at:Date.now()};
    DB.A.set('dayclose',doc.id,doc,false);const cl=CACHE[`dc|${b.id}`];if(cl&&cl.data){cl.data=cl.data.filter(x=>x.id!==doc.id).concat([doc])}S.overlay=null;render();const diff=doc.counted-doc.expected;toast(diff===0?'Day closed. Cash matches.':`Day closed. Cash is ${diff>0?'extra':'short'} by ${inr(Math.abs(diff))}.`);return}
  if(f.id==='expCatForm'){const v=val('expCatIn');if(!v)return;const list=cfg().expCats.includes(v)?cfg().expCats:cfg().expCats.concat([v]);DB.saveConfig({expCats:list});ST.cfg.expCats=list;render();toast(`"${v}" added`);return}
},true);

/* ---------- home card, extra actions ---------- */
function moneyCard(b){const m=moneyDay(b.id,todayStr());if(!m)return '';
  return `<button class="money-card" data-act="m_goMoney"><span class="mc-h"><span>${ic('cash')} Money today · ${esc(b.name)}</span><span class="hint">${m.close?'Day closed':'Open ›'}</span></span>
    <div><span>Cash in drawer</span><b>${inr(m.close?m.close.counted:m.expected)}</b></div><div><span>UPI + Card</span><b>${inr(m.UPI+m.Card)}</b></div><div><span>Expenses</span><b class="${m.expAll+m.salAll?'out':''}">${inr(m.expAll+m.salAll)}</b></div></button>`}
document.addEventListener('click',e=>{const a=e.target.closest('[data-act]');if(!a)return;
  if(a.dataset.act==='m_goMoney'){S.mDate=todayStr();go('money')}
  if(a.dataset.act==='m_rmExp'){const v=a.dataset.v;const list=cfg().expCats.filter(x=>x!==v);if(!list.length){toast('Keep at least one expense type');return}DB.saveConfig({expCats:list});ST.cfg.expCats=list;render();toast(`"${v}" removed`)}
});
// going to cash book / attendance always starts on today
const _go=go;go=function(s){if((s==='money'||s==='attendance')&&S.screen!==s&&S.screen!=='salary')S.mDate=todayStr();_go(s)};

/* ============================================================
   Item photo icons: small pictures kept in their own records
   (collection "thumbs", one per item) so shop data stays light
   ============================================================ */
ST.thumbs={};
function thumbOf(id){const t=id&&ST.thumbs[id];return t?t.data:null}
function itemIcon(c,it){const src=thumbOf(it.id);return src?`<img class="it-img" src="${src}" alt="" loading="lazy">`:ic(c.icon)}
function saveThumb(bizId,itemId,data){const d={id:itemId,biz:bizId,data,at:Date.now()};ST.thumbs[itemId]=d;DB.A.set('thumbs',itemId,d,false)}
function delThumb(itemId){delete ST.thumbs[itemId];DB.A.del('thumbs',itemId)}
// square crop, 160 px, small JPEG (about 6–10 KB)
function shrinkThumb(file,cb){const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const S0=160;const c=document.createElement('canvas');c.width=S0;c.height=S0;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,S0,S0);
  const m=Math.min(im.width,im.height);x.drawImage(im,(im.width-m)/2,(im.height-m)/2,m,m,0,0,S0,S0);let q=.8,u=c.toDataURL('image/jpeg',q);while(u.length>16000&&q>.4){q-=.1;u=c.toDataURL('image/jpeg',q)}cb(u)};im.onerror=()=>toast('Could not read that photo');im.src=r.result};r.readAsDataURL(file)}
// live: this shop's item photos (owner: all shops)
const _subDayT=subscribeDay;
subscribeDay=function(){_subDayT();const A=DB.A;if(!A||!todayUnsub)return;const scope=S.login&&S.login!=='owner'?S.login:null;
  todayUnsub.push(A.listen('thumbs',scope?[['biz','==',scope]]:[],docs=>{const m={};docs.forEach(d=>m[d.id]=d);ST.thumbs=m;renderSoft()}))};
document.addEventListener('click',e=>{const a=e.target.closest('[data-act="ifImgDel"]');if(!a||!S.form)return;S.form.name=$('ifName').value;S.form.img=null;render();const n=$('ifName');if(n)n.value=S.form.name});

</script>
<script>
/* ============================================================
   Stock & barcode billing (v1.3)
   - Stock list per shop, imported from the myBillBook item export (Excel)
   - Scan a barcode (USB / Bluetooth scanner or phone camera) on New sale
   - Stock goes down on sale, back up on return, edit or delete
   - Stock in, count adjust, low / out of stock, TSC barcode labels
   Data: collection "stock", 24 records per shop ("rosy_0" … "rosy_23"),
   each holding a map of items, so opening the app costs 24 reads, not thousands.
   ============================================================ */
const SK_PACKS=24;
const SKV='1.8.0';
ST.stock={};      // biz -> {key: item}
ST.skIdx={};      // biz -> {bc:Map, dno:Map, name:Map}
ST.skLoaded={};   // biz -> true once the first snapshot arrived
ST.skDnMax={};   // biz -> highest D.no ever used (deleted items too), so D.nos are never reused
const SK={pendingExtras:null,scanBuf:'',scanT:0,labelQ:{},filter:{q:'',cat:'',brand:'',status:'all',limit:60},view:null,cam:null};
IC.scan='<path d="M4 7V5a1 1 0 0 1 1-1h2M17 4h2a1 1 0 0 1 1 1v2M20 17v2a1 1 0 0 1-1 1h-2M7 20H5a1 1 0 0 1-1-1v-2"/><path d="M8 8v8M11 8v8M14 8v8M17 8v8"/>';
IC.stack='<path d="M12 3l9 5-9 5-9-5z"/><path d="M3 13l9 5 9-5"/>';
IC.label='<path d="M3 12V4h8l9 9-8 8z"/><path d="M7 8h.01M9 15l3-3M12 18l3-3"/>';
IC.upload='<path d="M12 20V9M7 13l5-5 5 5M5 4h14"/>';
IC.trend='<path d="M3 17l6-6 4 4 8-8"/><path d="M15 7h6v6"/>';

/* ---------- keys and packs ---------- */
const skKey=s=>String(s||'').trim().toUpperCase().replace(/[^A-Z0-9]/g,'_').slice(0,80);
function skPack(key){let h=0;for(let i=0;i<key.length;i++)h=(h*31+key.charCodeAt(i))>>>0;return h%SK_PACKS}
const skDoc=(biz,key)=>`${biz}_${skPack(key)}`;
const skItems=biz=>ST.stock[biz]||{};
const skCount=biz=>Object.keys(skItems(biz)).length;
const skHas=biz=>skCount(biz)>0;
function skReindex(biz){const bc=new Map(),dno=new Map(),name=new Map();
  Object.entries(skItems(biz)).forEach(([k,it])=>{if(it.bc)bc.set(String(it.bc).toUpperCase(),k);if(it.dn)dno.set(String(it.dn).toUpperCase(),k);if(it.n)name.set(String(it.n).toUpperCase(),k)});
  ST.skIdx[biz]={bc,dno,name}}
function skFind(biz,code){const c=String(code||'').trim().toUpperCase();if(!c)return null;const ix=ST.skIdx[biz];if(!ix)return null;
  const k=ix.bc.get(c)||ix.name.get(c)||ix.dno.get(c)||(c.replace(/^0+/,'')&&ix.bc.get(c.replace(/^0+/,'')))||null;return k?{key:k,it:skItems(biz)[k]}:null}
function skSearch(biz,q,limit=12){q=String(q||'').trim().toLowerCase();if(!q)return [];const out=[];
  for(const [k,it] of Object.entries(skItems(biz))){const hay=`${it.n} ${it.bc||''} ${it.dn||''} ${it.c||''} ${it.br||''}`.toLowerCase();if(hay.includes(q)){out.push({key:k,it});if(out.length>=limit)break}}return out}
const skQty=it=>Math.round(+it.q||0);
const skLow=it=>{const q=skQty(it);return q>0&&q<=Math.max(1,+it.lo||1)};
const skPrice=it=>+it.sp||+it.m||0;
function skParse(name){const p=String(name||'').trim().split('-');if(p.length>=3)return {article:p.slice(0,-2).join('-'),color:p[p.length-2],size:p[p.length-1]};if(p.length===2)return {article:p[0],color:p[1],size:''};return {article:String(name||''),color:'',size:''}}
function skParseCode(raw){const code=String(raw||'').trim();if(!code||code==='Not Found')return {party:'',brand:'',rate:0};const p=code.split('-');if(p.length<2)return {party:code,brand:'',rate:0};
  const rate=parseFloat(p[p.length-1])||0;const mid=p.slice(1,-1);const bp=[];for(let i=mid.length-1;i>=0;i--){if(!/\d/.test(mid[i].replace(/[\/\.']/g,'')))bp.unshift(mid[i]);else break}
  return {party:p[0],brand:(bp.length?bp.join('-'):mid[mid.length-1]||'').toUpperCase(),rate}}

/* ---------- writes ---------- */
function skWrite(biz,map){// map: key -> partial item (may contain A.inc for q)
  const packs={};for(const k in map){const d=skDoc(biz,k);(packs[d]=packs[d]||{})[k]=map[k]}
  return Promise.all(Object.entries(packs).map(([d,items])=>DB.A.set('stock',d,{biz,p:+d.split('_').pop(),items},true)))}
function skMove(biz,deltas,why){// deltas: key -> +/- qty
  const m={};let any=false;for(const k in deltas){if(!deltas[k])continue;any=true;m[k]={q:DB.A.inc(deltas[k])};const it=skItems(biz)[k];if(it)it.q=skQty(it)+deltas[k]}
  if(!any)return;skWrite(biz,m);if(why)DB.A.set('stocklog','sl_'+uid(),{biz,at:Date.now(),date:todayStr(),by:isAdmin()?'Owner':(DEVICE.name||biz+' counter'),why,d:deltas},false)}

/* ---------- stock follows the bills ---------- */
function skBillQty(b){const m={};if(!b||b.deleted)return m;(b.lines||[]).forEach(l=>{if(l.sk&&!l.returned)m[l.sk]=(m[l.sk]||0)+(+l.qty||0)});return m}
const _dbSaveBill=DB.saveBill.bind(DB);
DB.saveBill=function(b,prev){
  if(SK.pendingExtras&&b&&b.lines)b.lines.forEach((l,i)=>{const x=SK.pendingExtras[i];if(x)Object.assign(l,x)});
  _dbSaveBill(b,prev);
  try{const now=skBillQty(b),was=skBillQty(prev);const d={};new Set([...Object.keys(now),...Object.keys(was)]).forEach(k=>{const v=(was[k]||0)-(now[k]||0);if(v)d[k]=v});
    if(Object.keys(d).length)skMove(b.biz,d,null)}catch(e){console.warn('stock update',e)}
};
const _saveSale=saveSale;
saveSale=function(){SK.pendingExtras=S.cart.map(l=>l.sk?{sk:l.sk,bc:l.bc||'',dno:l.dno||'',brand:l.brand||'',size:l.size||'',color:l.color||''}:null);try{_saveSale()}finally{SK.pendingExtras=null}};
const _startEdit=startEdit;
startEdit=function(bill){_startEdit(bill);const act=(bill.lines||[]).filter(l=>!l.returned);
  S.cart.forEach((c,i)=>{const l=act[i];if(l&&l.sk)Object.assign(c,{sk:l.sk,bc:l.bc,dno:l.dno,brand:l.brand,size:l.size,color:l.color,skCost:l.cost})});render()};
// cost of a scanned item comes from the stock record (staff never type a code)
const _unitCost=unitCost;
unitCost=function(it){if(it&&it.sk&&+it.skCost>0)return {ok:true,val:Math.round(+it.skCost)};return _unitCost(it)};
// reports can group by brand
const _billRecs=billRecs;
billRecs=function(b){const rs=_billRecs(b);const act=(b.lines||[]).filter(l=>!l.returned);rs.forEach((r,i)=>{const l=act[i];if(l){r.brand=l.brand||'';r.sk=l.sk||'';r.size=l.size||''}});return rs};

/* ---------- live stock ---------- */
const _subDayS=subscribeDay;
subscribeDay=function(){_subDayS();const A=DB.A;if(!A||!todayUnsub||!S.login)return;const scope=S.login!=='owner'?S.login:null;
  todayUnsub.push(A.listen('stock',scope?[['biz','==',scope]]:[],docs=>{const by={};docs.forEach(d=>{(by[d.biz]=by[d.biz]||{});const its=d.items||{};for(const k in its){const it=its[k];if(it&&it.dn){const n=parseInt(it.dn);if(n>(ST.skDnMax[d.biz]||0))ST.skDnMax[d.biz]=n}if(!it||it.del)continue;by[d.biz][k]=it}});

/* ---------- adding a scanned item to the bill ---------- */
function skAddToCart(key,qty=1){const b=B();const it=skItems(b.id)[key];if(!it)return false;
  const same=S.cart.find(l=>l.sk===key&&+l.price===skPrice(it));
  if(same)same.qty+=qty;else{const pn=skParse(it.n);S.cart.push({itemId:null,cat:it.c||'Stock',icon:'garment',name:it.n,qty,price:skPrice(it),mode:'mrp',mrp:+it.m||skPrice(it),code:'',note:[it.dn?'D.no '+it.dn:'',it.br||''].filter(Boolean).join(' · '),sk:key,bc:it.bc||'',dno:it.dn||'',brand:it.br||'',size:pn.size,color:pn.color,skCost:+it.co||0})}
  const left=skQty(it)-S.cart.filter(l=>l.sk===key).reduce((a,l)=>a+l.qty,0);
  S.entry=null;render();
  toast(`${left<0?'⚠ Not in stock records · ':''}Added ${it.n} · ${inr(skPrice(it))}${left>=0?` · ${left} left`:''}`);
  if(navigator.vibrate)navigator.vibrate(left<0?[60,40,60]:30);
  return true}
function skScan(code){const b=B();if(!b)return;code=String(code||'').trim();if(!code)return;
  const f=skFind(b.id,code);if(f){skAddToCart(f.key);return true}
  const hits=skSearch(b.id,code,2);if(hits.length===1){skAddToCart(hits[0].key);return true}
  toast(`"${code}" is not in ${b.name}'s stock list`);if(navigator.vibrate)navigator.vibrate([90,50,90]);return false}

/* ---------- scanner gun: fast keystrokes ending in Enter, anywhere on the sale screen ---------- */
document.addEventListener('keydown',e=>{
  if(S.screen!=='sale'||S.overlay)return;const t=e.target;const inField=t&&(t.tagName==='INPUT'||t.tagName==='TEXTAREA'||t.tagName==='SELECT');
  if(t&&t.id==='skScan'){if(e.key==='Enter'){e.preventDefault();const v=t.value;if(skScan(v)){t.value='';const s=$('skSug');if(s)s.innerHTML='';setTimeout(()=>{const n=$('skScan');if(n)n.focus()},30)}}return}
  if(inField)return;
  const now=Date.now();if(now-SK.scanT>80)SK.scanBuf='';SK.scanT=now;
  if(e.key==='Enter'){if(SK.scanBuf.length>=3){e.preventDefault();skScan(SK.scanBuf)}SK.scanBuf='';return}
  if(e.key.length===1)SK.scanBuf+=e.key;
},true);
document.addEventListener('input',e=>{const t=e.target;
  if(t.id==='skScan'){const s=$('skSug');if(s)s.innerHTML=skSugHTML(t.value.trim());return}
  if(t.id==='skQ'){SK.filter.q=t.value;SK.filter.limit=60;clearTimeout(SK.qt);SK.qt=setTimeout(()=>{const pos=t.selectionStart;render();const n=$('skQ');if(n){n.focus();n.setSelectionRange(pos,pos)}},250);return}

/* ---------- camera scan ---------- */
function skLoad(src,test){return new Promise((res,rej)=>{if(test())return res();const s=document.createElement('script');s.src=src;s.onload=()=>res();s.onerror=()=>rej(new Error('load'));document.head.appendChild(s)})}
async function skCamOpen(onCode){
  S.overlay='skCam';render();const v=$('skVideo');const st=$('skCamMsg');
  let stream;try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment',width:{ideal:1280}},audio:false})}catch(e){st.textContent='Camera not allowed. Allow camera access for this site, or use a scanner gun.';return}
  SK.cam={stream,stop:false};v.srcObject=stream;await v.play().catch(()=>{});
  const done=code=>{if(SK.cam&&!SK.cam.stop){skCamClose();onCode(code)}};
  if('BarcodeDetector' in window){let det;try{det=new BarcodeDetector({formats:['code_128','ean_13','ean_8','code_39','upc_a','upc_e','itf','qr_code']})}catch(e){det=new BarcodeDetector()}
    const tick=async()=>{if(!SK.cam||SK.cam.stop)return;try{const r=await det.detect(v);if(r&&r[0]&&r[0].rawValue){done(r[0].rawValue);return}}catch(e){}setTimeout(tick,160)};tick();return}
  try{st.textContent='Loading scanner…';await skLoad('https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js',()=>window.ZXing);st.textContent='Point the camera at the barcode';
    const r=new ZXing.BrowserMultiFormatReader();SK.cam.zx=r;r.decodeFromVideoElementContinuously(v,(res)=>{if(res)done(res.getText())})}
  catch(e){st.textContent='Camera scanning is not available on this phone. Type the barcode instead.'}}
function skCamClose(){if(SK.cam){SK.cam.stop=true;try{SK.cam.zx&&SK.cam.zx.reset()}catch(e){}(SK.cam.stream?SK.cam.stream.getTracks():[]).forEach(t=>t.stop())}SK.cam=null;if(S.overlay==='skCam'){S.overlay=null;render()}}

  <div class="skcam"><video id="skVideo" playsinline muted></video><i></i></div><p class="hint" id="skCamMsg">Point the camera at the barcode on the tag</p><button class="secondary" data-act="skCamX">Close</button></div></div>`}

/* ---------- Excel import (myBillBook "Items" export) ---------- */
async function skImport(file){const b=B();if(!isAdmin())return;
  toast('Reading Excel…');
  try{await skLoad('https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js',()=>window.XLSX)}catch(e){toast('Could not load the Excel reader. Check the internet.');return}
  const buf=await file.arrayBuffer();let wb;try{wb=XLSX.read(new Uint8Array(buf),{type:'array'})}catch(e){toast('That file could not be read as Excel');return}
  const sh=wb.Sheets['master data']||wb.Sheets[wb.SheetNames[0]];const rows=XLSX.utils.sheet_to_json(sh,{header:1,defval:''});
  if(rows.length<2){toast('No rows found in the first sheet');return}
  const H=rows[0].map(h=>String(h).trim().toLowerCase());
  const col=(re,fb)=>{const i=H.findIndex(h=>re.test(h));return i>=0?i:fb};
  const C={n:col(/^item ?name|^name$|^product ?name/,0),c:col(/categor/,2),bc:col(/item ?code|barcode/,3),sp:col(/sales? ?price|selling/,6),co:col(/purchase ?price|cost/,8),m:col(/^mrp/,10),q:col(/current ?stock|^stock|quantity|^qty/,11),lo:col(/low ?stock/,12),dn:col(/^d\.? ?no|design/,15),cd:col(/^code$/,16)};
  const items={};let n=0;let dnoNext=+skNextDno(b.id);const usedBc=new Set();
  for(let i=1;i<rows.length;i++){const r=rows[i];const name=String(r[C.n]||'').trim().toUpperCase();if(!name||/^example|^how to/i.test(name))continue;
    let bc=String(r[C.bc]||'').trim();const ex=!bc&&ST.skIdx[b.id]?ST.skIdx[b.id].name.get(name):null;
    if(!bc&&ex)bc=skItems(b.id)[ex].bc||'';if(!bc){do{bc=skNewBarcode(b.id)}while(usedBc.has(bc))}usedBc.add(bc);
    const key=ex||skKey(bc);const pc=skParseCode(r[C.cd]);
    if(!String(r[C.dn]||'').trim())r[C.dn]=ex&&skItems(b.id)[ex].dn?skItems(b.id)[ex].dn:String(dnoNext++);
    const cost=+r[C.co]||0;items[key]={n:name,c:String(r[C.c]||'').trim()||'Other',bc:bc||'',dn:String(r[C.dn]||'').trim(),cd:String(r[C.cd]||'').trim(),pt:pc.party,br:pc.brand,

/* ---------- customer return / exchange: pieces, reason, condition ---------- */
const _exchange=screens.exchange;
screens.exchange=function(){const h=_exchange();if(!S.ex)return h;const x=S.ex.bill;
  const R=SK.ret&&SK.ret.bill===x.id?SK.ret:(SK.ret={bill:x.id,rq:{},reason:'',cond:'good'});
  const sel=x.lines.map((l,i)=>({l,i})).filter(({l,i})=>S.ex.sel[i]&&!l.returned);if(!sel.length)return h;
  const block=`<div class="card skret"><div class="card-h"><h3>Coming back</h3><span class="hint">recorded item-wise</span></div>
    ${sel.map(({l,i})=>{const q=R.rq[i]??l.qty;return `<div class="bline"><div class="grow"><b>${esc(l.name)}</b><span>${l.sk?'Stock item'+(l.dno?' · D.no '+esc(l.dno):''):esc(l.cat)} · sold ${l.qty}</span></div>${l.qty>1?`<div class="stepper sm"><button data-act="rtQ" data-i="${i}" data-d="-1" aria-label="Less">−</button><span>${q}</span><button data-act="rtQ" data-i="${i}" data-d="1" aria-label="More">+</button></div>`:`<b>${q}</b>`}</div>`}).join('')}
    <div class="f" style="margin-top:8px"><span class="lab">Reason</span><div class="chips">${SK_REASONS.map(r=>`<button class="chip ${R.reason===r?'on':''}" data-act="rtReason" data-v="${esc(r)}">${esc(r)}</button>`).join('')}</div></div>
    <div class="f" style="margin-top:8px"><span class="lab">Condition of the piece</span><div class="chips"><button class="chip ${R.cond==='good'?'on':''}" data-act="rtCond" data-v="good">Good · back to stock</button><button class="chip ${R.cond==='damaged'?'on':''}" data-act="rtCond" data-v="damaged">Damaged · keep aside</button></div></div>
    ${R.cond==='damaged'?'<p class="warnline" style="margin-top:8px">Damaged pieces are not sellable. They go to the damaged list, ready for goods return to the party.</p>':''}</div>`;
  // show the value of only the pieces coming back
  const all=x.lines.reduce((a,l)=>a+lineAmt(l),0)||1;const share=(l,q)=>{const g=l.price*q;return g-Math.round((x.disc||0)*g/all)};
  const full=sel.reduce((a,{l})=>a+share(l,l.qty),0),part=sel.reduce((a,{l,i})=>a+share(l,Math.min(l.qty,R.rq[i]??l.qty)),0);
  let out=h;if(part!==full){out=out.split('<b>'+inr(full)+'</b>').join('<b>'+inr(part)+'</b>').split('refund '+inr(full)).join('refund '+inr(part))}
  const k=out.indexOf('<div class="btn-row">');return k<0?out+block:out.slice(0,k)+block+out.slice(k)};
const _applyReturn=applyReturn;
applyReturn=function(kind){const x0=S.ex&&S.ex.bill;if(!x0)return _applyReturn(kind);const R=SK.ret&&SK.ret.bill===x0.id?SK.ret:{rq:{},reason:'',cond:'good'};
  // split lines when only some pieces come back, so the rest stay on the bill
  const x=clone(x0);const sel={};let off=0;const lines=[];
  x.lines.forEach((l,i)=>{const on=S.ex.sel[i]&&!l.returned;const q=on?Math.min(l.qty,Math.max(1,R.rq[i]??l.qty)):0;
    if(on&&q<l.qty){lines.push({...l,qty:l.qty-q});lines.push({...l,qty:q});sel[lines.length-1]=true}else{lines.push(l);if(on)sel[lines.length-1]=true}});
  x.lines=lines;S.ex.bill=x;S.ex.sel=sel;
  const back=lines.map((l,i)=>sel[i]?l:null).filter(Boolean);const all=lines.reduce((a,l)=>a+lineAmt(l),0)||1;
  const recs=back.map(l=>({id:'rt_'+uid(),biz:x.biz,at:Date.now(),date:todayStr(),kind,bill:x.id,no:x.no,soldOn:x.date,staff:x.staff||'',sk:l.sk||'',name:l.name,cat:l.cat,bc:l.bc||'',dno:l.dno||'',brand:l.brand||'',size:l.size||'',qty:l.qty,
    value:lineAmt(l)-Math.round((x.disc||0)*lineAmt(l)/all),reason:R.reason||'',cond:R.cond||'good',customer:(x.customer&&x.customer.mobile)||'',by:isAdmin()?'Owner':(DEVICE.name||'counter')}));
  _applyReturn(kind);
  recs.forEach(r=>DB.A.set('skret',r.id,r,false));
  // damaged: the bill change already put the pieces back; move them from sellable to damaged
  if(R.cond==='damaged'){const d={},m={};recs.filter(r=>r.sk).forEach(r=>{d[r.sk]=(d[r.sk]||0)-r.qty;m[r.sk]={dm:DB.A.inc(r.qty)};const it=skItems(x.biz)[r.sk];if(it)it.dm=(+it.dm||0)+r.qty});
    if(Object.keys(d).length){skMove(x.biz,d,'damaged return');skWrite(x.biz,m)}}
  SK.ret=null;delete CACHE['skret|'+x.biz]};

/* ---------- goods return to supplier (party) ---------- */
function skSupSheet(){const b=B();const f=S.skSup||(S.skSup={lines:{},from:'good',reason:'',note:'',q:''});const keys=Object.keys(f.lines);
  const hits=f.q&&f.q.length>=2?skSearch(b.id,f.q,6):[];const parties=[...new Set(keys.map(k=>(skItems(b.id)[k]||{}).pt).filter(Boolean))];
  const pcs=keys.reduce((a,k)=>a+f.lines[k],0);const val=keys.reduce((a,k)=>a+f.lines[k]*(+(skItems(b.id)[k]||{}).co||0),0);

    <div class="f"><span class="lab">Take the pieces from</span><div class="chips"><button class="chip ${f.from==='good'?'on':''}" data-act="supFrom" data-v="good">Sellable stock</button><button class="chip ${f.from==='damaged'?'on':''}" data-act="supFrom" data-v="damaged">Damaged list</button></div></div>
    <div class="search"><div class="inp">${ic('scan')}<input id="supQ" value="${esc(f.q)}" placeholder="Scan or type barcode, D.no, name" autocomplete="off" autocapitalize="characters"></div><button class="scan-btn" data-act="supCam" aria-label="Scan with camera">${ic('camera')}</button></div>
    ${hits.length?`<div class="sksug">${hits.map(({key,it})=>`<button data-act="supAdd" data-k="${esc(key)}"><b>${esc(it.n)}</b><span>${esc([it.br,it.pt?'Party '+it.pt:''].filter(Boolean).join(' · '))}</span><em>${f.from==='damaged'?'dmg '+(+it.dm||0):''}</em><i>${f.from==='damaged'?(+it.dm||0):skQty(it)}</i></button>`).join('')}</div>`:''}
    ${f.from==='damaged'&&!keys.length?skDamagedList():''}
    <div class="sklist">${keys.map(k=>{const it=skItems(b.id)[k];if(!it)return '';const have=f.from==='damaged'?(+it.dm||0):skQty(it);return `<div class="skrow"><div><b>${esc(it.n)}</b><span>${esc([it.br,it.pt?'Party '+it.pt:''].filter(Boolean).join(' · '))} · ${f.from==='damaged'?'damaged':'in stock'} ${have}</span></div><input class="lq" data-supq="${esc(k)}" inputmode="numeric" value="${f.lines[k]}" aria-label="Pieces"></div>`}).join('')}</div>
    ${keys.length?`<p class="hint">${pcs} pcs${isAdmin()&&val?` · cost ${inr(val)}`:''}${parties.length?` · party ${parties.map(esc).join(', ')}`:''}</p>`:''}
    <div class="f"><span class="lab">Reason</span><div class="chips">${SK_SUP_REASONS.map(r=>`<button class="chip ${f.reason===r?'on':''}" data-act="supReason" data-v="${esc(r)}">${esc(r)}</button>`).join('')}</div></div>
    <div class="f"><label for="supNote">Note (challan no., transport…)</label><input id="supNote" value="${esc(f.note)}"></div>
    <button class="primary" data-act="supSave" ${keys.length?'':'disabled'}>SAVE GOODS RETURN · ${pcs} PCS</button>
  </div></div>`}
function skDamagedList(){const b=B();const d=Object.entries(skItems(b.id)).filter(([,it])=>+it.dm>0);if(!d.length)return '<p class="hint">No damaged pieces right now.</p>';
  return `<p class="lab" style="margin:0">Damaged pieces · tap to add</p><div class="sksug">${d.map(([key,it])=>`<button data-act="supAdd" data-k="${esc(key)}"><b>${esc(it.n)}</b><span>${esc([it.br,it.pt?'Party '+it.pt:''].filter(Boolean).join(' · '))}</span><em></em><i class="out">${+it.dm}</i></button>`).join('')}</div>`}
function skSupSave(){const b=B();const f=S.skSup;if(!f)return;const keys=Object.keys(f.lines).filter(k=>f.lines[k]>0);if(!keys.length)return;
  const gid='gr_'+uid();const now=Date.now();const d={},m={};

/* ---------- returns report ---------- */
function skRetData(biz){return need('skret|'+biz,()=>DB.A.query('skret',[['biz','==',biz]]))}
screens.skReturns=function(){const b=B();const all=skRetData(b.id);const tb=topbar('Returns & exchanges','stock',bizPill());if(!all)return `${tb}<div class="pad">${loading()}</div>`;
  const per=S.rtPer||'month';const t=todayStr();const from=per==='month'?t.slice(0,8)+'01':per==='last'?ym(new Date(new Date().getFullYear(),new Date().getMonth()-1,1))+'-01':per==='3m'?addDays(t,-90):'0000';
  const to=per==='last'?monthRange(ym(new Date(new Date().getFullYear(),new Date().getMonth()-1,1)))[1]:'9999';
  const kind=S.rtKind||'all';let rs=all.filter(r=>r.date>=from&&r.date<=to);const sum=k=>rs.filter(r=>r.kind===k).reduce((a,r)=>a+r.qty,0);
  const tot={refund:sum('refund'),exchange:sum('exchange'),supplier:sum('supplier'),damaged:rs.filter(r=>r.kind!=='supplier'&&r.cond==='damaged').reduce((a,r)=>a+r.qty,0)};
  if(kind!=='all')rs=rs.filter(r=>r.kind===kind);
  const grp=(key)=>Object.entries(groupBy(rs,key)).map(([k,x])=>({k:k||'—',q:x.reduce((a,r)=>a+r.qty,0),v:x.reduce((a,r)=>a+(r.value||0),0)})).sort((a,c)=>c.q-a.q);
  const bars=(rows,lim=8)=>{const mx=Math.max(1,...rows.map(r=>r.q));return rows.slice(0,lim).map(r=>`<div class="month-row"><span>${esc(r.k)}</span><div class="bar"><i style="width:${pct(r.q,mx)}%"></i></div><b>${r.q}</b></div>`).join('')};
  const KL={refund:'Return',exchange:'Exchange',supplier:'To party'};
  const sold=need(`b|${from<'2000'?addDays(t,-365):from}|${addDays(t,-1)}`,()=>DB.billsRange(from<'2000'?addDays(t,-365):from,addDays(t,-1)));
  return `${tb}<div class="pad" style="padding-top:4px;gap:12px">
    <div class="chips scroll">${[['month','This month'],['last','Last month'],['3m','3 months'],['all','All time']].map(([k,l])=>`<button class="chip ${per===k?'on':''}" data-act="rtPer" data-v="${k}">${l}</button>`).join('')}</div>
    <div class="kgrid">
      <button class="kpi skk ${kind==='refund'?'on':''}" data-act="rtKind" data-v="refund"><span>Customer returns</span><b>${tot.refund} pcs</b></button>
      <button class="kpi skk ${kind==='exchange'?'on':''}" data-act="rtKind" data-v="exchange"><span>Exchanges</span><b>${tot.exchange} pcs</b></button>
      <button class="kpi skk ${kind==='supplier'?'on':''}" data-act="rtKind" data-v="supplier"><span>Goods return to party</span><b>${tot.supplier} pcs</b></button>
      <div class="kpi"><span>Came back damaged</span><b style="color:var(--bad)">${tot.damaged} pcs</b></div></div>
    ${kind!=='all'?`<p class="hint">Showing ${KL[kind].toLowerCase()}s only · <button class="linkbtn" data-act="rtKind" data-v="all">Show all</button></p>`:''}
    ${rs.length?`<div class="card"><div class="card-h"><h3>Most returned items</h3><span class="hint">pieces</span></div>${bars(grp('name'),10)}</div>
    <div class="card"><div class="card-h"><h3>Why</h3></div>${bars(grp('reason'))}</div>

/* ============================================================
   v1.5 · A sales dashboard for every store
   - Owner home: one colour card per store (today, month, vs last month, target)
   - Store dashboard: cards chosen per store (Rosy: stock, sizes, brands, returns;
     Pinky: categories, price ranges; Cmore: items, staff…), order and on/off saved
     on the business record (b.dash) and a monthly store target (b.target)
   ============================================================ */
const DCARDS={
  today:['Today by hour','Sales hour by hour today'],
  trend:['Last 30 days','Daily sales, last 30 days'],
  staff:['Staff & targets','Who sold how much this month'],
  cats:['Categories','Sales by category this month'],
  items:['Top items','Best sellers this month'],
  price:['Price ranges','Which price range sells most'],
  pay:['How customers paid','Cash, UPI, card, due this month'],
  week:['Best weekdays','Average sale by weekday'],
  stock:['Stock alerts','Low and out of stock (barcode stores)'],
  brands:['Brands','Brand-wise sales (barcode stores)'],
  sizes:['Sizes','Sizes sold this month (barcode stores)'],
  returns:['Returns','Returns and exchanges this month'],
  cash:['Cash today','Drawer cash and expenses today']
};
function dashDefault(b){const k=`${b.kind||''} ${b.name||''}`.toLowerCase();
  if(/inner|night|lingerie|rosy|garment|cloth/.test(k))return ['today','staff','stock','sizes','brands','cats','returns','pay','trend'];
  if(/jewel|pinky|bangle|ring/.test(k))return ['today','staff','cats','price','items','pay','week','trend'];
  if(/watch|cmore|clock/.test(k))return ['today','staff','items','cats','price','pay','trend','week'];
  return ['today','staff','cats','items','pay','trend']}
const dashCards=b=>(Array.isArray(b.dash)&&b.dash.length?b.dash:dashDefault(b)).filter(k=>DCARDS[k]);
const storeTarget=b=>+b.target||(b.staff||[]).filter(s=>s.active!==false).reduce((a,s)=>a+(+s.target||0),0);
const dk=v=>v>=100000?'₹'+(+(v/100000).toFixed(1))+'L':v>=1000?'₹'+(+(v/1000).toFixed(1))+'k':'₹'+Math.round(v);

/* ---------- numbers for one store ---------- */
function storeNums(b){const t=todayStr();const mStart=t.slice(0,8)+'01';const d0=new Date();const lastM=ym(new Date(d0.getFullYear(),d0.getMonth()-1,1));const [lf]=monthRange(lastM);
  const td=todayOf(b.id);const today=agg(td.flatMap(billRecs));
  const mo=ST.month[b.id]||{sales:0,bills:0,profit:0};
  const docs=need(`d|${lf}|${addDays(t,-1)}`,()=>DB.daily(lf,addDays(t,-1)));
  const day=+t.slice(8);let lastSame=null,lastAll=null;
  if(docs){const mine=docs.filter(x=>x.biz===b.id);lastSame=mine.filter(x=>x.date.startsWith(lastM)&&+x.date.slice(8)<=day).reduce((a,x)=>a+(x.sales||0),0);lastAll=mine.filter(x=>x.date.startsWith(lastM)).reduce((a,x)=>a+(x.sales||0),0)}
  const [,mEnd]=monthRange(t.slice(0,7));const days=+mEnd.slice(8);const target=storeTarget(b);
  return {today,bills:td.length,avg:td.length?Math.round(today.sales/td.length):0,month:mo.sales||0,mBills:mo.bills||0,mProfit:mo.profit||0,lastSame,lastAll,
    change:lastSame?Math.round(((mo.sales||0)-lastSame)/lastSame*100):null,proj:day?Math.round((mo.sales||0)/day*days):0,target,tp:target?pct(mo.sales||0,target):0,
    need:target&&day<days?Math.max(0,Math.round((target-(mo.sales||0))/(days-day+1))):0}}
function spark(b){const t=todayStr();const docs=need(`d|${addDays(t,-13)}|${addDays(t,-1)}`,()=>DB.daily(addDays(t,-13),addDays(t,-1)));if(!docs)return '';
  const vals=[];for(let i=13;i>=1;i--){const d=addDays(t,-i);vals.push((docs.find(x=>x.biz===b.id&&x.date===d)||{}).sales||0)}vals.push(todaySales(b.id));
  const mx=Math.max(1,...vals);const W=120,H=34;const pts=vals.map((v,i)=>`${(i*(W/(vals.length-1))).toFixed(1)},${(H-2-(v/mx)*(H-6)).toFixed(1)}`).join(' ');
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true"><polyline points="${pts}" fill="none" stroke="currentColor" stroke-width="2" vector-effect="non-scaling-stroke" stroke-linejoin="round" stroke-linecap="round"/></svg>`}

function dashCard(k,b,recs,bl){const [title]=DCARDS[k];const box=(body,link)=>`<section class="card dcard"><div class="card-h"><h3>${title}</h3>${link||''}</div>${body}</section>`;
  const wait='<p class="hint">Loading…</p>';const rows=(list,fmt,max,col)=>{const mx=max||Math.max(1,...list.map(r=>r.v));return list.map(r=>`<div class="month-row"><span>${esc(r.l)}</span><div class="bar"><i style="width:${pct(r.v,mx)}%;background:${col||b.color}"></i></div><b>${fmt(r)}</b></div>`).join('')};
  switch(k){
    case 'today':return box(chart('today'));
    case 'trend':return box(chart('30d'));
    case 'staff':{const mo=ST.month[b.id]||{};const st=(b.staff||[]).filter(x=>x.active!==false).map(s=>({s,m:(mo.staff&&mo.staff[s.id])||{sales:0,bills:0}})).sort((x,y)=>y.m.sales-x.m.sales);
      return box(st.length?`<div class="rows">${st.map(({s,m},i)=>{const a=pct(m.sales,s.target||0);return `<div class="row" style="flex-wrap:wrap" ${isAdmin()?`data-act="openStaff" data-v="${s.id}"`:''}><div class="rank">${i+1}</div><div class="grow"><b>${esc(s.name)}</b><span>${m.bills||0} bills${s.target?` · target ${dk(s.target)}`:''}</span></div><div class="end"><b>${inr(m.sales)}</b><span>${s.target?a+'%':''}</span></div>${s.target?`<div class="bar ${a>=100?'good':''}" style="flex-basis:100%"><i style="width:${Math.min(a,100)}%;background:${a>=100?'':b.color}"></i></div>`:''}</div>`}).join('')}</div>`:'<p class="hint">No staff yet.</p>')}
    case 'cats':{if(!recs)return box(wait);const g=Object.entries(groupBy(recs,'cat')).map(([c,x])=>({l:c,v:agg(x).sales,q:agg(x).items})).sort((x,y)=>y.v-x.v).slice(0,8);return box(g.length?rows(g,r=>dk(r.v)):'<p class="hint">No sales yet this month.</p>')}
    case 'items':{if(!recs)return box(wait);const g=Object.values(groupBy(recs,r=>r.cat+'|'+r.item)).map(x=>({l:x[0].item,c:x[0].cat,o:agg(x)})).sort((x,y)=>y.o.sales-x.o.sales).slice(0,6);
      return box(g.length?`<div class="rows">${g.map((r,i)=>`<div class="row"><div class="rank">${i+1}</div><div class="grow"><b>${esc(r.l)}</b><span>${esc(r.c)}</span></div><div class="end"><b>${inr(r.o.sales)}</b><span>${r.o.items} sold</span></div></div>`).join('')}</div>`:'<p class="hint">No sales yet this month.</p>')}
    case 'price':{if(!recs)return box(wait);const g=Object.entries(groupBy(recs,r=>bandOf(r.price))).map(([i,x])=>({i:+i,v:x.reduce((a,r)=>a+r.qty,0)})).sort((x,y)=>x.i-y.i).map(r=>({l:BANDS[r.i+1]===Infinity?`${dk(BANDS[r.i])}+`:`${dk(BANDS[r.i])}–${dk(BANDS[r.i+1])}`,v:r.v}));
      const top=g.reduce((m,r)=>r.v>(m?m.v:-1)?r:m,null);return box(g.length?rows(g,r=>r.v+' pcs')+(top?`<p class="hint" style="margin-top:6px">Most pieces sell at <b>${esc(top.l)}</b></p>`:''):'<p class="hint">No sales yet this month.</p>')}
    case 'pay':{if(!bl)return box(wait);const p={Cash:0,UPI:0,Card:0,Due:0};bl.forEach(x=>{const m=billMoney(x);p.Cash+=m.Cash||0;p.UPI+=m.UPI||0;p.Card+=m.Card||0;p.Due+=x.due||0});const tot=Object.values(p).reduce((a,v)=>a+v,0);
      return box(tot?`<div class="paybar">${Object.entries(p).filter(([,v])=>v>0).map(([k2,v])=>`<i class="p-${k2}" style="flex:${v}"></i>`).join('')}</div><div class="paylegend">${Object.entries(p).map(([k2,v])=>`<span><i class="p-${k2}"></i>${k2} <b>${inr(v)}</b> ${pct(v,tot)}%</span>`).join('')}</div>`:'<p class="hint">No payments yet this month.</p>')}
    case 'week':{const t=todayStr();const docs=need(`d|${addDays(t,-56)}|${addDays(t,-1)}`,()=>DB.daily(addDays(t,-56),addDays(t,-1)));if(!docs)return box(wait);
      const s=[0,0,0,0,0,0,0],c=[0,0,0,0,0,0,0];docs.filter(x=>x.biz===b.id).forEach(x=>{const w=parseYmd(x.date).getDay();s[w]+=x.sales||0;c[w]++});const WD=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
      const g=[1,2,3,4,5,6,0].map(i=>({l:WD[i],v:c[i]?s[i]/c[i]:0}));return box(rows(g,r=>dk(r.v))+'<p class="hint" style="margin-top:6px">Last 8 weeks</p>')}
    case 'stock':{if(!skHas(b.id))return isAdmin()?box(`<p class="hint">No stock list for ${esc(b.name)} yet.</p><button class="secondary" data-go="stock" style="margin-top:8px">${ic('scan')} Import stock</button>`):'';
      const its=Object.entries(skItems(b.id)).map(([key,it])=>({key,it}));const s=skStats(its);const low=its.filter(x=>skLow(x.it)).sort((a,c)=>skQty(a.it)-skQty(c.it)).slice(0,5);
      return box(`<div class="kgrid"><div class="kpi"><span>Pieces</span><b>${s.pcs.toLocaleString('en-IN')}</b></div><div class="kpi"><span>At MRP</span><b>${dk(s.mrp)}</b></div><button class="kpi skk" data-act="dashStock" data-v="low"><span>Low</span><b style="color:var(--warn)">${s.low}</b></button><button class="kpi skk" data-act="dashStock" data-v="out"><span>Out</span><b style="color:var(--bad)">${s.out}</b></button></div>
        ${low.length?`<div class="sklist" style="margin-top:8px">${low.map(({key,it})=>`<button class="skrow" data-act="skOpen" data-k="${esc(key)}"><div><b>${esc(it.n)}</b><span>${esc(it.c||'')}</span></div><em></em><i class="low">${skQty(it)}</i></button>`).join('')}</div>`:''}`,`<button class="ghost-btn" data-go="stock">Open</button>`)}
    case 'brands':{if(!recs)return box(wait);const g=Object.entries(groupBy(recs.filter(r=>r.brand),'brand')).map(([c,x])=>({l:c,v:agg(x).sales})).sort((x,y)=>y.v-x.v).slice(0,8);if(!g.length&&!skHas(b.id))return '';return box(g.length?rows(g,r=>dk(r.v)):'<p class="hint">Brands appear once barcode items are sold.</p>')}
    case 'sizes':{if(!recs)return box(wait);const g=Object.entries(groupBy(recs.filter(r=>r.size),'size')).map(([c,x])=>({l:c,v:x.reduce((a,r)=>a+r.qty,0)})).sort((x,y)=>y.v-x.v).slice(0,10);if(!g.length&&!skHas(b.id))return '';return box(g.length?rows(g,r=>r.v+' pcs',0,'var(--good)'):'<p class="hint">Sizes appear once barcode items are sold.</p>')}
    case 'returns':{const all=skRetData(b.id);if(!all)return box(wait);const m=todayStr().slice(0,7);const rs=all.filter(r=>r.date.startsWith(m));const q=k2=>rs.filter(r=>r.kind===k2).reduce((a,r)=>a+r.qty,0);
      const reasons=Object.entries(groupBy(rs.filter(r=>r.kind!=='supplier'),'reason')).map(([c,x])=>({l:c||'—',v:x.reduce((a,r)=>a+r.qty,0)})).sort((x,y)=>y.v-x.v).slice(0,4);
      return box(`<div class="kgrid"><div class="kpi"><span>Returned</span><b>${q('refund')}</b></div><div class="kpi"><span>Exchanged</span><b>${q('exchange')}</b></div></div>${reasons.length?`<div style="margin-top:8px">${rows(reasons,r=>r.v)}</div>`:''}`,skHas(b.id)?`<button class="ghost-btn" data-go="skReturns">Report</button>`:'')}
    case 'cash':return typeof moneyCard==='function'?moneyCard(b):'';
  }return ''}

/* ============================================================
   v1.6 · Sales style per store
   stock  = barcode / stock billing only (Rosy): scan bar + stock search, tiles hidden
   quick  = quick items: category tiles → price → cost code word, no scan bar, no stock
   both   = both on the same screen

   ============================================================ */
const SM_LABEL={stock:['Stock · barcode','Scan or search stock. Stock goes down with every bill.'],quick:['Quick items','Tap category → item → price → code word. No stock.'],both:['Both','Scan stock items and tap quick items on the same bill.']};
const saleMode=b=>b&&SM_LABEL[b.saleMode]?b.saleMode:(b&&skHas(b.id)?'both':'quick');
S.smManual=false;

/* New sale screen per style */
const _saleSM=screens.sale;
screens.sale=function(){const b=B();const mode=saleMode(b);let h=_saleSM();
  if(mode==='stock'){
    const manual=S.smManual||(S.cart.some(l=>!l.sk)&&!!S.cart.length);
    h=h.replace('<div class="pad" style="padding-top:2px;gap:12px">',`<div class="pad ${manual?'':'sm-stock'}" style="padding-top:2px;gap:12px">`);
    const i=h.indexOf('id="saleSearch"');if(i>0){const j=h.lastIndexOf('<div class="search">',i);if(j>0)h=h.slice(0,j)+'<div class="search sale-find">'+h.slice(j+'<div class="search">'.length)}
    h=h.replace('Tap an item → type price and code → Add','Scan a barcode to start the bill');
    const k=h.indexOf('<div class="skbar" id="skBar">');const end=k>0?h.indexOf('</div></div>',h.indexOf('id="skSug"',k)):-1;

    if(k>0){const p=h.indexOf('<p class="hint">',k);const q=h.indexOf('</p>',p)+4;h=h.slice(0,q)+link+h.slice(q)}else h=h.replace('<div class="search sale-find">',link+'<div class="search sale-find">');
  }
  return h};
const _skBarSM=skBarHTML;
skBarHTML=function(){const b=B();if(saleMode(b)==='quick')return '<div id="skBar" hidden></div>';return _skBarSM()};
const _skScanSM=skScan;
skScan=function(code){const b=B();if(saleMode(b)==='quick')return false;return _skScanSM(code)};

/* counter home + dashboard follow the style */
const _counterHomeSM=counterHome;
counterHome=function(){let h=_counterHomeSM();const b=B();if(saleMode(b)==='quick'){const a=h.indexOf('<button class="list-btn" data-go="stock">');if(a>=0){const z=h.indexOf('</button>',a)+9;h=h.slice(0,a)+h.slice(z)}}

const _dashCardSM=dashCard;
dashCard=function(k,b,recs,bl){if(saleMode(b)==='quick'&&['stock','brands','sizes','returns'].includes(k)&&!skHas(b.id))return '';return _dashCardSM(k,b,recs,bl)};

/* Businesses screen: choose the style for each store */
const _bizScr=screens.businesses;
screens.businesses=function(){let h=_bizScr();
  activeBiz().forEach(b=>{const tag=`data-act="editBiz" data-v="${b.id}"`;const a=h.indexOf(tag);if(a<0)return;const g=h.indexOf('<div class="sm-grid">',a);if(g<0)return;const m=saleMode(b);

},true);

/* ============================================================
   v1.7 · Stock in (scan a delivery), remove stock / delete items,
   end-of-day report of stock sold with bills
   Collection "skmv": one record per item per movement
   kind: in (stock in) · out (pieces removed) · del (item deleted from list)
   ============================================================ */
const OUT_REASONS=['Damaged','Lost / missing','Wrong entry','Own use','Gift / sample','Other'];
function skMvData(biz){return need('skmv|'+biz,()=>DB.A.query('skmv',[['biz','==',biz]]))}
function skMvSave(recs){recs.forEach(r=>DB.A.set('skmv',r.id,r,false));delete CACHE['skmv|'+(recs[0]||{}).biz]}
const mvRec=(b,kind,key,it,qty,extra)=>({id:'mv_'+uid(),biz:b.id,at:Date.now(),date:todayStr(),kind,sk:key,name:it.n,cat:it.c||'',bc:it.bc||'',dno:it.dn||'',brand:it.br||'',party:it.pt||'',qty,value:qty*(+it.co||0),mrp:+it.m||0,by:isAdmin()?'Owner':(DEVICE.name||'counter'),...extra});

/* ---------- shared scan list used by Stock in and Remove stock ---------- */
function scanListHTML(f,mode){const b=B();const keys=Object.keys(f.lines);const hits=f.q&&f.q.length>=2&&!f.miss?skSearch(b.id,f.q,6):[];
  return `<div class="search"><div class="inp">${ic('scan')}<input id="${mode}Q" value="${esc(f.q)}" placeholder="Scan barcode · or type D.no, name" autocomplete="off" autocapitalize="characters" spellcheck="false" enterkeyhint="go"></div><button class="scan-btn" data-act="${mode}Cam" aria-label="Scan with camera">${ic('camera')}</button></div>
    ${f.miss?`<div class="warnline">"${esc(f.miss)}" is not in the stock list.${mode==='sin'&&isAdmin()?` <button class="linkbtn" data-act="sinNew">Add it as a new item</button>`:''}</div>`:''}
    ${hits.length?`<div class="sksug">${hits.map(({key,it})=>`<button data-act="${mode}Add" data-k="${esc(key)}"><b>${esc(it.n)}</b><span>${esc([it.c,it.br,it.dn?'D.no '+it.dn:''].filter(Boolean).join(' · '))}</span><em></em><i class="${skQty(it)<=0?'out':skLow(it)?'low':''}">${skQty(it)}</i></button>`).join('')}</div>`:''}
    <div class="sklist">${keys.map(k=>{const it=skItems(b.id)[k];if(!it)return '';const q=f.lines[k];const now=skQty(it);
      return `<div class="skrow"><div><b>${esc(it.n)}</b><span>${esc([it.dn?'D.no '+it.dn:'',it.br].filter(Boolean).join(' · '))} · now ${now}${mode==='sin'?` → ${now+q}`:f.kind==='pcs'?` → ${now-q}`:''}</span></div>${f.kind==='item'?`<button class="x" data-act="${mode}Rm" data-k="${esc(k)}" aria-label="Remove from list">×</button>`:`<div class="stepper sm"><button data-act="${mode}Q" data-k="${esc(k)}" data-d="-1" aria-label="Less">−</button><span>${q}</span><button data-act="${mode}Q" data-k="${esc(k)}" data-d="1" aria-label="More">+</button></div>`}</div>`}).join('')||`<p class="hint">${mode==='sin'?'Scan each piece as it comes out of the parcel. Scanning the same tag again adds 1 more.':'Scan or search the items to take out.'}</p>`}</div>`}
function scanAdd(f,key){f.lines[key]=(f.lines[key]||0)+1;f.q='';f.miss=''}
function scanCode(f,code){const b=B();const hit=skFind(b.id,code)||(skSearch(b.id,code,2).length===1?skSearch(b.id,code,1)[0]:null);if(hit){scanAdd(f,hit.key);if(navigator.vibrate)navigator.vibrate(25);return true}f.miss=String(code).trim();f.q='';if(navigator.vibrate)navigator.vibrate([80,40,80]);return false}

/* ---------- Stock in ---------- */
function sinSheet(){const f=S.skIn||(S.skIn={lines:{},party:'',billNo:'',note:'',q:'',miss:'',labels:false});const b=B();const keys=Object.keys(f.lines);const pcs=keys.reduce((a,k)=>a+f.lines[k],0);
  const parties=[...new Set(keys.map(k=>(skItems(b.id)[k]||{}).pt).filter(Boolean))];const cost=keys.reduce((a,k)=>a+f.lines[k]*(+(skItems(b.id)[k]||{}).co||0),0);

  <div class="sheet" role="dialog" aria-label="Stock in"><div class="grab"></div><div class="sh-body"><h3>Stock in · ${esc(b.name)}</h3>
    ${scanListHTML(f,'sin')}
    <div class="two"><div class="f"><label for="sinParty">Party / supplier</label><input id="sinParty" value="${esc(f.party||parties[0]||'')}" placeholder="e.g. 47"></div><div class="f"><label for="sinBill">Party bill no.</label><input id="sinBill" value="${esc(f.billNo)}" placeholder="Optional"></div></div>
    <div class="f"><label for="sinNote">Note</label><input id="sinNote" value="${esc(f.note)}" placeholder="Transport, LR no.…"></div>
    ${isAdmin()?`<label class="remember"><input type="checkbox" id="sinLabels" ${f.labels?'checked':''}> Also add barcode labels for these pieces</label>`:''}
    <button class="primary" data-act="sinSave" ${pcs?'':'disabled'}>SAVE STOCK IN · ${pcs} PCS${isAdmin()&&cost?' · cost '+inr(cost):''}</button>
  </div></div>`}
function sinSave(){const b=B();const f=S.skIn;if(!f)return;const keys=Object.keys(f.lines).filter(k=>f.lines[k]>0);if(!keys.length)return;const grp='in_'+uid();const d={};const recs=[];
  keys.forEach(k=>{const it=skItems(b.id)[k];if(!it)return;d[k]=f.lines[k];recs.push(mvRec(b,'in',k,it,f.lines[k],{group:grp,party:f.party||it.pt||'',billNo:f.billNo||'',note:f.note||''}));if(f.labels)SK.labelQ[k]=(SK.labelQ[k]||0)+f.lines[k]});
  skMove(b.id,d,'stock in'+(f.billNo?' · bill '+f.billNo:''));skMvSave(recs);const pcs=recs.reduce((a,r)=>a+r.qty,0);const lab=f.labels;
  S.skIn=null;S.overlay=lab&&skLabelTotal()?'skLabels':null;render();toast(`Stock in saved · ${pcs} pcs in ${recs.length} item${recs.length===1?'':'s'}`)}

/* ---------- Remove stock / delete items ---------- */
function soutSheet(){const f=S.skOut||(S.skOut={lines:{},kind:'pcs',reason:'',note:'',q:'',miss:'',sure:false});const b=B();const keys=Object.keys(f.lines);const pcs=keys.reduce((a,k)=>a+f.lines[k],0);
  return `<button class="overlay-bg" data-act="skClose" aria-label="Close"></button>
  <div class="sheet" role="dialog" aria-label="Remove stock"><div class="grab"></div><div class="sh-body"><h3>Remove stock · ${esc(b.name)}</h3>
    <div class="chips"><button class="chip ${f.kind==='pcs'?'on':''}" data-act="soutKind" data-v="pcs">Take out pieces</button><button class="chip ${f.kind==='item'?'on':''}" data-act="soutKind" data-v="item">Delete items from list</button></div>
    <p class="hint">${f.kind==='pcs'?'Stock goes down by the pieces you set. The items stay in the list.':'The items disappear from the stock list and can no longer be scanned. Their past bills stay as they are.'}</p>
    ${scanListHTML(f,'sout')}
    <div class="f"><span class="lab">Reason</span><div class="chips">${OUT_REASONS.map(r=>`<button class="chip ${f.reason===r?'on':''}" data-act="soutReason" data-v="${esc(r)}">${esc(r)}</button>`).join('')}</div></div>
    <div class="f"><label for="soutNote">Note</label><input id="soutNote" value="${esc(f.note)}" placeholder="Optional"></div>
    ${f.kind==='item'&&keys.length?`<button class="danger" data-act="soutSave">${f.sure?`TAP AGAIN TO DELETE ${keys.length} ITEM${keys.length===1?'':'S'}`:`DELETE ${keys.length} ITEM${keys.length===1?'':'S'} FROM STOCK LIST`}</button>`
      :`<button class="primary" data-act="soutSave" ${pcs&&f.reason?'':'disabled'}>${f.reason?`REMOVE ${pcs} PCS`:'CHOOSE A REASON'}</button>`}
  </div></div>`}
function soutSave(){const b=B();const f=S.skOut;if(!f)return;const keys=Object.keys(f.lines).filter(k=>f.lines[k]>0);if(!keys.length)return;
  if(f.kind==='item'&&!f.sure){f.sure=true;render();return}
  const grp='out_'+uid();const recs=[];
  if(f.kind==='pcs'){if(!f.reason){toast('Choose a reason');return}const d={};
    for(const k of keys){const it=skItems(b.id)[k];if(!it)continue;d[k]=-f.lines[k];recs.push(mvRec(b,'out',k,it,f.lines[k],{group:grp,reason:f.reason,note:f.note||''}))}
    skMove(b.id,d,'removed · '+f.reason)}
  else{const m={};for(const k of keys){const it=skItems(b.id)[k];if(!it)continue;recs.push(mvRec(b,'del',k,it,skQty(it),{group:grp,reason:f.reason||'Deleted',note:f.note||''}));m[k]={del:true,q:0};delete ST.stock[b.id][k]}
    skWrite(b.id,m);skReindex(b.id);DB.A.set('stocklog','sl_'+uid(),{biz:b.id,at:Date.now(),date:todayStr(),by:'Owner',why:'deleted items',n:recs.length},false)}
  skMvSave(recs);S.skOut=null;S.overlay=null;render();
  toast(f.kind==='pcs'?`${recs.reduce((a,r)=>a+r.qty,0)} pcs removed · ${f.reason}`:`${recs.length} item${recs.length===1?'':'s'} deleted from the stock list`)}

/* ---------- End-of-day report: stock sold with bills ---------- */
screens.skEod=function(){const b=B();const d=S.eodDate||todayStr();S.eodDate=d;const tab=S.eodTab||'items';
  const bl=bizBills(billsBetween(d,d),b.id);const mv=skMvData(b.id);const rt=skRetData(b.id);
  const nav=`<div class="datenav"><button class="icon-btn" data-act="eodDay" data-d="-1" aria-label="Previous day">${ic('back')}</button><b>${d===todayStr()?'Today · ':''}${parseYmd(d).toLocaleDateString('en-IN',{weekday:'short',day:'numeric',month:'short',year:'numeric'})}</b><button class="icon-btn" data-act="eodDay" data-d="1" aria-label="Next day" ${d>=todayStr()?'disabled':''}>${ic('chev')}</button></div>`;
  const tb=topbar('End of day · stock','stock',bizPill());if(!bl||!mv||!rt)return `${tb}<div class="pad" style="padding-top:4px">${nav}${loading()}</div>`;
  const E=eodData(b,d,bl,mv,rt);
  return `${tb}<div class="pad" style="padding-top:4px;gap:12px">${nav}
    <div class="kgrid">

function eodData(b,d,bl,mv,rt){const bills=bl.filter(x=>!x.deleted).sort((p,q)=>p.at-q.at);const map={};let value=0;
  bills.forEach(x=>{const act=(x.lines||[]).filter(l=>!l.returned);const all=act.reduce((a,l)=>a+lineAmt(l),0)||1;const disc=billTot(x).disc;
    act.filter(l=>l.sk).forEach(l=>{const v=lineAmt(l)-Math.round(disc*lineAmt(l)/all);value+=v;const r=map[l.sk]||(map[l.sk]={sk:l.sk,name:l.name,cat:l.cat,dno:l.dno||'',brand:l.brand||'',qty:0,value:0,bills:[]});r.qty+=l.qty;r.value+=v;
      const e=r.bills.find(y=>y.id===x.id);if(e)e.qty+=l.qty;else r.bills.push({id:x.id,no:x.no,qty:l.qty,at:x.at})})});
  const items=Object.values(map).map(r=>{const it=skItems(b.id)[r.sk];return {...r,left:it?skQty(it):null}}).sort((p,q)=>q.qty-p.qty||String(p.name).localeCompare(q.name));
  const ins=mv.filter(r=>r.date===d&&r.kind==='in'),outs=mv.filter(r=>r.date===d&&r.kind!=='in'),rets=rt.filter(r=>r.date===d);
  const sum=a=>a.reduce((s,r)=>s+r.qty,0);
  return {bills,items,value,pcs:sum(items),ins,outs,rets,inPcs:sum(ins),outPcs:sum(outs.filter(r=>r.kind==='out')),retPcs:sum(rets.filter(r=>r.kind!=='supplier'))}}
function eodText(b,d,E){const L=[`*${b.name} · stock sold · ${parseYmd(d).toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'})}*`,`${E.pcs} pcs · ${inr(E.value)} · ${E.bills.length} bills`,''];
  E.items.forEach(r=>L.push(`${r.qty} × ${r.name}${r.dno?' (D.'+r.dno+')':''} · ${inr(r.value)} · bill ${r.bills.map(x=>x.no.split('/').pop().replace(/^0+/,'')+' '+timeLabel(x.at)).join(', ')}`));
  if(E.inPcs)L.push('',`Stock in: +${E.inPcs} pcs`);if(E.outPcs)L.push(`Removed: −${E.outPcs} pcs`);if(E.retPcs)L.push(`Returned / exchanged: ${E.retPcs} pcs`);return L.join('\n')}

  const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(E.items.map(r=>({Item:r.name,Category:r.cat,'D.no':r.dno,Brand:r.brand,Qty:r.qty,Value:r.value,'Stock left':r.left??'',Bills:r.bills.map(x=>x.no+(x.qty>1?' ×'+x.qty:'')+' ('+timeLabel(x.at)+')').join(', ')}))),'Item-wise');
  const rows=[];E.bills.forEach(x=>(x.lines||[]).filter(l=>!l.returned).forEach(l=>rows.push({'Bill no':x.no,Time:timeLabel(x.at),'Sold by':x.staff,Item:l.name,Barcode:l.bc||'','D.no':l.dno||'',Qty:l.qty,Price:l.price,Amount:l.qty*l.price,'Bill total':billTot(x).final,Paid:x.payText||''})));

function bkApply(){const b=B();const keys=Object.keys(SK.sel||{}).filter(k=>skItems(b.id)[k]);if(!keys.length)return;const f=S.bkForm||{qmode:'none'};

function skDupGroups(biz){const all=Object.entries(skItems(biz));const by={};const add=(t,v,k)=>{if(!v)return;const id=t+'|'+v;(by[id]=by[id]||{t,v,keys:new Set()}).keys.add(k)};
  all.forEach(([k,it])=>{add('name',normName(it.n),k);add('dno',String(it.dn||'').trim(),k);add('bc',String(it.bc||'').trim().replace(/^0+/,''),k)});
  const groups=Object.values(by).filter(g=>g.keys.size>1).map(g=>({...g,keys:[...g.keys]}));
  // one group per set of items (the same pair can match on name and D.no)
  const seen=new Set();return groups.filter(g=>{const id=g.keys.slice().sort().join(',');if(seen.has(id))return false;seen.add(id);return true}).sort((a,c)=>c.keys.length-a.keys.length)}

    ${gs.length?gs.map((g,gi)=>{const its=g.keys.map(k=>({k,it:skItems(b.id)[k]})).filter(x=>x.it);const pcs=its.reduce((a,x)=>a+skQty(x.it),0);
      return `<section class="card dupg"><div class="card-h"><h3>${L[g.t]}</h3><span class="hint">${its.length} items · ${pcs} pcs</span></div>

function dupMerge(gi,keepKey){const b=B();const g=skDupGroups(b.id)[gi];if(!g)return;const keep=skItems(b.id)[keepKey];if(!keep)return;

  switch(a.dataset.act){
    case 'bkStart':SK.sel={};render();return;
    case 'bkDone':SK.sel=null;render();return;
    case 'bkNone':SK.sel={};render();return;
    case 'bkAll':{SK.sel=SK.sel||{};skFiltered().forEach(({key})=>SK.sel[key]=true);render();return}
    case 'bkTog':{if(!SK.sel)return;if(SK.sel[k])delete SK.sel[k];else SK.sel[k]=true;render();return}
    case 'bkEdit':S.bkForm={qmode:'none'};S.overlay='bkEdit';render();return;
    case 'bkQm':{const keepV={};['bkM','bkSp','bkCo','bkLo','bkC','bkBr','bkCd'].forEach(id=>{const el=$(id);if(el)keepV[id]=el.value});S.bkForm.qmode=v;render();Object.entries(keepV).forEach(([id,val])=>{const el=$(id);if(el)el.value=val});const q=$('bkQ');if(q)q.focus();return}
    case 'bkDel':S.bkSure=false;S.bkReason='';S.overlay='bkDel';render();return;
    case 'bkReason':S.bkReason=S.bkReason===v?'':v;render();return;
    case 'bkDelGo':{if(!S.bkSure){S.bkSure=true;render();return}const n=bkDelete(Object.keys(SK.sel||{}),S.bkReason||'Deleted');S.bkSure=false;S.overlay=null;SK.sel=null;render();toast(`${n} item${n===1?'':'s'} deleted from the stock list`);return}
    case 'dupKeep':dupMerge(+a.dataset.g,k);return;
    case 'dupDel':{if(S.dupSure!==k){S.dupSure=k;render();return}S.dupSure=null;const it=skItems(b.id)[k];const n=bkDelete([k],'Duplicate');render();if(n)toast(`${it.n} deleted`);return}
    case 'skCopy':{const it=skItems(b.id)[SK.view];if(!it)return;S.skForm={n:it.n,c:it.c,cd:it.cd,m:+it.m||'',co:+it.co||'',q:'1',bc:'',dn:''};S.overlay='skNew';render();setTimeout(()=>{const n=$('nfName');if(n){n.focus();n.select()}},60);return}
  }});

function a5Words(n){n=Math.round(+n||0);if(!n)return 'Zero Rupees';
  const a=['','One','Two','Three','Four','Five','Six','Seven','Eight','Nine','Ten','Eleven','Twelve','Thirteen','Fourteen','Fifteen','Sixteen','Seventeen','Eighteen','Nineteen'],t=['','','Twenty','Thirty','Forty','Fifty','Sixty','Seventy','Eighty','Ninety'];
  const two=x=>x<20?a[x]:t[Math.floor(x/10)]+(x%10?' '+a[x%10]:''),three=x=>(x>=100?a[Math.floor(x/100)]+' Hundred'+(x%100?' ':''):'')+(x%100?two(x%100):'');
  const out=[];const cr=Math.floor(n/1e7);n%=1e7;const lk=Math.floor(n/1e5);n%=1e5;const th=Math.floor(n/1e3);n%=1e3;
  if(cr)out.push(three(cr)+' Crore');if(lk)out.push(two(lk)+' Lakh');if(th)out.push(two(th)+' Thousand');if(n)out.push(three(n));return out.join(' ')+' Rupees'}
function a5Dt(ts){const d=new Date(ts);const p=v=>String(v).padStart(2,'0');let h=d.getHours();const ap=h>=12?'PM':'AM';h=h%12||12;return `${p(d.getDate())}/${p(d.getMonth()+1)}/${d.getFullYear()} ${h}:${p(d.getMinutes())} ${ap}`}
function a5D(ts){const d=new Date(ts);const p=v=>String(v).padStart(2,'0');return `${p(d.getDate())}/${p(d.getMonth()+1)}/${d.getFullYear()}`}

  const txns={};(m.list||[]).filter(e=>['expense','salary','purchase'].includes(e.kind)).forEach(e=>{txns['rr_'+e.id]={type:e.kind==='purchase'?'party':e.kind,date:e.date||d,amount:+e.amount||0,name:e.kind==='salary'?(e.staffName||'Staff'):(e.cat||KINDS[e.kind].l),mode:glMode(e.mode),note:(e.note||'')+' · Rosy Retail',src:'rosy-retail',deleted:false,at:Date.now()}});

  await DB.A.set('dayclose',`${b.id}_${d}`,{galla:{at:Date.now(),shop:g.shop,total:sale.total,cash:sale.cash}},true);
  const c=CACHE[`dc|${b.id}`];if(c&&c.data){const x=c.data.find(y=>y.id===`${b.id}_${d}`);if(x)x.galla={at:Date.now(),shop:g.shop,total:sale.total,cash:sale.cash}}
  return {ok:true,sale}}
/* after Close day: post to Galla automatically when the shop is linked */
window.addEventListener('submit',e=>{if(e.target.id!=='mCloseForm')return;const b=B();const d=S.mDate||todayStr();if(!(b.galla&&b.galla.shop&&b.galla.auto!==false))return;

function glCard(){if(!isAdmin())return '';const b=B();const g=b.galla||{};const shops=glLoad();
  return `<div class="card gl-card" id="glCard"><div class="card-h"><h3>${ic('book')} Galla Cash Book · ${esc(b.name)}</h3>${g.shop?'<span class="pill-state">Linked</span>':''}</div>

const _glSet=screens.settings;screens.settings=function(){const h=_glSet();const k='<div class="card"><div class="card-h"><h3>Shop details';const i=h.indexOf(k);return i<0?h+glCard():h.slice(0,i)+glCard()+h.slice(i)};
document.addEventListener('click',e=>{const a=e.target.closest('[data-act="glShop"],[data-act="glAuto"],[data-act="glSend"]');if(!a)return;const b=B();
  if(a.dataset.act==='glShop'){e.stopImmediatePropagation();b.galla={...(b.galla||{}),shop:a.dataset.v,auto:(b.galla||{}).auto!==false};DB.saveBiz(b);render();toast(a.dataset.v?`${b.name} linked to Galla`:'Galla link removed');return}
