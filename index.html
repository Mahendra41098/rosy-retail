  if(a.dataset.act==='glSend'){e.stopImmediatePropagation();const d=S.mDate||todayStr();a.disabled=true;glPost(b,d).then(r=>{toast(r.ok?`Sent to Galla · ${dayLabel(d)} · sales ${inr(r.sale.total)}`:'Galla: '+r.why);render()}).catch(()=>{toast('Could not send to Galla');a.disabled=false})}},true);
/* cash book: Galla status line (owner) */
const _glMoney=screens.money;screens.money=function(){if(!isAdmin())S.mDate=todayStr();let h=_glMoney();const b=B();const d=S.mDate||todayStr();const m=moneyDay(b.id,d);
  if(isAdmin()&&b.galla&&b.galla.shop&&m){const g=m.close&&m.close.galla;const line=`<div class="gl-line">${ic('book')}<span>${g?`Sent to Galla ${timeLabel(g.at)} · sales ${inr(g.total)} · cash ${inr(g.cash)}`:m.close?'Day closed · not yet in Galla':'Sent to Galla when the day is closed'}</span>${m.close?`<button class="linkbtn" data-act="glSend">${g?'Send again':'Send now'}</button>`:''}</div>`;
    const k='<section class="drawer">';h=h.includes(k)?h.replace(k,line+k):h}
  return h};
/* staff see today only */
const _glNav=dateNav;dateNav=function(){if(isAdmin())return _glNav();return `<div class="datenav"><b>Today · ${dayLabel(todayStr())}</b></div>`};
/* ---------- new day: confirm the opening count ---------- */
function opState(b){const d=todayStr();const doc=cnDoc(b.id,d);const op=cnOpening(b.id,d);if(doc===null||!op)return null;return {doc,op,confirmed:!!(doc&&doc.confirm)}}
function opCard(b){const s=opState(b);if(!s||s.confirmed||!nsum(s.op.notes))return '';const n=s.op.notes;
  return `<section class="card op-card" id="opCard"><div class="card-h"><h3>${ic('cash')} Good morning · opening cash</h3></div>
    <p class="op-amt">${inr(nsum(n))}</p><p class="hint" style="margin:0">From ${esc(s.op.src)}. Count the box and confirm.</p>
    <div class="op-notes">${DEN.filter(d=>n[d]).map(d=>`<span><b>${n[d]}</b> × ₹${d}</span>`).join('')}</div>
    <div class="btn-row"><button class="secondary" data-act="opWrong">Doesn't match</button><button class="primary" data-act="opOk">✓ Count matches</button></div></section>`}
const _opCounter=counterHome;counterHome=function(){const h=_opCounter();const c=opCard(B());if(!c)return h;const k='<button class="primary big-sale"';const i=h.indexOf(k);return i<0?c+h:h.slice(0,i)+c+h.slice(i)};
const _opMoney=screens.money;screens.money=function(){const h=_opMoney();const c=(S.mDate||todayStr())===todayStr()?opCard(B()):'';if(!c)return h;const k='<section class="drawer">';return h.includes(k)?h.replace(k,c+k):h};
const _opDash=screens.dash;screens.dash=function(){const h=_opDash();const c=opCard(B());if(!c)return h;const k='<div class="qa">';return h.includes(k)?h.replace(k,c+k):h};
document.addEventListener('click',e=>{const a=e.target.closest('[data-act="opOk"],[data-act="opWrong"]');if(!a)return;e.stopImmediatePropagation();const b=B();const d=todayStr();
  if(a.dataset.act==='opOk'){const s=opState(b);const confirm={at:Date.now(),by:isAdmin()?'Owner':(DEVICE.name||'counter'),amount:s?nsum(s.op.notes):0};
    DB.A.set('cashnotes',`${b.id}_${d}`,{biz:b.id,date:d,confirm},true);const k=`cn|${b.id}|${d}`;CACHE[k]={data:{...((CACHE[k]||{}).data||{}),confirm}};render();toast('Opening cash confirmed');return}
  S.cnEdit=null;S.cnOpenOk=false;S.overlay='cnOpen';render()},true);
/* changing the opening (with the owner password) also confirms it */
document.addEventListener('click',e=>{const a=e.target.closest('[data-act="cnOpenSave"]');if(!a)return;const b=B();const d=S.mDate||todayStr();if(d!==todayStr())return;
  setTimeout(()=>{const confirm={at:Date.now(),by:(isAdmin()?'Owner':(DEVICE.name||'counter'))+' (changed)',amount:nsum(nz(S.cnEdit||{}))};DB.A.set('cashnotes',`${b.id}_${d}`,{confirm},true);const k=`cn|${b.id}|${d}`;if(CACHE[k]&&CACHE[k].data)CACHE[k].data.confirm=confirm;render()},50)},true);
/* owner home: one line per shop with the last close and Galla */
const _glHome=adminHome;adminHome=function(){const h=_glHome();const rows=activeBiz().map(b=>{const cl=closesFor(b.id);if(!cl)return '';const last=cl.slice().sort((p,q)=>q.date>p.date?1:-1)[0];if(!last)return '';
    return `<div class="gl-row"><span class="dot" style="background:${b.color}">${esc(b.short)}</span><span class="grow"><b>${esc(b.name)}</b><small>Closed ${dayLabel(last.date)} · counted ${inr(last.counted)}${last.galla?` · in Galla ${inr(last.galla.cash)} cash`:b.galla&&b.galla.shop?' · not in Galla yet':''}</small></span></div>`}).join('');
  if(!rows)return h;const card=`<section class="card gl-home"><div class="card-h"><h3>${ic('book')} Day close · all shops</h3></div>${rows}</section>`;const k='<h3 class="sec">Quick actions</h3>';return h.includes(k)?h.replace(k,card+k):h+card};
/* cash book opening: when there is no earlier close, use the opening notes (confirmed count, or the standard cash box) */
/* cash book opening = the notes kept in the box (opening notes / last close's kept notes / standard cash box). Yesterday's full balance is not carried: it went to Galla / the owner */
const _opMD=moneyDay;moneyDay=function(bizId,date){const o=_opMD(bizId,date);if(!o)return o;const op=cnOpening(bizId,date);if(op===null)return null;
  const v=nsum(op.notes||{});const delta=v-(o.opening||0);o.opening=v;o.expected+=delta;o.openSrc=v?op.src:'not counted yet';o.prevClose=o.openFrom;o.openFrom=null;return o};
const _opMoney2=screens.money;screens.money=function(){let h=_opMoney2();const b=B();const m=moneyDay(b.id,S.mDate||todayStr());if(m)h=h.replace('<small>no earlier day close</small>',`<small>${esc(m.openSrc||'')}${isAdmin()&&m.prevClose?` · yesterday's full count is in Galla / with owner`:''}</small>`);return h};
