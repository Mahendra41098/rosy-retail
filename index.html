  ST.today=ST.today.filter(x=>x.id!==bill.id);for(const k in CACHE){const c=CACHE[k];if(c.data&&Array.isArray(c.data))c.data=c.data.filter(x=>x.id!==bill.id)}}
async function startFresh(){const cols=['bills','photos','daily','monthly','counters','customers','returns','cash','dayclose','attendance'];let n=0,tot=0;
  const lists=await Promise.all(cols.map(c=>DB.all(c)));lists.forEach(l=>tot+=l.length);toast(`Deleting ${tot} records…`);
  for(let i=0;i<cols.length;i++){for(const d of lists[i]){DB.A.del(cols[i],d.id);n++;if(n%100===0){toast(`Deleted ${n} of ${tot}…`);await new Promise(r=>setTimeout(r,30))}}}
  ST.today=[];ST.month={};ST.counters={};for(const k in CACHE)delete CACHE[k];S.freshAsk=false;S.openBill=null;S.lastBill=null;render();toast(`Done. ${tot} records deleted. Every shop starts fresh.`)}

function doPrint(bill,paper){const bz=ST.biz.find(y=>y.id===bill.biz)||B();const pa=$('printArea');pa.innerHTML=receiptHTML(bill,bz,paper);

function shrink(file,cb){const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,640/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);let q=.7,u=c.toDataURL('image/jpeg',q);while(u.length>140000&&q>.3){q-=.1;u=c.toDataURL('image/jpeg',q)}cb(u)};im.onerror=()=>toast('Could not read that photo');im.src=r.result};r.readAsDataURL(file)}

/* ---------- maths ---------- */
// what the customer paid on a bill, by method (snapshot saved with the bill; older bills are worked out)
function paidOf(t){const p=S.pay;const o={Cash:0,UPI:0,Card:0,refund:t.refund||0};if(!t.pay)return o;
  if(p.mode==='split'){['Cash','UPI','Card'].forEach(k=>o[k]=+p.split[k]||0)}else if(p.mode==='partial'){o[p.method]=+p.recv||0}else o[p.method]=t.pay;return o}
function billMoney(b){if(b.paid)return b.paid;const t=billTot(b);const cr=b.credit?b.credit.amount:0;const pay=Math.max(0,t.final-cr);const p=b.pay||{mode:'single',method:'Cash'};const o={Cash:0,UPI:0,Card:0,refund:Math.max(0,cr-t.final)};
  if(p.mode==='split')['Cash','UPI','Card'].forEach(k=>o[k]=+(p.split&&p.split[k])||0);else if(p.mode==='partial')o[p.method||'Cash']=+p.recv||0;else o[p.method||'Cash']=pay;return o}
const entries=(list,bizId)=>list.filter(e=>e.biz===bizId&&!e.deleted);
function cashFor(date){return date===todayStr()?ST.cash:need(`c|${date}`,()=>DB.A.query('cash',[['date','==',date]]))}
function returnsFor(date){return date===todayStr()?ST.retToday:need(`r|${date}`,()=>DB.A.query('returns',[['date','==',date]]))}
function closesFor(bizId){return need(`dc|${bizId}`,()=>DB.A.query('dayclose',[['biz','==',bizId]]))}
function moneyDay(bizId,date){
  const bills=date===todayStr()?todayOf(bizId):bizBills(billsBetween(date,date),bizId);const cash=cashFor(date);const rets=returnsFor(date);const closes=closesFor(bizId);
  if(!bills||!cash||!rets||!closes)return null;
  const o={sales:0,Cash:0,UPI:0,Card:0,refunds:0,dueGiven:0,bills:bills.length};
  bills.forEach(b=>{const m=billMoney(b);o.sales+=billTot(b).final;o.Cash+=m.Cash;o.UPI+=m.UPI;o.Card+=m.Card;o.refunds+=m.refund||0;o.dueGiven+=b.due||0});
  entries(rets,bizId).filter(r=>r.kind==='refund').forEach(r=>o.refunds+=r.amount||0);
  const es=entries(cash,bizId).sort((a,c)=>a.at-c.at);const sum=(k,mode)=>es.filter(e=>e.kind===k&&(!mode||e.mode===mode)).reduce((a,e)=>a+(+e.amount||0),0);
  o.list=es;o.dueIn=sum('due_in','Cash');o.cashIn=sum('cash_in','Cash');o.exp=sum('expense','Cash');o.sal=sum('salary','Cash');o.pur=sum('purchase','Cash');o.cashOut=sum('cash_out','Cash');
  o.expAll=sum('expense');o.salAll=sum('salary');o.purAll=sum('purchase');o.dueInAll=sum('due_in');
  const prev=closes.filter(c=>c.date<date).sort((a,c)=>c.date>a.date?1:-1)[0];o.opening=prev?+prev.counted||0:0;o.openFrom=prev?prev.date:null;
  o.expected=o.opening+o.Cash+o.dueIn+o.cashIn-o.exp-o.sal-o.pur-o.cashOut-o.refunds;
  o.close=closes.find(c=>c.date===date)||null;return o}
function newEntry(kind,extra){const b=B();const date=extra.date||todayStr();return {id:'e_'+uid(),biz:b.id,kind,date,month:date.slice(0,7),fy:fyOf(date).k,bd:`${b.id}|${date}`,at:date===todayStr()?Date.now():parseYmd(date).getTime()+12*3600e3,by:isAdmin()?'Owner':(DEVICE.name||b.name+' counter'),device:DEVICE.id,...extra}}
function saveEntry(e){DB.A.set('cash',e.id,e,false);if(e.date===todayStr()){const i=ST.cash.findIndex(x=>x.id===e.id);if(i>=0)ST.cash[i]=e;else ST.cash.push(e)}dropCache('c|');dropCache('cm|')}

attendance(){
  const b=B();const d=S.mDate||todayStr();const m=d.slice(0,7);const id=`${b.id}_${m}`;const att=need(`at|${id}`,()=>DB.A.get('attendance',id).then(x=>x||{d:{}}));

  if(!list)return head+loading()+'</div>';const tot=list.reduce((a,c)=>a+(+c.due||0),0);
  return `${head}<div class="card-h" style="margin:0"><h3 style="margin:0;font-size:15px">${list.length} customers owe</h3><b class="tnum">${inr(tot)}</b></div>

      <div class="btn-row"><button class="secondary" data-act="m_remind" data-v="${c.mobile}">${ic('share')} Remind</button><button class="primary" data-act="m_recvDue" data-v="${c.mobile}">Received</button></div></div>`).join('')||'<div class="empty">No customer owes anything.</div>'}
    <p class="hint">A payment received here is added to the cash book of the shop selected at the top (${esc(B().name)}).</p></div>`;

});
function payFor(b,s,m,mo,cash,att){const [y,mm]=m.split('-').map(Number);const days=new Date(y,mm,0).getDate();let absent=0,half=0;Object.values((att&&att.d)||{}).forEach(x=>{if(x[s.id]==='A')absent++;if(x[s.id]==='H')half++});
  const paidDays=days-absent-half*0.5;const base=Math.round((s.salary||0)*paidDays/days);const sales=((mo.staff||{})[s.id]||{}).sales||0;const incentive=Math.round(sales*(s.inc||0)/100);
  const es=cash.filter(e=>e.kind==='salary'&&e.staffId===s.id&&e.biz===b.id&&!e.deleted&&(e.forMonth||e.month)===m);const adv=es.filter(e=>e.sub==='advance').reduce((a,e)=>a+(+e.amount||0),0);const paid=es.filter(e=>e.sub!=='advance').reduce((a,e)=>a+(+e.amount||0),0);
  const earned=base+incentive;return {days,absent,half,paidDays,base,sales,incentive,adv,paid,earned,bal:Math.max(0,earned-adv-paid)}}

function openEntry2(kind,extra){S.mForm={kind,mode:'Cash',amount:'',note:'',cat:kind==='expense'?cfg().expCats[0]:'',date:(S.screen==='money'&&S.mDate)||todayStr(),...(extra||{})};S.overlay='mEntry';render();setTimeout(()=>{const a=$('meAmt');if(a&&kind!=='due_in')a.focus()},60)}

      openEntry2('salary',{sub:a.dataset.act==='m_adv'?'advance':'salary',staffId:s.id,staffName:s.name,forMonth:m,amount:amt||'',date:todayStr()});return}
    case 'm_slip':{const s=b.staff.find(x=>x.id===v);const m=S.salMonth||ym(new Date());const fy=fyNow();const aggs=(CACHE[`m|${fy.k}`]||{}).data||[];const mo=(m===ym(new Date())?ST.month[b.id]:null)||aggs.find(x=>x.biz===b.id&&x.month===m)||{};const p=payFor(b,s,m,mo,(CACHE[`cm|${m}`]||{}).data||[],(CACHE[`at|${b.id}_${m}`]||{}).data||{d:{}});
      openWA(s.phone||'',[`*Salary slip · ${monthLabel(m)}*`,`${b.name}`,`Name: ${s.name}`,`Monthly salary: ${inr(s.salary||0)}`,`Paid days: ${p.paidDays} of ${p.days}`,`Salary earned: ${inr(p.base)}`,p.incentive?`Incentive: ${inr(p.incentive)} (${s.inc}% of ${inr(p.sales)})`:'',p.adv?`Advances: -${inr(p.adv)}`:'',p.paid?`Paid: -${inr(p.paid)}`:'',`*Balance: ${inr(p.bal)}*`].filter(Boolean).join('\n'));return}

    case 'm_recvDue':{const c=((CACHE.dues||{}).data||[]).find(x=>x.mobile===v);if(!c)return;openEntry2('due_in',{mobile:v,custName:c.name,custDue:c.due,amount:c.due});return}

    default:return;
  }

function thumbOf(id){const t=id&&ST.thumbs[id];return t?t.data:null}
function itemIcon(c,it){const src=thumbOf(it.id);return src?`<img class="it-img" src="${src}" alt="" loading="lazy">`:ic(c.icon)}
function saveThumb(bizId,itemId,data){const d={id:itemId,biz:bizId,data,at:Date.now()};ST.thumbs[itemId]=d;DB.A.set('thumbs',itemId,d,false)}
function delThumb(itemId){delete ST.thumbs[itemId];DB.A.del('thumbs',itemId)}
// square crop, 160 px, small JPEG (about 6–10 KB)
function shrinkThumb(file,cb){const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const S0=160;const c=document.createElement('canvas');c.width=S0;c.height=S0;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,S0,S0);
  const m=Math.min(im.width,im.height);x.drawImage(im,(im.width-m)/2,(im.height-m)/2,m,m,0,0,S0,S0);let q=.8,u=c.toDataURL('image/jpeg',q);while(u.length>16000&&q>.4){q-=.1;u=c.toDataURL('image/jpeg',q)}cb(u)};im.onerror=()=>toast('Could not read that photo');im.src=r.result};r.readAsDataURL(file)}
// live: this shop's item photos (owner: all shops)
const _subDayT=subscribeDay;
subscribeDay=function(){_subDayT();const A=DB.A;if(!A||!todayUnsub)return;const scope=S.login&&S.login!=='owner'?S.login:null;
  todayUnsub.push(A.listen('thumbs',scope?[['biz','==',scope]]:[],docs=>{const m={};docs.forEach(d=>m[d.id]=d);ST.thumbs=m;renderSoft()}))};
document.addEventListener('click',e=>{const a=e.target.closest('[data-act="ifImgDel"]');if(!a||!S.form)return;S.form.name=$('ifName').value;S.form.img=null;render();const n=$('ifName');if(n)n.value=S.form.name});

</script>
<script>
/* ============================================================
   Stock & barcode billing (v1.3)
   - Stock list per shop, imported from the myBillBook item export (Excel)
   - Scan a barcode (USB / Bluetooth scanner or phone camera) on New sale
   - Stock goes down on sale, back up on return, edit or delete
   - Stock in, count adjust, low / out of stock, TSC barcode labels
   Data: collection "stock", 24 records per shop ("rosy_0" … "rosy_23"),
   each holding a map of items, so opening the app costs 24 reads, not thousands.
   ============================================================ */
const SK_PACKS=24;
const SKV='1.4.0';
ST.stock={};      // biz -> {key: item}
ST.skIdx={};      // biz -> {bc:Map, dno:Map, name:Map}
ST.skLoaded={};   // biz -> true once the first snapshot arrived
const SK={pendingExtras:null,scanBuf:'',scanT:0,labelQ:{},filter:{q:'',cat:'',brand:'',status:'all',limit:60},view:null,cam:null};
IC.scan='<path d="M4 7V5a1 1 0 0 1 1-1h2M17 4h2a1 1 0 0 1 1 1v2M20 17v2a1 1 0 0 1-1 1h-2M7 20H5a1 1 0 0 1-1-1v-2"/><path d="M8 8v8M11 8v8M14 8v8M17 8v8"/>';
IC.stack='<path d="M12 3l9 5-9 5-9-5z"/><path d="M3 13l9 5 9-5"/>';
IC.label='<path d="M3 12V4h8l9 9-8 8z"/><path d="M7 8h.01M9 15l3-3M12 18l3-3"/>';
IC.upload='<path d="M12 20V9M7 13l5-5 5 5M5 4h14"/>';
IC.trend='<path d="M3 17l6-6 4 4 8-8"/><path d="M15 7h6v6"/>';

/* ---------- keys and packs ---------- */
const skKey=s=>String(s||'').trim().toUpperCase().replace(/[^A-Z0-9]/g,'_').slice(0,80);
function skPack(key){let h=0;for(let i=0;i<key.length;i++)h=(h*31+key.charCodeAt(i))>>>0;return h%SK_PACKS}
const skDoc=(biz,key)=>`${biz}_${skPack(key)}`;
const skItems=biz=>ST.stock[biz]||{};
const skCount=biz=>Object.keys(skItems(biz)).length;
const skHas=biz=>skCount(biz)>0;
function skReindex(biz){const bc=new Map(),dno=new Map(),name=new Map();
  Object.entries(skItems(biz)).forEach(([k,it])=>{if(it.bc)bc.set(String(it.bc).toUpperCase(),k);if(it.dn)dno.set(String(it.dn).toUpperCase(),k);if(it.n)name.set(String(it.n).toUpperCase(),k)});
  ST.skIdx[biz]={bc,dno,name}}
function skFind(biz,code){const c=String(code||'').trim().toUpperCase();if(!c)return null;const ix=ST.skIdx[biz];if(!ix)return null;
  const k=ix.bc.get(c)||ix.name.get(c)||ix.dno.get(c)||(c.replace(/^0+/,'')&&ix.bc.get(c.replace(/^0+/,'')))||null;return k?{key:k,it:skItems(biz)[k]}:null}
function skSearch(biz,q,limit=12){q=String(q||'').trim().toLowerCase();if(!q)return [];const out=[];
  for(const [k,it] of Object.entries(skItems(biz))){const hay=`${it.n} ${it.bc||''} ${it.dn||''} ${it.c||''} ${it.br||''}`.toLowerCase();if(hay.includes(q)){out.push({key:k,it});if(out.length>=limit)break}}return out}
const skQty=it=>Math.round(+it.q||0);
const skLow=it=>{const q=skQty(it);return q>0&&q<=Math.max(1,+it.lo||1)};
const skPrice=it=>+it.sp||+it.m||0;
function skParse(name){const p=String(name||'').trim().split('-');if(p.length>=3)return {article:p.slice(0,-2).join('-'),color:p[p.length-2],size:p[p.length-1]};if(p.length===2)return {article:p[0],color:p[1],size:''};return {article:String(name||''),color:'',size:''}}
function skParseCode(raw){const code=String(raw||'').trim();if(!code||code==='Not Found')return {party:'',brand:'',rate:0};const p=code.split('-');if(p.length<2)return {party:code,brand:'',rate:0};
  const rate=parseFloat(p[p.length-1])||0;const mid=p.slice(1,-1);const bp=[];for(let i=mid.length-1;i>=0;i--){if(!/\d/.test(mid[i].replace(/[\/\.']/g,'')))bp.unshift(mid[i]);else break}
  return {party:p[0],brand:(bp.length?bp.join('-'):mid[mid.length-1]||'').toUpperCase(),rate}}

/* ---------- writes ---------- */
function skWrite(biz,map){// map: key -> partial item (may contain A.inc for q)
  const packs={};for(const k in map){const d=skDoc(biz,k);(packs[d]=packs[d]||{})[k]=map[k]}
  return Promise.all(Object.entries(packs).map(([d,items])=>DB.A.set('stock',d,{biz,p:+d.split('_').pop(),items},true)))}
function skMove(biz,deltas,why){// deltas: key -> +/- qty
  const m={};let any=false;for(const k in deltas){if(!deltas[k])continue;any=true;m[k]={q:DB.A.inc(deltas[k])};const it=skItems(biz)[k];if(it)it.q=skQty(it)+deltas[k]}
  if(!any)return;skWrite(biz,m);if(why)DB.A.set('stocklog','sl_'+uid(),{biz,at:Date.now(),date:todayStr(),by:isAdmin()?'Owner':(DEVICE.name||biz+' counter'),why,d:deltas},false)}

/* ---------- stock follows the bills ---------- */
function skBillQty(b){const m={};if(!b||b.deleted)return m;(b.lines||[]).forEach(l=>{if(l.sk&&!l.returned)m[l.sk]=(m[l.sk]||0)+(+l.qty||0)});return m}
const _dbSaveBill=DB.saveBill.bind(DB);
DB.saveBill=function(b,prev){
  if(SK.pendingExtras&&b&&b.lines)b.lines.forEach((l,i)=>{const x=SK.pendingExtras[i];if(x)Object.assign(l,x)});
  _dbSaveBill(b,prev);
  try{const now=skBillQty(b),was=skBillQty(prev);const d={};new Set([...Object.keys(now),...Object.keys(was)]).forEach(k=>{const v=(was[k]||0)-(now[k]||0);if(v)d[k]=v});
    if(Object.keys(d).length)skMove(b.biz,d,null)}catch(e){console.warn('stock update',e)}
};
const _saveSale=saveSale;
saveSale=function(){SK.pendingExtras=S.cart.map(l=>l.sk?{sk:l.sk,bc:l.bc||'',dno:l.dno||'',brand:l.brand||'',size:l.size||'',color:l.color||''}:null);try{_saveSale()}finally{SK.pendingExtras=null}};
const _startEdit=startEdit;
startEdit=function(bill){_startEdit(bill);const act=(bill.lines||[]).filter(l=>!l.returned);
  S.cart.forEach((c,i)=>{const l=act[i];if(l&&l.sk)Object.assign(c,{sk:l.sk,bc:l.bc,dno:l.dno,brand:l.brand,size:l.size,color:l.color,skCost:l.cost})});render()};
// cost of a scanned item comes from the stock record (staff never type a code)
const _unitCost=unitCost;
unitCost=function(it){if(it&&it.sk&&+it.skCost>0)return {ok:true,val:Math.round(+it.skCost)};return _unitCost(it)};
// reports can group by brand
const _billRecs=billRecs;
billRecs=function(b){const rs=_billRecs(b);const act=(b.lines||[]).filter(l=>!l.returned);rs.forEach((r,i)=>{const l=act[i];if(l){r.brand=l.brand||'';r.sk=l.sk||'';r.size=l.size||''}});return rs};

/* ---------- live stock ---------- */
const _subDayS=subscribeDay;
subscribeDay=function(){_subDayS();const A=DB.A;if(!A||!todayUnsub||!S.login)return;const scope=S.login!=='owner'?S.login:null;
  todayUnsub.push(A.listen('stock',scope?[['biz','==',scope]]:[],docs=>{const by={};docs.forEach(d=>{(by[d.biz]=by[d.biz]||{});const its=d.items||{};for(const k in its){if(!its[k]||its[k].del)continue;by[d.biz][k]=its[k]}});
    const seen=new Set(docs.map(d=>d.biz));Object.keys(ST.stock).forEach(z=>{if(!seen.has(z)&&(!scope||z===scope))delete ST.stock[z]});
    Object.entries(by).forEach(([z,m])=>{ST.stock[z]=m;skReindex(z);ST.skLoaded[z]=true});(scope?[scope]:ST.biz.map(x=>x.id)).forEach(z=>ST.skLoaded[z]=true);
    if(S.screen==='stock'||S.overlay&&String(S.overlay).startsWith('sk'))renderSoft();else if(S.screen==='sale'){const el=$('skBar');if(el)el.outerHTML=skBarHTML()}}))};

/* ---------- adding a scanned item to the bill ---------- */
function skAddToCart(key,qty=1){const b=B();const it=skItems(b.id)[key];if(!it)return false;
  const same=S.cart.find(l=>l.sk===key&&+l.price===skPrice(it));
  if(same)same.qty+=qty;else{const pn=skParse(it.n);S.cart.push({itemId:null,cat:it.c||'Stock',icon:'garment',name:it.n,qty,price:skPrice(it),mode:'mrp',mrp:+it.m||skPrice(it),code:'',note:[it.dn?'D.no '+it.dn:'',it.br||''].filter(Boolean).join(' · '),sk:key,bc:it.bc||'',dno:it.dn||'',brand:it.br||'',size:pn.size,color:pn.color,skCost:+it.co||0})}
  const left=skQty(it)-S.cart.filter(l=>l.sk===key).reduce((a,l)=>a+l.qty,0);
  S.entry=null;render();
  toast(`${left<0?'⚠ Not in stock records · ':''}Added ${it.n} · ${inr(skPrice(it))}${left>=0?` · ${left} left`:''}`);
  if(navigator.vibrate)navigator.vibrate(left<0?[60,40,60]:30);
  return true}
function skScan(code){const b=B();if(!b)return;code=String(code||'').trim();if(!code)return;
  const f=skFind(b.id,code);if(f){skAddToCart(f.key);return true}
  const hits=skSearch(b.id,code,2);if(hits.length===1){skAddToCart(hits[0].key);return true}
  toast(`"${code}" is not in ${b.name}'s stock list`);if(navigator.vibrate)navigator.vibrate([90,50,90]);return false}

/* ---------- scan bar on New sale ---------- */
function skBarHTML(){const b=B();if(!b)return '';const n=skCount(b.id);
  if(!n)return isAdmin()&&ST.skLoaded[b.id]?`<button class="list-btn" id="skBar" data-act="skGoStock">${ic('scan')}<span>Barcode billing<small>Import ${esc(b.name)}'s stock from myBillBook Excel to scan barcodes</small></span>${ic('chev','chev')}</button>`:`<div id="skBar" hidden></div>`;
  return `<div class="skbar" id="skBar"><div class="search"><div class="inp">${ic('scan')}<input id="skScan" placeholder="Scan barcode · or type D.no / item code" autocomplete="off" autocapitalize="characters" spellcheck="false" enterkeyhint="go" aria-label="Scan or type barcode"></div><button class="scan-btn" data-act="skCam" aria-label="Scan with camera">${ic('camera')}</button></div><div id="skSug"></div><p class="hint">${n.toLocaleString('en-IN')} item${n===1?'':'s'} in stock list · a scanner gun works anywhere on this screen</p></div>`}
const _saleScreen=screens.sale;
screens.sale=function(){const h=_saleScreen();const i=h.indexOf('<div class="search">');return i<0?h:h.slice(0,i)+skBarHTML()+h.slice(i)};
function skSugHTML(q){const b=B();const hits=skSearch(b.id,q,8);if(!q||q.length<2)return '';if(!hits.length)return `<p class="hint" style="padding:6px 2px">No stock item matches "${esc(q)}". Press Enter after a full barcode.</p>`;
  return `<div class="sksug">${hits.map(({key,it})=>`<button data-act="skAdd" data-k="${esc(key)}"><b>${esc(it.n)}</b><span>${esc([it.c,it.br,it.dn?'D.no '+it.dn:''].filter(Boolean).join(' · '))}</span><em>${inr(skPrice(it))}</em><i class="${skQty(it)<=0?'out':skLow(it)?'low':''}">${skQty(it)}</i></button>`).join('')}</div>`}

/* ---------- scanner gun: fast keystrokes ending in Enter, anywhere on the sale screen ---------- */
document.addEventListener('keydown',e=>{
  if(S.screen!=='sale'||S.overlay)return;const t=e.target;const inField=t&&(t.tagName==='INPUT'||t.tagName==='TEXTAREA'||t.tagName==='SELECT');
  if(t&&t.id==='skScan'){if(e.key==='Enter'){e.preventDefault();const v=t.value;if(skScan(v)){t.value='';const s=$('skSug');if(s)s.innerHTML='';setTimeout(()=>{const n=$('skScan');if(n)n.focus()},30)}}return}
  if(inField)return;
  const now=Date.now();if(now-SK.scanT>80)SK.scanBuf='';SK.scanT=now;
  if(e.key==='Enter'){if(SK.scanBuf.length>=3){e.preventDefault();skScan(SK.scanBuf)}SK.scanBuf='';return}
  if(e.key.length===1)SK.scanBuf+=e.key;
},true);
document.addEventListener('input',e=>{const t=e.target;
  if(t.id==='skScan'){const s=$('skSug');if(s)s.innerHTML=skSugHTML(t.value.trim());return}
  if(t.id==='skQ'){SK.filter.q=t.value;SK.filter.limit=60;clearTimeout(SK.qt);SK.qt=setTimeout(()=>{const pos=t.selectionStart;render();const n=$('skQ');if(n){n.focus();n.setSelectionRange(pos,pos)}},250);return}
  if(t.dataset.lq!==undefined){const k=t.dataset.lq;const v=Math.max(0,parseInt(t.value)||0);if(v)SK.labelQ[k]=v;else delete SK.labelQ[k];const c=$('lbCount');if(c)c.textContent=skLabelTotal();return}
});

/* ---------- camera scan ---------- */
function skLoad(src,test){return new Promise((res,rej)=>{if(test())return res();const s=document.createElement('script');s.src=src;s.onload=()=>res();s.onerror=()=>rej(new Error('load'));document.head.appendChild(s)})}
async function skCamOpen(onCode){
  S.overlay='skCam';render();const v=$('skVideo');const st=$('skCamMsg');
  let stream;try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment',width:{ideal:1280}},audio:false})}catch(e){st.textContent='Camera not allowed. Allow camera access for this site, or use a scanner gun.';return}
  SK.cam={stream,stop:false};v.srcObject=stream;await v.play().catch(()=>{});
  const done=code=>{if(SK.cam&&!SK.cam.stop){skCamClose();onCode(code)}};
  if('BarcodeDetector' in window){let det;try{det=new BarcodeDetector({formats:['code_128','ean_13','ean_8','code_39','upc_a','upc_e','itf','qr_code']})}catch(e){det=new BarcodeDetector()}
    const tick=async()=>{if(!SK.cam||SK.cam.stop)return;try{const r=await det.detect(v);if(r&&r[0]&&r[0].rawValue){done(r[0].rawValue);return}}catch(e){}setTimeout(tick,160)};tick();return}
  try{st.textContent='Loading scanner…';await skLoad('https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js',()=>window.ZXing);st.textContent='Point the camera at the barcode';
    const r=new ZXing.BrowserMultiFormatReader();SK.cam.zx=r;r.decodeFromVideoElementContinuously(v,(res)=>{if(res)done(res.getText())})}
  catch(e){st.textContent='Camera scanning is not available on this phone. Type the barcode instead.'}}
function skCamClose(){if(SK.cam){SK.cam.stop=true;try{SK.cam.zx&&SK.cam.zx.reset()}catch(e){}(SK.cam.stream?SK.cam.stream.getTracks():[]).forEach(t=>t.stop())}SK.cam=null;if(S.overlay==='skCam'){S.overlay=null;render()}}
function skCamSheet(){return `<button class="overlay-bg" data-act="skCamX" aria-label="Close"></button><div class="sheet" role="dialog" aria-label="Scan barcode"><div class="grab"></div><div class="sh-body"><h3>Scan barcode</h3>
  <div class="skcam"><video id="skVideo" playsinline muted></video><i></i></div><p class="hint" id="skCamMsg">Point the camera at the barcode on the tag</p><button class="secondary" data-act="skCamX">Close</button></div></div>`}

/* ---------- Stock screen ---------- */
function skFiltered(){const b=B();const f=SK.filter;const q=f.q.trim().toLowerCase();
  let list=Object.entries(skItems(b.id)).map(([key,it])=>({key,it}));
  if(f.cat)list=list.filter(x=>(x.it.c||'')===f.cat);if(f.brand)list=list.filter(x=>(x.it.br||'')===f.brand);
  if(f.status==='in')list=list.filter(x=>skQty(x.it)>0);else if(f.status==='low')list=list.filter(x=>skLow(x.it));else if(f.status==='out')list=list.filter(x=>skQty(x.it)<=0);
  if(q)list=list.filter(({it})=>`${it.n} ${it.bc||''} ${it.dn||''} ${it.c||''} ${it.br||''} ${it.pt||''}`.toLowerCase().includes(q));
  return list.sort((a,c)=>String(a.it.n).localeCompare(String(c.it.n),undefined,{numeric:true}))}
function skStats(list){let pcs=0,mrp=0,cost=0,low=0,out=0;list.forEach(({it})=>{const q=skQty(it);if(q>0){pcs+=q;mrp+=q*(+it.m||skPrice(it));cost+=q*(+it.co||0)}if(q<=0)out++;else if(skLow(it))low++});return {n:list.length,pcs,mrp,cost,low,out}}
screens.stock=function(){const b=B();const own=isAdmin();
  if(!ST.skLoaded[b.id])return `${topbar('Stock',own?'more':'home',bizPill())}<div class="pad">${loading('Loading stock…')}</div>`;
  const all=Object.values(skItems(b.id));const f=SK.filter;
  if(!all.length)return `${topbar('Stock',own?'more':'home',bizPill())}<div class="pad" style="padding-top:4px">
    <div class="empty">No stock list for ${esc(b.name)} yet.${own?'<br>Import your myBillBook item list (Excel) to start barcode billing.':'<br>Ask the owner to import the stock list.'}</div>
    ${own?`<label class="primary" for="skFile">${ic('upload')} Import myBillBook Excel</label><input type="file" id="skFile" accept=".xlsx,.xls,.csv" class="visually-hidden"><button class="secondary" data-act="skNew">${ic('plus')} Add an item by hand</button>`:''}</div>`;
  const cats=[...new Set(all.map(i=>i.c).filter(Boolean))].sort();const brands=[...new Set(all.map(i=>i.br).filter(Boolean))].sort();
  const list=skFiltered();const s=skStats(list);const tot=skStats(Object.entries(skItems(b.id)).map(([key,it])=>({key,it})));
  const lq=skLabelTotal();
  return `${topbar('Stock',own?'more':'home',bizPill())}
  <div class="pad" style="padding-top:4px;gap:12px">
    <div class="kgrid">
      <div class="kpi"><span>${ic('stack')}Pieces in stock</span><b>${tot.pcs.toLocaleString('en-IN')}</b><small class="hint">${tot.n.toLocaleString('en-IN')} items</small></div>
      <div class="kpi"><span>Stock at MRP</span><b>${inr(tot.mrp)}</b>${own?`<small class="hint">${priv('Cost '+inr(tot.cost))}</small>`:''}</div>
      <button class="kpi skk ${f.status==='low'?'on':''}" data-act="skStatus" data-v="low"><span>Low stock</span><b style="color:var(--warn)">${tot.low}</b></button>
      <button class="kpi skk ${f.status==='out'?'on':''}" data-act="skStatus" data-v="out"><span>Out of stock</span><b style="color:var(--bad)">${tot.out}</b></button>
    </div>
    <div class="search"><div class="inp">${ic('search')}<input id="skQ" placeholder="Name, barcode, D.no, brand…" value="${esc(f.q)}" autocomplete="off" aria-label="Search stock"></div><button class="scan-btn" data-act="skCamFind" aria-label="Scan to find">${ic('camera')}</button></div>
    <div class="two"><div class="f"><select id="skCat" aria-label="Category"><option value="">All categories</option>${cats.map(c=>`<option ${f.cat===c?'selected':''}>${esc(c)}</option>`).join('')}</select></div>
      <div class="f"><select id="skBrand" aria-label="Brand"><option value="">All brands</option>${brands.map(c=>`<option ${f.brand===c?'selected':''}>${esc(c)}</option>`).join('')}</select></div></div>
    <div class="chips scroll">${[['all','All'],['in','In stock'],['low','Low'],['out','Out of stock']].map(([k,l])=>`<button class="chip ${f.status===k?'on':''}" data-act="skStatus" data-v="${k}">${l}</button>`).join('')}</div>
    <p class="hint">${s.n.toLocaleString('en-IN')} items · ${s.pcs.toLocaleString('en-IN')} pcs · MRP ${inr(s.mrp)}${f.q||f.cat||f.brand||f.status!=='all'?` · <button class="linkbtn" data-act="skClear">Clear filters</button>`:''}</p>
    ${own?`<div class="skacts"><button class="secondary" data-act="skLabelsAll">${ic('label')} Labels for these (${s.pcs>2000?'2000+':s.pcs} pcs)</button>${lq?`<button class="primary" data-act="skLabels">${ic('print')} Print ${lq} labels</button>`:''}</div>`:''}
    <div class="sklist">${list.slice(0,f.limit).map(({key,it})=>{const q=skQty(it);return `<button class="skrow" data-act="skOpen" data-k="${esc(key)}"><div><b>${esc(it.n)}</b><span>${esc([it.c,it.br,it.dn?'D.no '+it.dn:''].filter(Boolean).join(' · '))}</span></div><em>${inr(+it.m||skPrice(it))}</em><i class="${q<=0?'out':skLow(it)?'low':''}">${q}</i></button>`}).join('')||'<div class="empty">Nothing matches.</div>'}</div>
    ${list.length>f.limit?`<button class="secondary" data-act="skMore">Show more (${(list.length-f.limit).toLocaleString('en-IN')} more)</button>`:''}
    ${own?`<div class="card"><div class="card-h"><h3>Stock list</h3><span class="hint">v${SKV}</span></div>
      <div class="f" style="gap:8px"><label class="secondary" for="skFile">${ic('upload')} Import / update from myBillBook Excel</label><input type="file" id="skFile" accept=".xlsx,.xls,.csv" class="visually-hidden">

/* ---------- Excel import (myBillBook "Items" export) ---------- */
async function skImport(file){const b=B();if(!isAdmin())return;
  toast('Reading Excel…');
  try{await skLoad('https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js',()=>window.XLSX)}catch(e){toast('Could not load the Excel reader. Check the internet.');return}
  const buf=await file.arrayBuffer();let wb;try{wb=XLSX.read(new Uint8Array(buf),{type:'array'})}catch(e){toast('That file could not be read as Excel');return}
  const sh=wb.Sheets['master data']||wb.Sheets[wb.SheetNames[0]];const rows=XLSX.utils.sheet_to_json(sh,{header:1,defval:''});
  if(rows.length<2){toast('No rows found in the first sheet');return}
  const H=rows[0].map(h=>String(h).trim().toLowerCase());
  const col=(re,fb)=>{const i=H.findIndex(h=>re.test(h));return i>=0?i:fb};
  const C={n:col(/^item ?name|^name$|^product ?name/,0),c:col(/categor/,2),bc:col(/item ?code|barcode/,3),sp:col(/sales? ?price|selling/,6),co:col(/purchase ?price|cost/,8),m:col(/^mrp/,10),q:col(/current ?stock|^stock|quantity|^qty/,11),lo:col(/low ?stock/,12),dn:col(/^d\.? ?no|design/,15),cd:col(/^code$/,16)};
  const items={};let n=0;let dnoNext=+skNextDno(b.id);const usedBc=new Set();
  for(let i=1;i<rows.length;i++){const r=rows[i];const name=String(r[C.n]||'').trim().toUpperCase();if(!name||/^example|^how to/i.test(name))continue;
    let bc=String(r[C.bc]||'').trim();const ex=!bc&&ST.skIdx[b.id]?ST.skIdx[b.id].name.get(name):null;
    if(!bc&&ex)bc=skItems(b.id)[ex].bc||'';if(!bc){do{bc=skNewBarcode(b.id)}while(usedBc.has(bc))}usedBc.add(bc);
    const key=ex||skKey(bc);const pc=skParseCode(r[C.cd]);
    if(!String(r[C.dn]||'').trim())r[C.dn]=ex&&skItems(b.id)[ex].dn?skItems(b.id)[ex].dn:String(dnoNext++);
    const cost=+r[C.co]||0;items[key]={n:name,c:String(r[C.c]||'').trim()||'Other',bc:bc||'',dn:String(r[C.dn]||'').trim(),cd:String(r[C.cd]||'').trim(),pt:pc.party,br:pc.brand,
      m:+r[C.m]||+r[C.sp]||0,sp:+r[C.sp]||+r[C.m]||0,co:cost||(pc.rate?Math.round(pc.rate*25*100)/100:0),lo:+r[C.lo]||1,q:Math.round(+r[C.q]||0),del:false,at:Date.now()};n++}
  if(!n){toast('No items found. Is this the myBillBook item list?');return}
  S.skImp={file:file.name,items,n,exist:Object.keys(items).filter(k=>skItems(b.id)[k]).length,pcs:Object.values(items).reduce((a,x)=>a+Math.max(0,x.q),0),cats:new Set(Object.values(items).map(x=>x.c)).size,mode:skHas(b.id)?'keep':'set'};
  S.overlay='skImp';render()}
function skImpSheet(){const b=B();const m=S.skImp;const fresh=m.n-m.exist;
  return `<button class="overlay-bg" data-act="skClose" aria-label="Close"></button>
  <div class="sheet" role="dialog" aria-label="Import stock"><div class="grab"></div><div class="sh-body"><h3>Import into ${esc(b.name)}</h3>
    <p class="hint">${esc(m.file)}</p>
    <div class="kgrid"><div class="kpi"><span>Items in file</span><b>${m.n.toLocaleString('en-IN')}</b></div><div class="kpi"><span>Pieces</span><b>${m.pcs.toLocaleString('en-IN')}</b></div>
      <div class="kpi"><span>New items</span><b>${fresh.toLocaleString('en-IN')}</b></div><div class="kpi"><span>Already in list</span><b>${m.exist.toLocaleString('en-IN')}</b></div></div>
    <div class="f"><span class="lab">Quantities in the file</span><div class="chips">${[['set','Set stock = file'],['add','Add to stock (new purchase)'],['keep','Keep current stock']].map(([k,l])=>`<button class="chip ${m.mode===k?'on':''}" data-act="skImpMode" data-v="${k}">${l}</button>`).join('')}</div></div>
    <p class="hint">${m.mode==='set'?'Every item\'s stock becomes the quantity in the file. Use this for the first import or after a full stock count.':m.mode==='add'?'The quantity in the file is added to what is already in stock. Use this for a new purchase / new arrivals list.':'Only names, prices and codes are updated; new items come in with the file quantity. Stock already counted by this app is kept.'}</p>

  </div></div>`}
async function skImpGo(){const b=B();const m=S.skImp;if(!m)return;const useQty=m.mode==='set';
  const map={};const local={};for(const k in m.items){const it={...m.items[k]};const was=skItems(b.id)[k];local[k]={...it};
    if(was&&m.mode==='keep'){delete it.q;delete local[k].q}else if(was&&m.mode==='add'){local[k].q=skQty(was)+it.q;it.q=DB.A.inc(it.q)}map[k]=it}
  S.overlay=null;S.skImp=null;render();toast('Saving stock list…');
  await skWrite(b.id,map);ST.stock[b.id]={...skItems(b.id)};for(const k in local)ST.stock[b.id][k]={...(ST.stock[b.id][k]||{}),...local[k]};skReindex(b.id);
  DB.A.set('stocklog','sl_'+uid(),{biz:b.id,at:Date.now(),date:todayStr(),by:'Owner',why:'import '+m.mode,n:Object.keys(map).length},false);
  if(m.mode!=='keep'){SK.lastImport=Object.keys(m.items).map(k=>[k,m.items[k].q]).filter(x=>x[1]>0)}
  render();toast(`Imported ${Object.keys(map).length.toLocaleString('en-IN')} items into ${b.name}`);
  if(SK.lastImport&&SK.lastImport.length&&m.mode==='add'){SK.lastImport.forEach(([k,q])=>SK.labelQ[k]=(SK.labelQ[k]||0)+q);toast(`Imported · ${skLabelTotal()} labels ready to print`)}}

async function skPrintLabels(){const b=B();const L=LS.get('rr.label',{size:'50x25',shop:true,mrp:true,dno:true,code:false});const [w,h]=L.size.split('x').map(Number);
  try{await skLoad('https://cdnjs.cloudflare.com/ajax/libs/jsbarcode/3.11.6/JsBarcode.all.min.js',()=>window.JsBarcode)}catch(e){toast('Could not load the barcode maker. Check the internet.');return}
  const labs=[];for(const k in SK.labelQ){const it=skItems(b.id)[k];if(!it)continue;const code=it.bc||it.dn||k;for(let i=0;i<SK.labelQ[k];i++)labs.push({it,code})}
  if(!labs.length){toast('No labels to print');return}

  const big=h>=38;const body=labs.map(({it,code})=>`<div class="lb"><div class="t">${L.shop?`<b>${esc(b.name)}</b>`:''}${L.mrp?`<span class="mrp">MRP ₹${(+it.m||skPrice(it)).toLocaleString('en-IN')}</span>`:''}</div><div class="nm">${esc(it.n)}${L.dno&&it.dn?` · D.${esc(it.dn)}`:''}${L.code&&it.cd?` · ${esc(it.cd)}`:''}</div><div class="bc">${svgs[code]}</div></div>`).join('');
  const html=`<!doctype html><html><head><meta charset="utf-8"><title>Labels ${esc(b.name)}</title><style>@page{size:${w}mm ${h}mm;margin:0}*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;color:#000}
  .lb{width:${w}mm;height:${h}mm;padding:1.2mm 2mm;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden;page-break-after:always;break-after:page}
  .t{display:flex;justify-content:space-between;align-items:baseline;font-size:${big?11:8.5}pt;line-height:1.1}.t b{font-size:${big?10:7.5}pt}.mrp{font-weight:700}
  .nm{font-size:${big?9:6.8}pt;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.15}.bc{flex:1;display:flex;align-items:flex-end;justify-content:center;min-height:0}.bc svg{width:100%;height:100%;max-height:${big?h*0.55:h*0.52}mm}
  @media screen{body{background:#ddd;padding:10px;display:flex;flex-wrap:wrap;gap:8px}.lb{background:#fff}}</style></head><body>${body}<script>window.onload=()=>setTimeout(()=>window.print(),300)<\/script></body></html>`;
  const wdw=window.open('','_blank');if(!wdw){toast('Allow pop-ups to print labels');return}wdw.document.open();wdw.document.write(html);wdw.document.close()}
async function skLabelsExcel(){const b=B();try{await skLoad('https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js',()=>window.XLSX)}catch(e){toast('Could not load Excel. Check the internet.');return}

document.addEventListener('click',e=>{const a=e.target.closest('[data-act]');if(!a)return;const act=a.dataset.act;const b=B();
  const k=a.dataset.k;
  switch(act){
    case 'skGoStock':go('stock');return;
    case 'skAdd':{if(S.overlay==='skItem'){S.overlay=null}skAddToCart(k);return}

    case 'skCamFind':skCamOpen(code=>{const f=skFind(b.id,code);if(f){SK.view=f.key;S.overlay='skItem';render()}else{SK.filter.q=code;render();toast(`"${code}" not found`)}});return;
    case 'skCamX':skCamClose();return;
    case 'skStatus':SK.filter.status=SK.filter.status===a.dataset.v&&a.classList.contains('skk')?'all':a.dataset.v;SK.filter.limit=60;render();return;
    case 'skClear':SK.filter={q:'',cat:'',brand:'',status:'all',limit:60};render();return;
    case 'skMore':SK.filter.limit+=100;render();return;
    case 'skOpen':SK.view=k;S.overlay='skItem';render();return;
    case 'skClose':S.overlay=null;S.skForm=null;render();return;
    case 'skNew':S.skForm={};S.overlay='skNew';render();setTimeout(()=>{const n=$('nfName');if(n)n.focus()},60);return;
    case 'skIn':case 'skSet':{const it=skItems(b.id)[SK.view];if(!it)return;const inp=$(act==='skIn'?'skInQty':'skSetQty');const v=parseInt(inp&&inp.value);if(isNaN(v)||(act==='skIn'&&v<=0)){toast('Type a quantity');return}
      const d=act==='skIn'?v:v-skQty(it);if(!d){toast('Stock is already '+v);return}skMove(b.id,{[SK.view]:d},act==='skIn'?'stock in':'count');render();toast(act==='skIn'?`+${v} added · now ${skQty(it)}`:`Stock set to ${v}`);return}
    case 'skSave':{const it=skItems(b.id)[SK.view];if(!it)return;const p={m:+$('skM').value||0,sp:+$('skSp').value||0,co:+$('skCo').value||0,lo:Math.max(1,+$('skLo').value||1)};Object.assign(it,p);skWrite(b.id,{[SK.view]:p});toast('Prices saved');render();return}
    case 'skDel':{const it=skItems(b.id)[SK.view];if(!it)return;if(!confirm(`Remove ${it.n} from the stock list?`))return;skWrite(b.id,{[SK.view]:{del:true,q:0}});delete ST.stock[b.id][SK.view];skReindex(b.id);S.overlay=null;render();toast('Item removed');return}
    case 'skLabel1':{const it=skItems(b.id)[SK.view];if(!it)return;SK.labelQ[SK.view]=Math.max(1,skQty(it));S.overlay='skLabels';render();return}
    case 'skLabelsAll':{const list=skFiltered();let n=0;for(const {key,it} of list){const q=Math.max(0,skQty(it));if(!q)continue;SK.labelQ[key]=q;n+=q;if(n>=2000)break}if(!n){toast('These items have no stock to label');return}S.overlay='skLabels';render();return}
    case 'skLabels':S.overlay='skLabels';render();return;
    case 'lbSize':{const L=LS.get('rr.label',{size:'50x25',shop:true,mrp:true,dno:true,code:false});L.size=a.dataset.v;LS.set('rr.label',L);render();return}
    case 'lbOpt':{const L=LS.get('rr.label',{size:'50x25',shop:true,mrp:true,dno:true,code:false});L[a.dataset.v]=!L[a.dataset.v];LS.set('rr.label',L);render();return}
    case 'lbPrint':skPrintLabels();return;
    case 'lbExcel':skLabelsExcel();return;
    case 'lbClear':SK.labelQ={};S.overlay=null;render();return;
    case 'skExport':skExport();return;
    case 'skImpGo':skImpGo();return;
    case 'skImpMode':if(S.skImp){S.skImp.mode=a.dataset.v;render()}return;
    case 'rTabTrend':S.rTab='trend';render();return;
  }
});

const axk=v=>v>=100000?'₹'+(+(v/100000).toFixed(1))+'L':v>=1000?'₹'+(+(v/1000).toFixed(1))+'k':'₹'+v;
function trendReport(){const b=B();const t=todayStr();const thisM=t.slice(0,7);const d0=new Date();const lastM=ym(new Date(d0.getFullYear(),d0.getMonth()-1,1));
  const [lf]=monthRange(lastM);const docs=need(`d|${lf}|${addDays(t,-1)}`,()=>DB.daily(lf,addDays(t,-1)));if(!docs)return loading();
  const byDay={};docs.filter(x=>x.biz===b.id).forEach(x=>byDay[x.date]=x);byDay[t]={sales:todaySales(b.id),bills:todayOf(b.id).length};
  const dayOfM=+t.slice(8);const sumM=(m,upto)=>Object.entries(byDay).filter(([d])=>d.startsWith(m)&&(!upto||+d.slice(8)<=upto)).reduce((a,[,x])=>a+(x.sales||0),0);
  const cur=sumM(thisM),prevSame=sumM(lastM,dayOfM),prevAll=sumM(lastM);const ch=prevSame?Math.round((cur-prevSame)/prevSame*100):null;
  const [,mEnd]=monthRange(thisM);const daysIn=+mEnd.slice(8);const proj=dayOfM?Math.round(cur/dayOfM*daysIn):0;
  // daily bars this month vs last month same day
  const W=320,H=150,L=36,R=6,T=10,Bm=20,iw=W-L-R,ih=H-T-Bm;const vals=[],pv=[];for(let i=1;i<=daysIn;i++){const dd=`${thisM}-${pad2(i)}`,pd=`${lastM}-${pad2(i)}`;vals.push(i<=dayOfM?((byDay[dd]||{}).sales||0):null);pv.push((byDay[pd]||{}).sales||0)}
  const max=Math.max(1000,...vals.filter(v=>v!=null),...pv);const step=niceStep(max/4),top=step*4;const slot=iw/daysIn,bw=Math.max(2,slot*.6);let g='';
  for(let i=0;i<=4;i++){const y=T+ih-ih*i/4;g+=`<line class="grid" x1="${L}" x2="${W-R}" y1="${y}" y2="${y}"/><text x="${L-5}" y="${y+3}" text-anchor="end">${axk(step*i)}</text>`}
  let path='';pv.forEach((v,i)=>{const x=L+slot*i+slot/2,y=T+ih-ih*v/top;path+=(i?'L':'M')+x.toFixed(1)+' '+y.toFixed(1)});
  vals.forEach((v,i)=>{if(v==null)return;const h=ih*v/top,x=L+slot*i+(slot-bw)/2;g+=`<rect class="b${i+1===dayOfM?' last':''}" x="${x.toFixed(1)}" y="${(T+ih-h).toFixed(1)}" width="${bw.toFixed(1)}" height="${Math.max(0,h).toFixed(1)}" rx="1.5"><title>${i+1} ${MONTHS[+thisM.slice(5)-1]}: ${inr(v)}</title></rect>`;if(i===0||(i+1)%5===0)g+=`<text x="${(x+bw/2).toFixed(1)}" y="${H-5}" text-anchor="middle">${i+1}</text>`});
  g+=`<path d="${path}" fill="none" stroke="var(--muted)" stroke-width="1.5" stroke-dasharray="3 3"/>`;
  // weekdays (last 60 days)
  const wd=[0,0,0,0,0,0,0],wn=[0,0,0,0,0,0,0];Object.entries(byDay).forEach(([d,x])=>{if(d===t)return;const w=parseYmd(d).getDay();wd[w]+=x.sales||0;wn[w]++});const wavg=wd.map((v,i)=>wn[i]?v/wn[i]:0);const wmax=Math.max(1,...wavg);const WD=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  // payment share this month (bills)
  const [mf]=monthRange(thisM);const bl=bizBills(billsBetween(mf,t),b.id);let pay=null;
  if(bl){pay={Cash:0,UPI:0,Card:0,Due:0};bl.forEach(x=>{const p=billMoney(x);pay.Cash+=p.Cash||0;pay.UPI+=p.UPI||0;pay.Card+=p.Card||0;pay.Due+=x.due||0})}
  const ptot=pay?Object.values(pay).reduce((a,v)=>a+v,0):0;
  const best=Object.entries(byDay).filter(([d])=>d.startsWith(thisM)).sort((a,c)=>(c[1].sales||0)-(a[1].sales||0))[0];
  // brands (stock lines) this month
  const recs=bl?bl.flatMap(billRecs):[];const byBrand=Object.entries(groupBy(recs.filter(r=>r.brand),'brand')).map(([k,x])=>({k,o:agg(x)})).sort((x,y)=>y.o.sales-x.o.sales).slice(0,8);const bmax=Math.max(1,...byBrand.map(x=>x.o.sales));
  const bySize=Object.entries(groupBy(recs.filter(r=>r.size),'size')).map(([k,x])=>({k,q:x.reduce((a,r)=>a+r.qty,0)})).sort((x,y)=>y.q-x.q).slice(0,8);const smax=Math.max(1,...bySize.map(x=>x.q));
  return `<div class="kgrid">
      <div class="kpi"><span>${MONTHS[+thisM.slice(5)-1]} so far</span><b>${inr(cur)}</b></div>
      <div class="kpi"><span>vs ${MONTHS[+lastM.slice(5)-1]} 1–${dayOfM}</span><b style="color:${ch==null?'var(--muted)':ch>=0?'var(--good)':'var(--bad)'}">${ch==null?'—':(ch>=0?'▲ ':'▼ ')+Math.abs(ch)+'%'}</b><small class="hint">${inr(prevSame)}</small></div>
      <div class="kpi"><span>On track for</span><b>${inr(proj)}</b><small class="hint">${MONTHS[+lastM.slice(5)-1]} total ${inr(prevAll)}</small></div>
      <div class="kpi"><span>Best day</span><b>${best?inr(best[1].sales||0):'—'}</b><small class="hint">${best?dayLabel(best[0]):''}</small></div></div>
    <div class="card"><div class="card-h"><h3>Daily sales · ${monthLabel(thisM)}</h3><span class="hint">dashed = ${MONTHS[+lastM.slice(5)-1]}</span></div><svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Daily sales this month">${g}</svg></div>
    ${pay&&ptot?`<div class="card"><div class="card-h"><h3>How customers paid · ${MONTHS[+thisM.slice(5)-1]}</h3></div><div class="paybar">${Object.entries(pay).filter(([,v])=>v>0).map(([k,v])=>`<i class="p-${k}" style="flex:${v}" title="${k} ${inr(v)}"></i>`).join('')}</div>
      <div class="paylegend">${Object.entries(pay).map(([k,v])=>`<span><i class="p-${k}"></i>${k} <b>${inr(v)}</b> ${pct(v,ptot)}%</span>`).join('')}</div></div>`:''}
    <div class="card"><div class="card-h"><h3>Average sale by weekday</h3><span class="hint">last 2 months</span></div>${wavg.map((v,i)=>({l:WD[i],v})).map(r=>`<div class="month-row"><span>${r.l}</span><div class="bar"><i style="width:${pct(r.v,wmax)}%"></i></div><b>${kfmt(r.v)}</b></div>`).join('')}</div>
    ${byBrand.length?`<div class="card"><div class="card-h"><h3>Brands · ${MONTHS[+thisM.slice(5)-1]}</h3><span class="hint">scanned items</span></div>${byBrand.map(r=>`<div class="month-row"><span>${esc(r.k)}</span><div class="bar"><i style="width:${pct(r.o.sales,bmax)}%"></i></div><b>${kfmt(r.o.sales)}</b></div>`).join('')}</div>`:''}
    ${bySize.length?`<div class="card"><div class="card-h"><h3>Sizes sold · ${MONTHS[+thisM.slice(5)-1]}</h3><span class="hint">pieces</span></div>${bySize.map(r=>`<div class="month-row"><span>${esc(r.k)}</span><div class="bar good"><i style="width:${pct(r.q,smax)}%"></i></div><b>${r.q}</b></div>`).join('')}</div>`:''}`}

/* ---------- customer return / exchange: pieces, reason, condition ---------- */
const _exchange=screens.exchange;
screens.exchange=function(){const h=_exchange();if(!S.ex)return h;const x=S.ex.bill;
  const R=SK.ret&&SK.ret.bill===x.id?SK.ret:(SK.ret={bill:x.id,rq:{},reason:'',cond:'good'});
  const sel=x.lines.map((l,i)=>({l,i})).filter(({l,i})=>S.ex.sel[i]&&!l.returned);if(!sel.length)return h;
  const block=`<div class="card skret"><div class="card-h"><h3>Coming back</h3><span class="hint">recorded item-wise</span></div>
    ${sel.map(({l,i})=>{const q=R.rq[i]??l.qty;return `<div class="bline"><div class="grow"><b>${esc(l.name)}</b><span>${l.sk?'Stock item'+(l.dno?' · D.no '+esc(l.dno):''):esc(l.cat)} · sold ${l.qty}</span></div>${l.qty>1?`<div class="stepper sm"><button data-act="rtQ" data-i="${i}" data-d="-1" aria-label="Less">−</button><span>${q}</span><button data-act="rtQ" data-i="${i}" data-d="1" aria-label="More">+</button></div>`:`<b>${q}</b>`}</div>`}).join('')}
    <div class="f" style="margin-top:8px"><span class="lab">Reason</span><div class="chips">${SK_REASONS.map(r=>`<button class="chip ${R.reason===r?'on':''}" data-act="rtReason" data-v="${esc(r)}">${esc(r)}</button>`).join('')}</div></div>
    <div class="f" style="margin-top:8px"><span class="lab">Condition of the piece</span><div class="chips"><button class="chip ${R.cond==='good'?'on':''}" data-act="rtCond" data-v="good">Good · back to stock</button><button class="chip ${R.cond==='damaged'?'on':''}" data-act="rtCond" data-v="damaged">Damaged · keep aside</button></div></div>
    ${R.cond==='damaged'?'<p class="warnline" style="margin-top:8px">Damaged pieces are not sellable. They go to the damaged list, ready for goods return to the party.</p>':''}</div>`;
  // show the value of only the pieces coming back
  const all=x.lines.reduce((a,l)=>a+lineAmt(l),0)||1;const share=(l,q)=>{const g=l.price*q;return g-Math.round((x.disc||0)*g/all)};
  const full=sel.reduce((a,{l})=>a+share(l,l.qty),0),part=sel.reduce((a,{l,i})=>a+share(l,Math.min(l.qty,R.rq[i]??l.qty)),0);
  let out=h;if(part!==full){out=out.split('<b>'+inr(full)+'</b>').join('<b>'+inr(part)+'</b>').split('refund '+inr(full)).join('refund '+inr(part))}
  const k=out.indexOf('<div class="btn-row">');return k<0?out+block:out.slice(0,k)+block+out.slice(k)};
const _applyReturn=applyReturn;
applyReturn=function(kind){const x0=S.ex&&S.ex.bill;if(!x0)return _applyReturn(kind);const R=SK.ret&&SK.ret.bill===x0.id?SK.ret:{rq:{},reason:'',cond:'good'};
  // split lines when only some pieces come back, so the rest stay on the bill
  const x=clone(x0);const sel={};let off=0;const lines=[];
  x.lines.forEach((l,i)=>{const on=S.ex.sel[i]&&!l.returned;const q=on?Math.min(l.qty,Math.max(1,R.rq[i]??l.qty)):0;
    if(on&&q<l.qty){lines.push({...l,qty:l.qty-q});lines.push({...l,qty:q});sel[lines.length-1]=true}else{lines.push(l);if(on)sel[lines.length-1]=true}});
  x.lines=lines;S.ex.bill=x;S.ex.sel=sel;
  const back=lines.map((l,i)=>sel[i]?l:null).filter(Boolean);const all=lines.reduce((a,l)=>a+lineAmt(l),0)||1;
  const recs=back.map(l=>({id:'rt_'+uid(),biz:x.biz,at:Date.now(),date:todayStr(),kind,bill:x.id,no:x.no,soldOn:x.date,staff:x.staff||'',sk:l.sk||'',name:l.name,cat:l.cat,bc:l.bc||'',dno:l.dno||'',brand:l.brand||'',size:l.size||'',qty:l.qty,
    value:lineAmt(l)-Math.round((x.disc||0)*lineAmt(l)/all),reason:R.reason||'',cond:R.cond||'good',customer:(x.customer&&x.customer.mobile)||'',by:isAdmin()?'Owner':(DEVICE.name||'counter')}));
  _applyReturn(kind);
  recs.forEach(r=>DB.A.set('skret',r.id,r,false));
  // damaged: the bill change already put the pieces back; move them from sellable to damaged
  if(R.cond==='damaged'){const d={},m={};recs.filter(r=>r.sk).forEach(r=>{d[r.sk]=(d[r.sk]||0)-r.qty;m[r.sk]={dm:DB.A.inc(r.qty)};const it=skItems(x.biz)[r.sk];if(it)it.dm=(+it.dm||0)+r.qty});
    if(Object.keys(d).length){skMove(x.biz,d,'damaged return');skWrite(x.biz,m)}}
  SK.ret=null;delete CACHE['skret|'+x.biz]};

async function skRetExport(){const b=B();const all=skRetData(b.id)||[];try{await skLoad('https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js',()=>window.XLSX)}catch(e){toast('Could not load Excel');return}

/* ============================================================
   v1.5 · A sales dashboard for every store
   - Owner home: one colour card per store (today, month, vs last month, target)
   - Store dashboard: cards chosen per store (Rosy: stock, sizes, brands, returns;
     Pinky: categories, price ranges; Cmore: items, staff…), order and on/off saved
     on the business record (b.dash) and a monthly store target (b.target)
   ============================================================ */
const DCARDS={
  today:['Today by hour','Sales hour by hour today'],
  trend:['Last 30 days','Daily sales, last 30 days'],
  staff:['Staff & targets','Who sold how much this month'],
  cats:['Categories','Sales by category this month'],
  items:['Top items','Best sellers this month'],
  price:['Price ranges','Which price range sells most'],
  pay:['How customers paid','Cash, UPI, card, due this month'],
  week:['Best weekdays','Average sale by weekday'],
  stock:['Stock alerts','Low and out of stock (barcode stores)'],
  brands:['Brands','Brand-wise sales (barcode stores)'],
  sizes:['Sizes','Sizes sold this month (barcode stores)'],
  returns:['Returns','Returns and exchanges this month'],
  cash:['Cash today','Drawer cash and expenses today']
};
function dashDefault(b){const k=`${b.kind||''} ${b.name||''}`.toLowerCase();
  if(/inner|night|lingerie|rosy|garment|cloth/.test(k))return ['today','staff','stock','sizes','brands','cats','returns','pay','trend'];
  if(/jewel|pinky|bangle|ring/.test(k))return ['today','staff','cats','price','items','pay','week','trend'];
  if(/watch|cmore|clock/.test(k))return ['today','staff','items','cats','price','pay','trend','week'];
  return ['today','staff','cats','items','pay','trend']}
const dashCards=b=>(Array.isArray(b.dash)&&b.dash.length?b.dash:dashDefault(b)).filter(k=>DCARDS[k]);
const storeTarget=b=>+b.target||(b.staff||[]).filter(s=>s.active!==false).reduce((a,s)=>a+(+s.target||0),0);
const dk=v=>v>=100000?'₹'+(+(v/100000).toFixed(1))+'L':v>=1000?'₹'+(+(v/1000).toFixed(1))+'k':'₹'+Math.round(v);

/* ---------- numbers for one store ---------- */
function storeNums(b){const t=todayStr();const mStart=t.slice(0,8)+'01';const d0=new Date();const lastM=ym(new Date(d0.getFullYear(),d0.getMonth()-1,1));const [lf]=monthRange(lastM);
  const td=todayOf(b.id);const today=agg(td.flatMap(billRecs));
  const mo=ST.month[b.id]||{sales:0,bills:0,profit:0};
  const docs=need(`d|${lf}|${addDays(t,-1)}`,()=>DB.daily(lf,addDays(t,-1)));
  const day=+t.slice(8);let lastSame=null,lastAll=null;
  if(docs){const mine=docs.filter(x=>x.biz===b.id);lastSame=mine.filter(x=>x.date.startsWith(lastM)&&+x.date.slice(8)<=day).reduce((a,x)=>a+(x.sales||0),0);lastAll=mine.filter(x=>x.date.startsWith(lastM)).reduce((a,x)=>a+(x.sales||0),0)}
  const [,mEnd]=monthRange(t.slice(0,7));const days=+mEnd.slice(8);const target=storeTarget(b);
  return {today,bills:td.length,avg:td.length?Math.round(today.sales/td.length):0,month:mo.sales||0,mBills:mo.bills||0,mProfit:mo.profit||0,lastSame,lastAll,
    change:lastSame?Math.round(((mo.sales||0)-lastSame)/lastSame*100):null,proj:day?Math.round((mo.sales||0)/day*days):0,target,tp:target?pct(mo.sales||0,target):0,
    need:target&&day<days?Math.max(0,Math.round((target-(mo.sales||0))/(days-day+1))):0}}
function spark(b){const t=todayStr();const docs=need(`d|${addDays(t,-13)}|${addDays(t,-1)}`,()=>DB.daily(addDays(t,-13),addDays(t,-1)));if(!docs)return '';
  const vals=[];for(let i=13;i>=1;i--){const d=addDays(t,-i);vals.push((docs.find(x=>x.biz===b.id&&x.date===d)||{}).sales||0)}vals.push(todaySales(b.id));
  const mx=Math.max(1,...vals);const W=120,H=34;const pts=vals.map((v,i)=>`${(i*(W/(vals.length-1))).toFixed(1)},${(H-2-(v/mx)*(H-6)).toFixed(1)}`).join(' ');
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true"><polyline points="${pts}" fill="none" stroke="currentColor" stroke-width="2" vector-effect="non-scaling-stroke" stroke-linejoin="round" stroke-linecap="round"/></svg>`}

    <div class="store-grid">${list.map(x=>{const n=storeNums(x);return `<button class="store-card" data-act="openDash" data-v="${x.id}" style="--sc:${x.color}">
      <div class="sc-top"><span class="sc-dot">${esc(x.short)}</span><b>${esc(x.name)}</b>${ic('chev','chev')}</div>
      <div class="sc-today"><span>Today</span><b>${inr(n.today.sales)}</b><small>${n.bills} bill${n.bills===1?'':'s'}</small></div>
      ${spark(x)}
      <div class="sc-month"><span>Month ${dk(n.month)}</span>${n.change==null?'':`<em class="${n.change>=0?'up':'down'}">${n.change>=0?'▲':'▼'} ${Math.abs(n.change)}%</em>`}</div>
      ${n.target?`<div class="bar ${n.tp>=100?'good':''}"><i style="width:${Math.min(100,n.tp)}%;background:var(--sc)"></i></div><small class="sc-t">${n.tp}% of ${dk(n.target)} target</small>`:'<small class="sc-t">No target set</small>'}
    </button>`}).join('')}</div></section>`}
const _adminHome=adminHome;
adminHome=function(){const h=_adminHome();const a=h.indexOf('<section class="card all-biz">');if(a<0)return h;const z=h.indexOf('</section>',a)+'</section>'.length;return h.slice(0,a)+storeCardsHTML()+h.slice(z)};
const _counterHomeD=counterHome;
counterHome=function(){const h=_counterHomeD();const b=B();const n=storeNums(b);
  const card=`<button class="list-btn" data-act="openDash" data-v="${b.id}">${ic('chart')}<span>${esc(b.name)} dashboard<small>Today ${inr(n.today.sales)} · month ${dk(n.month)}${n.target?` · ${n.tp}% of target`:''}</small></span>${ic('chev','chev')}</button>`;
  const k=h.indexOf('<div class="kgrid">');return k<0?h:h.slice(0,k)+card+h.slice(k)};

/* ---------- store dashboard screen ---------- */
screens.dash=function(){const b=B();const n=storeNums(b);const own=isAdmin();const t=todayStr();const mStart=t.slice(0,8)+'01';
  const bl=bizBills(billsBetween(mStart,t),b.id);const recs=bl?bl.flatMap(billRecs):null;
  const cards=dashCards(b).map(k=>{try{return dashCard(k,b,recs,bl)}catch(e){console.warn(k,e);return ''}}).join('');
  return `${topbar(esc(b.name)+' dashboard','home',bizPill())}
  <div class="pad" style="padding-top:4px;gap:12px;--accent:${b.color};--bar:color-mix(in srgb,${b.color} 35%,var(--surface))">
    <section class="dash-hero" style="--sc:${b.color}">
      <div class="dh-top"><span>${new Date().toLocaleDateString('en-IN',{weekday:'long',day:'numeric',month:'short'})}</span>${own?`<button data-act="dashEdit">${ic('sliders')} Customise</button>`:''}</div>
      <p class="dh-l">Today's sales</p><p class="dh-big">${inr(n.today.sales)}</p>
      <div class="dh-row"><div><span>Bills</span><b>${n.bills}</b></div><div><span>Avg bill</span><b>${inr(n.avg)}</b></div><div><span>Items</span><b>${n.today.items}</b></div>${own?`<div><span>${ic('lock')}Profit</span><b>${inr(n.today.profit)}</b></div>`:''}</div>
      <div class="dh-month"><div><span>This month</span><b>${inr(n.month)}</b>${n.change==null?'':`<em>${n.change>=0?'▲':'▼'} ${Math.abs(n.change)}% vs last month</em>`}</div>
        <div><span>On track for</span><b>${inr(n.proj)}</b>${n.lastAll!=null?`<em>last month ${dk(n.lastAll)}</em>`:''}</div></div>
      ${n.target?`<div class="dh-target"><div class="bar"><i style="width:${Math.min(100,n.tp)}%"></i></div><span>${n.tp}% of ${inr(n.target)} target${n.tp<100&&n.need?` · need ${inr(n.need)}/day`:n.tp>=100?' · target reached 🎉':''}</span></div>`:own?`<button class="dh-set" data-act="dashEdit">Set a monthly target for ${esc(b.name)}</button>`:''}
    </section>
    <div class="qa"><button data-act="newSale">${ic('bill')}New sale</button>${skHas(b.id)?`<button data-go="stock">${ic('scan')}Stock</button>`:''}<button data-go="exchange">${ic('swap')}Exchange</button>${own?`<button data-go="reports">${ic('chart')}Reports</button>`:''}</div>
    ${cards||'<div class="empty">No cards switched on. Tap Customise.</div>'}
  </div>`};
NAV_OF.dash='home';

function dashCard(k,b,recs,bl){const [title]=DCARDS[k];const box=(body,link)=>`<section class="card dcard"><div class="card-h"><h3>${title}</h3>${link||''}</div>${body}</section>`;
  const wait='<p class="hint">Loading…</p>';const rows=(list,fmt,max,col)=>{const mx=max||Math.max(1,...list.map(r=>r.v));return list.map(r=>`<div class="month-row"><span>${esc(r.l)}</span><div class="bar"><i style="width:${pct(r.v,mx)}%;background:${col||b.color}"></i></div><b>${fmt(r)}</b></div>`).join('')};
  switch(k){
    case 'today':return box(chart('today'));
    case 'trend':return box(chart('30d'));
    case 'staff':{const mo=ST.month[b.id]||{};const st=(b.staff||[]).filter(x=>x.active!==false).map(s=>({s,m:(mo.staff&&mo.staff[s.id])||{sales:0,bills:0}})).sort((x,y)=>y.m.sales-x.m.sales);
      return box(st.length?`<div class="rows">${st.map(({s,m},i)=>{const a=pct(m.sales,s.target||0);return `<div class="row" style="flex-wrap:wrap" ${isAdmin()?`data-act="openStaff" data-v="${s.id}"`:''}><div class="rank">${i+1}</div><div class="grow"><b>${esc(s.name)}</b><span>${m.bills||0} bills${s.target?` · target ${dk(s.target)}`:''}</span></div><div class="end"><b>${inr(m.sales)}</b><span>${s.target?a+'%':''}</span></div>${s.target?`<div class="bar ${a>=100?'good':''}" style="flex-basis:100%"><i style="width:${Math.min(a,100)}%;background:${a>=100?'':b.color}"></i></div>`:''}</div>`}).join('')}</div>`:'<p class="hint">No staff yet.</p>')}
    case 'cats':{if(!recs)return box(wait);const g=Object.entries(groupBy(recs,'cat')).map(([c,x])=>({l:c,v:agg(x).sales,q:agg(x).items})).sort((x,y)=>y.v-x.v).slice(0,8);return box(g.length?rows(g,r=>dk(r.v)):'<p class="hint">No sales yet this month.</p>')}
    case 'items':{if(!recs)return box(wait);const g=Object.values(groupBy(recs,r=>r.cat+'|'+r.item)).map(x=>({l:x[0].item,c:x[0].cat,o:agg(x)})).sort((x,y)=>y.o.sales-x.o.sales).slice(0,6);
      return box(g.length?`<div class="rows">${g.map((r,i)=>`<div class="row"><div class="rank">${i+1}</div><div class="grow"><b>${esc(r.l)}</b><span>${esc(r.c)}</span></div><div class="end"><b>${inr(r.o.sales)}</b><span>${r.o.items} sold</span></div></div>`).join('')}</div>`:'<p class="hint">No sales yet this month.</p>')}
    case 'price':{if(!recs)return box(wait);const g=Object.entries(groupBy(recs,r=>bandOf(r.price))).map(([i,x])=>({i:+i,v:x.reduce((a,r)=>a+r.qty,0)})).sort((x,y)=>x.i-y.i).map(r=>({l:BANDS[r.i+1]===Infinity?`${dk(BANDS[r.i])}+`:`${dk(BANDS[r.i])}–${dk(BANDS[r.i+1])}`,v:r.v}));
      const top=g.reduce((m,r)=>r.v>(m?m.v:-1)?r:m,null);return box(g.length?rows(g,r=>r.v+' pcs')+(top?`<p class="hint" style="margin-top:6px">Most pieces sell at <b>${esc(top.l)}</b></p>`:''):'<p class="hint">No sales yet this month.</p>')}
    case 'pay':{if(!bl)return box(wait);const p={Cash:0,UPI:0,Card:0,Due:0};bl.forEach(x=>{const m=billMoney(x);p.Cash+=m.Cash||0;p.UPI+=m.UPI||0;p.Card+=m.Card||0;p.Due+=x.due||0});const tot=Object.values(p).reduce((a,v)=>a+v,0);
      return box(tot?`<div class="paybar">${Object.entries(p).filter(([,v])=>v>0).map(([k2,v])=>`<i class="p-${k2}" style="flex:${v}"></i>`).join('')}</div><div class="paylegend">${Object.entries(p).map(([k2,v])=>`<span><i class="p-${k2}"></i>${k2} <b>${inr(v)}</b> ${pct(v,tot)}%</span>`).join('')}</div>`:'<p class="hint">No payments yet this month.</p>')}
    case 'week':{const t=todayStr();const docs=need(`d|${addDays(t,-56)}|${addDays(t,-1)}`,()=>DB.daily(addDays(t,-56),addDays(t,-1)));if(!docs)return box(wait);
      const s=[0,0,0,0,0,0,0],c=[0,0,0,0,0,0,0];docs.filter(x=>x.biz===b.id).forEach(x=>{const w=parseYmd(x.date).getDay();s[w]+=x.sales||0;c[w]++});const WD=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
      const g=[1,2,3,4,5,6,0].map(i=>({l:WD[i],v:c[i]?s[i]/c[i]:0}));return box(rows(g,r=>dk(r.v))+'<p class="hint" style="margin-top:6px">Last 8 weeks</p>')}
    case 'stock':{if(!skHas(b.id))return isAdmin()?box(`<p class="hint">No stock list for ${esc(b.name)} yet.</p><button class="secondary" data-go="stock" style="margin-top:8px">${ic('scan')} Import stock</button>`):'';
      const its=Object.entries(skItems(b.id)).map(([key,it])=>({key,it}));const s=skStats(its);const low=its.filter(x=>skLow(x.it)).sort((a,c)=>skQty(a.it)-skQty(c.it)).slice(0,5);
      return box(`<div class="kgrid"><div class="kpi"><span>Pieces</span><b>${s.pcs.toLocaleString('en-IN')}</b></div><div class="kpi"><span>At MRP</span><b>${dk(s.mrp)}</b></div><button class="kpi skk" data-act="dashStock" data-v="low"><span>Low</span><b style="color:var(--warn)">${s.low}</b></button><button class="kpi skk" data-act="dashStock" data-v="out"><span>Out</span><b style="color:var(--bad)">${s.out}</b></button></div>
        ${low.length?`<div class="sklist" style="margin-top:8px">${low.map(({key,it})=>`<button class="skrow" data-act="skOpen" data-k="${esc(key)}"><div><b>${esc(it.n)}</b><span>${esc(it.c||'')}</span></div><em></em><i class="low">${skQty(it)}</i></button>`).join('')}</div>`:''}`,`<button class="ghost-btn" data-go="stock">Open</button>`)}
    case 'brands':{if(!recs)return box(wait);const g=Object.entries(groupBy(recs.filter(r=>r.brand),'brand')).map(([c,x])=>({l:c,v:agg(x).sales})).sort((x,y)=>y.v-x.v).slice(0,8);if(!g.length&&!skHas(b.id))return '';return box(g.length?rows(g,r=>dk(r.v)):'<p class="hint">Brands appear once barcode items are sold.</p>')}
    case 'sizes':{if(!recs)return box(wait);const g=Object.entries(groupBy(recs.filter(r=>r.size),'size')).map(([c,x])=>({l:c,v:x.reduce((a,r)=>a+r.qty,0)})).sort((x,y)=>y.v-x.v).slice(0,10);if(!g.length&&!skHas(b.id))return '';return box(g.length?rows(g,r=>r.v+' pcs',0,'var(--good)'):'<p class="hint">Sizes appear once barcode items are sold.</p>')}
    case 'returns':{const all=skRetData(b.id);if(!all)return box(wait);const m=todayStr().slice(0,7);const rs=all.filter(r=>r.date.startsWith(m));const q=k2=>rs.filter(r=>r.kind===k2).reduce((a,r)=>a+r.qty,0);
      const reasons=Object.entries(groupBy(rs.filter(r=>r.kind!=='supplier'),'reason')).map(([c,x])=>({l:c||'—',v:x.reduce((a,r)=>a+r.qty,0)})).sort((x,y)=>y.v-x.v).slice(0,4);
      return box(`<div class="kgrid"><div class="kpi"><span>Returned</span><b>${q('refund')}</b></div><div class="kpi"><span>Exchanged</span><b>${q('exchange')}</b></div></div>${reasons.length?`<div style="margin-top:8px">${rows(reasons,r=>r.v)}</div>`:''}`,skHas(b.id)?`<button class="ghost-btn" data-go="skReturns">Report</button>`:'')}
    case 'cash':return typeof moneyCard==='function'?moneyCard(b):'';
  }return ''}

/* ---------- customise sheet ---------- */
function dashEditSheet(){const b=B();const on=S.dashDraft||(S.dashDraft=dashCards(b).slice());const off=Object.keys(DCARDS).filter(k=>!on.includes(k));const tg=S.dashTarget!=null?S.dashTarget:(+b.target||'');
  return `<button class="overlay-bg" data-act="dashClose" aria-label="Close"></button>
  <div class="sheet" role="dialog" aria-label="Customise dashboard"><div class="grab"></div><div class="sh-body"><h3>${esc(b.name)} dashboard</h3>
    <div class="f"><label for="dashTgt">Monthly sales target for ${esc(b.name)} ₹</label><input id="dashTgt" inputmode="numeric" value="${tg}" placeholder="${storeTarget({...b,target:0})||'e.g. 500000'}"><small>Blank = total of staff targets</small></div>
    <p class="lab" style="margin:0">Cards shown, in order</p>
    <div class="dlist">${on.map((k,i)=>`<div class="drow on"><div class="grow"><b>${DCARDS[k][0]}</b><span>${DCARDS[k][1]}</span></div><button data-act="dashMove" data-v="${k}" data-d="-1" ${i?'':'disabled'} aria-label="Move up">▲</button><button data-act="dashMove" data-v="${k}" data-d="1" ${i<on.length-1?'':'disabled'} aria-label="Move down">▼</button><button class="x" data-act="dashToggle" data-v="${k}" aria-label="Hide">×</button></div>`).join('')}</div>
    ${off.length?`<p class="lab" style="margin:0">Add a card</p><div class="chips">${off.map(k=>`<button class="chip" data-act="dashToggle" data-v="${k}">+ ${DCARDS[k][0]}</button>`).join('')}</div>`:''}
    <button class="primary" data-act="dashSave">SAVE DASHBOARD</button>
    <button class="linkbtn" data-act="dashReset">Reset to ${esc(b.name)} default</button>
  </div></div>`}
window.EXTRA_OV=Object.assign(window.EXTRA_OV,{dashEdit:dashEditSheet});

document.addEventListener('click',e=>{const a=e.target.closest('[data-act]');if(!a)return;const b=B();const v=a.dataset.v;
  switch(a.dataset.act){
    case 'openDash':if(isAdmin()&&v&&S.biz!==v){S.biz=v;resetSale();S.saleCat=null;S.ex=null;S.exResults=null;S.rCat='All';S.bookBiz=null}go('dash');return;
    case 'dashEdit':S.dashDraft=null;S.dashTarget=null;S.overlay='dashEdit';render();return;
    case 'dashClose':S.overlay=null;S.dashDraft=null;S.dashTarget=null;render();return;
    case 'dashToggle':{const d=S.dashDraft;const i=d.indexOf(v);if(i>=0)d.splice(i,1);else d.push(v);render();return}
    case 'dashMove':{const d=S.dashDraft;const i=d.indexOf(v);const j=i+ +a.dataset.d;if(j<0||j>=d.length)return;[d[i],d[j]]=[d[j],d[i]];render();return}
    case 'dashReset':S.dashDraft=dashDefault(b).slice();render();return;
    case 'dashSave':{const tg=$('dashTgt')?Math.max(0,parseInt($('dashTgt').value)||0):(+b.target||0);b.dash=S.dashDraft.slice();b.target=tg;DB.saveBiz(b);S.overlay=null;S.dashDraft=null;S.dashTarget=null;render();toast(`${b.name} dashboard saved`);return}
    case 'dashStock':SK.filter={q:'',cat:'',brand:'',status:v,limit:60};go('stock');return;
  }});
document.addEventListener('input',e=>{if(e.target.id==='dashTgt')S.dashTarget=e.target.value.replace(/\D/g,'')});

/* ============================================================
   v1.6 · Sales style per store
   stock  = barcode / stock billing only (Rosy): scan bar + stock search, tiles hidden
   quick  = quick items: category tiles → price → cost code word, no scan bar, no stock
   both   = both on the same screen
   Saved on the business record as b.saleMode
   ============================================================ */
const SM_LABEL={stock:['Stock · barcode','Scan or search stock. Stock goes down with every bill.'],quick:['Quick items','Tap category → item → price → code word. No stock.'],both:['Both','Scan stock items and tap quick items on the same bill.']};
const saleMode=b=>b&&SM_LABEL[b.saleMode]?b.saleMode:(b&&skHas(b.id)?'both':'quick');
S.smManual=false;

/* New sale screen per style */
const _saleSM=screens.sale;
screens.sale=function(){const b=B();const mode=saleMode(b);let h=_saleSM();
  if(mode==='stock'){
    const manual=S.smManual||(S.cart.some(l=>!l.sk)&&!!S.cart.length);
    h=h.replace('<div class="pad" style="padding-top:2px;gap:12px">',`<div class="pad ${manual?'':'sm-stock'}" style="padding-top:2px;gap:12px">`);
    const i=h.indexOf('id="saleSearch"');if(i>0){const j=h.lastIndexOf('<div class="search">',i);if(j>0)h=h.slice(0,j)+'<div class="search sale-find">'+h.slice(j+'<div class="search">'.length)}
    h=h.replace('Tap an item → type price and code → Add','Scan a barcode to start the bill');
    const k=h.indexOf('<div class="skbar" id="skBar">');const end=k>0?h.indexOf('</div></div>',h.indexOf('id="skSug"',k)):-1;
    const link=`<button class="linkbtn sm-manual" data-act="smManual">${manual?'Hide items without barcode':'+ Item without barcode (tap from list)'}</button>`;
    if(k>0){const p=h.indexOf('<p class="hint">',k);const q=h.indexOf('</p>',p)+4;h=h.slice(0,q)+link+h.slice(q)}else h=h.replace('<div class="search sale-find">',link+'<div class="search sale-find">');
  }
  return h};
const _skBarSM=skBarHTML;
skBarHTML=function(){const b=B();if(saleMode(b)==='quick')return '<div id="skBar" hidden></div>';return _skBarSM()};
const _skScanSM=skScan;
skScan=function(code){const b=B();if(saleMode(b)==='quick')return false;return _skScanSM(code)};

/* counter home + dashboard follow the style */
const _counterHomeSM=counterHome;
counterHome=function(){let h=_counterHomeSM();const b=B();if(saleMode(b)==='quick'){const a=h.indexOf('<button class="list-btn" data-go="stock">');if(a>=0){const z=h.indexOf('</button>',a)+9;h=h.slice(0,a)+h.slice(z)}}
  return h.replace('+ NEW SALE',saleMode(b)==='stock'?'+ NEW SALE · SCAN':'+ NEW SALE')};
const _dashCardSM=dashCard;
dashCard=function(k,b,recs,bl){if(saleMode(b)==='quick'&&['stock','brands','sizes','returns'].includes(k)&&!skHas(b.id))return '';return _dashCardSM(k,b,recs,bl)};

/* Businesses screen: choose the style for each store */
const _bizScr=screens.businesses;
screens.businesses=function(){let h=_bizScr();
  activeBiz().forEach(b=>{const tag=`data-act="editBiz" data-v="${b.id}"`;const a=h.indexOf(tag);if(a<0)return;const g=h.indexOf('<div class="sm-grid">',a);if(g<0)return;const m=saleMode(b);
    const block=`<div class="sm-style"><span class="lab">Sales screen</span><div class="chips">${Object.entries(SM_LABEL).map(([k,[l]])=>`<button class="chip ${m===k?'on':''}" data-act="smSet" data-b="${b.id}" data-v="${k}">${l}</button>`).join('')}</div><small class="hint">${SM_LABEL[m][1]}${m!=='quick'&&!skHas(b.id)?' Import stock first: More → Stock & barcodes.':''}</small></div>`;
    h=h.slice(0,g)+block+h.slice(g)});
  return h};

document.addEventListener('click',e=>{const a=e.target.closest('[data-act]');if(!a)return;
  if(a.dataset.act==='smSet'){const x=ST.biz.find(y=>y.id===a.dataset.b);if(!x)return;x.saleMode=a.dataset.v;DB.saveBiz(x);render();toast(`${x.name}: ${SM_LABEL[x.saleMode][0]}`);return}
  if(a.dataset.act==='smManual'){S.smManual=!S.smManual;render();return}
  if(a.dataset.act==='newSale'||a.dataset.act==='setBiz')S.smManual=false;
},true);
const _saveSaleSM=saveSale;saveSale=function(){_saveSaleSM();S.smManual=false};

</script>
